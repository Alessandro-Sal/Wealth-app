<script>
// --- GLOBAL VARIABLES FOR PORTFOLIO EVOLUTION ---
let evoChartInstance = null;
let currentEvoData = [];
let evoSortDirection = {}; // Tracks sort order (asc/desc) for each column

/**
 * Fetches historical portfolio evolution data for the selected year.
 * Initializes both the dynamic table and the related chart.
 * @param {string|number} year The year to filter the data (e.g. "2026")
 */
function fetchHistoricalPortfolioEvo(year) {
    const tbody = document.getElementById('evo-table-body');
    if (!tbody) return;
    
    // Show loading state
    tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 20px; color: var(--gray);">Loading historical data...</td></tr>';
    
    run('getHistoricalPortfolio', year).then(data => {
        // Handle Server Error
        if (data && data.error) {
            tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; padding: 20px; color: var(--danger);">Server Error: ${data.error}</td></tr>`;
            if (evoChartInstance) evoChartInstance.destroy();
            return;
        }
        
        // Handle Empty Data
        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; padding: 20px; color: var(--gray);">No positions found for ${year}.</td></tr>`;
            if (evoChartInstance) evoChartInstance.destroy();
            return;
        }
        
        // Save data globally for sorting capability
        currentEvoData = data;
        
        // Render Table & Chart
        renderEvoTable(currentEvoData);
        renderEvoChart(currentEvoData);
        
    }).catch(err => {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; padding: 20px; color: var(--danger);">JS Error: ${err.message || err}</td></tr>`;
        console.error("Error in fetchHistoricalPortfolioEvo:", err);
    });
}

/**
 * Renders the HTML rows for the Evolution Table.
 * Adds dynamic hover effects and formats values based on performance.
 * @param {Array} data The formatted array of asset objects
 */
function renderEvoTable(data) {
    const tbody = document.getElementById('evo-table-body');
    if (!tbody) return;

    let html = '';
    data.forEach(row => {
        const perfStr = String(row.performance || "0%");
        const isNegative = perfStr.includes('-');
        const colorClass = isNegative ? 'var(--danger)' : 'var(--success)';
        
        html += `
            <tr style="border-bottom: 1px solid var(--row-border); transition: background 0.2s;" onmouseover="this.style.background='rgba(0,122,255,0.05)'" onmouseout="this.style.background='transparent'">
                <td style="padding: 12px 10px; font-weight: 800; color: var(--text-main);">${row.ticker}</td>
                <td style="padding: 12px 10px; color: var(--gray); font-size: 11px;">${row.type}</td>
                <td style="padding: 12px 10px; text-align: right;">${row.qty}</td>
                <td style="padding: 12px 10px; text-align: right; color: var(--gray); min-width: 80px; white-space: nowrap;"><span class="sensitive">${row.priceOrig}</span></td>
                <td style="padding: 12px 10px; text-align: right; font-weight: 600; min-width: 80px; white-space: nowrap;"><span class="sensitive">${row.priceEur}</span></td>
                <td style="padding: 12px 10px; text-align: right; min-width: 90px; white-space: nowrap;"><span class="sensitive">${row.invested}</span></td>
                <td style="padding: 12px 10px; text-align: right; font-weight: 800; color: var(--text-main); min-width: 100px; white-space: nowrap;"><span class="sensitive">${row.value}</span></td>
                <td style="padding: 12px 10px; text-align: right; color: ${colorClass}; font-weight: 700; min-width: 90px; white-space: nowrap;"><span class="sensitive">${row.gainLoss}</span></td>
                <td style="padding: 12px 10px; text-align: right; color: ${colorClass}; font-weight: 800; background: ${isNegative ? 'rgba(255, 59, 48, 0.05)' : 'rgba(52, 199, 89, 0.05)'}; min-width: 75px;">${perfStr}</td>
            </tr>
        `;
    });
    
    tbody.innerHTML = html;
}

/**
 * Handles sorting logic when a user clicks on a table header.
 * Automatically detects strings vs numbers for accurate sorting.
 * @param {number} colIndex The zero-based index of the clicked column
 */
function sortEvoTable(colIndex) {
    if (!currentEvoData || currentEvoData.length === 0) return;
    
    // Toggle sort direction for this specific column
    evoSortDirection[colIndex] = !evoSortDirection[colIndex];
    const isAsc = evoSortDirection[colIndex];

    // Map column index to data keys
    const keys = ['ticker', 'type', 'qty', 'priceOrig', 'priceEur', 'invested', 'value', 'gainLoss', 'performance'];
    const key = keys[colIndex];

    currentEvoData.sort((a, b) => {
        let valA = a[key];
        let valB = b[key];

        // Clean values to check if they are purely numeric (removes €/$/% and converts , to .)
        let numA = parseFloat(String(valA).replace(/[^0-9,-]/g, '').replace(',', '.'));
        let numB = parseFloat(String(valB).replace(/[^0-9,-]/g, '').replace(',', '.'));

        // If both values translate to valid numbers, perform numeric sorting
        // Exception: Ticker and Type columns should always sort alphabetically
        if (!isNaN(numA) && !isNaN(numB) && key !== 'ticker' && key !== 'type') {
            return isAsc ? numA - numB : numB - numA;
        }

        // Fallback: alphabetical string sorting
        valA = String(valA).toLowerCase();
        valB = String(valB).toLowerCase();
        if (valA < valB) return isAsc ? -1 : 1;
        if (valA > valB) return isAsc ? 1 : -1;
        return 0;
    });

    // Re-render the sorted table
    renderEvoTable(currentEvoData);
}

/**
 * Renders a grouped bar chart comparing "Invested" vs "Current Value" for the assets.
 * @param {Array} data The array of asset objects
 */
function renderEvoChart(data) {
    const canvas = document.getElementById('evoChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    if (evoChartInstance) {
        evoChartInstance.destroy();
    }

    // Sort data by Current Value (descending) so the largest holdings are on the left
    const sortedData = [...data].sort((a, b) => {
        let valA = parseFloat(String(a.value).replace(/[^0-9,-]/g, '').replace(',', '.')) || 0;
        let valB = parseFloat(String(b.value).replace(/[^0-9,-]/g, '').replace(',', '.')) || 0;
        return valB - valA;
    });

    // Limit to top 15 assets to keep the chart readable
    const topData = sortedData.slice(0, 15);

    const labels = topData.map(d => d.ticker);
    
    // Parse Invested and Value to clean numbers
    const investedData = topData.map(d => parseFloat(String(d.invested).replace(/[^0-9,-]/g, '').replace(',', '.')) || 0);
    const valueData = topData.map(d => parseFloat(String(d.value).replace(/[^0-9,-]/g, '').replace(',', '.')) || 0);

    const isDark = document.body.classList.contains('dark-mode');
    const gridColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.05)';
    const textColor = isDark ? '#fff' : '#333';

    evoChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Invested',
                    data: investedData,
                    backgroundColor: '#8e8e93', // Gray
                    borderRadius: 4
                },
                {
                    label: 'Value',
                    data: valueData,
                    backgroundColor: '#007aff', // Blue
                    borderRadius: 4
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { color: textColor, font: { size: 11 }, usePointStyle: true, boxWidth: 8, padding: 20 }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            // Mask values in privacy mode
                            if (document.body.classList.contains('privacy-mode')) return context.dataset.label + ': ****';
                            return context.dataset.label + ': ' + new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(context.raw);
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: { color: textColor, font: { size: 10, weight: 'bold' } }
                },
                y: {
                    grid: { color: gridColor, borderDash: [5, 5] },
                    border: { display: false },
                    ticks: {
                        color: textColor,
                        font: { size: 10 },
                        callback: function(value) {
                            // Mask y-axis ticks in privacy mode
                            if (document.body.classList.contains('privacy-mode')) return '****';
                            return new Intl.NumberFormat('it-IT', { notation: "compact" }).format(value);
                        }
                    }
                }
            }
        }
    });
}

// --- GLOBAL VARIABLES FOR CASHFLOW ---
let cashflowChartInstance = null;

/**
 * Fetches and renders cashflow data from the server, filtered by year.
 * @param {string} year The year selected in the recap dropdown (e.g. "2024" or "All")
 */
function fetchPortfolioCashflow(year) {
    // Mostra lo stato di caricamento nella tabella
    const tbody = document.getElementById('cashflow-table-body');
    if (tbody) tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: var(--gray);">Loading cashflow data...</td></tr>';

    run('getPortfolioCashflowData').then(data => {
        if (data && data.error) {
            if (tbody) tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--danger); padding: 20px;">Error: ${data.error}</td></tr>`;
            if (cashflowChartInstance) cashflowChartInstance.destroy();
            return;
        }
        
        if (!data || data.length === 0) {
            if (tbody) tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--gray); padding: 20px;">No cashflow data found.</td></tr>`;
            if (cashflowChartInstance) cashflowChartInstance.destroy();
            return;
        }

        // 1. FILTRA I DATI IN BASE ALL'ANNO SELEZIONATO
        let filteredData = data;
        // Adatta "All" / "Tutti" in base al value che hai nel tuo tag <select>
        if (year && year !== 'All' && year !== 'Tutti' && year !== '') { 
            filteredData = data.filter(row => String(row.year) === String(year));
        }

        // 2. GESTISCI IL CASO IN CUI NON CI SONO DATI PER L'ANNO SPECIFICO
        if (filteredData.length === 0) {
            if (tbody) tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--gray); padding: 20px;">No cashflow data found for ${year}.</td></tr>`;
            if (cashflowChartInstance) cashflowChartInstance.destroy();
            return;
        }

        // 3. RENDERIZZA TABELLA E GRAFICO
        renderCashflowTable(filteredData);
        
        // NOTA SUL GRAFICO: 
        // Passando filteredData, il grafico mostrerà solo le colonne dell'anno selezionato.
        // Se preferisci che il grafico mostri SEMPRE lo storico di tutti gli anni a prescindere 
        // dalla tendina, cambia la riga sotto in: renderCashflowChart(data);
        renderCashflowChart(filteredData); 
        
    }).catch(err => {
        console.error("Error fetching cashflow data:", err);
        if (tbody) tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--danger); padding: 20px;">JS Error: ${err.message || err}</td></tr>`;
    });
}

/**
 * Renders the HTML table for cashflow data.
 * Applies privacy mode spans, conditional colors, and exact Portfolio Evolution styling.
 * @param {Array} data The cashflow data array
 */
function renderCashflowTable(data) {
    const tbody = document.getElementById('cashflow-table-body');
    if (!tbody) return;

    let html = '';
    data.forEach(row => {
        // Check if Net Flow is negative
        const isNegative = String(row.netFlow).includes('-');
        const colorClass = isNegative ? 'var(--danger)' : 'var(--success)';
        
        html += `
            <tr style="border-bottom: 1px solid var(--row-border); transition: background 0.2s;" onmouseover="this.style.background='rgba(0,122,255,0.05)'" onmouseout="this.style.background='transparent'">
                <td style="padding: 12px 10px; font-weight: 800; color: var(--text-main);">${row.year}</td>
                <td style="padding: 12px 10px; color: var(--gray); font-size: 11px;">${row.assetType}</td>
                <td style="padding: 12px 10px; text-align: right; min-width: 90px; white-space: nowrap;"><span class="sensitive">${row.deposits}</span></td>
                <td style="padding: 12px 10px; text-align: right; min-width: 90px; white-space: nowrap;"><span class="sensitive">${row.withdrawals}</span></td>
                <td style="padding: 12px 10px; text-align: right; min-width: 90px; white-space: nowrap;"><span class="sensitive">${row.netDividends}</span></td>
                <td style="padding: 12px 10px; text-align: right; font-weight: 800; color: var(--text-main); min-width: 100px; white-space: nowrap;"><span class="sensitive">${row.totalInflow}</span></td>
                <td style="padding: 12px 10px; text-align: right; color: ${colorClass}; font-weight: 800; background: ${isNegative ? 'rgba(255, 59, 48, 0.05)' : 'rgba(52, 199, 89, 0.05)'}; min-width: 100px; white-space: nowrap;"><span class="sensitive">${row.netFlow}</span></td>
            </tr>
        `;
    });
    
    tbody.innerHTML = html;
}

/**
 * Renders a grouped bar chart aggregating data by Year.
 * Compares Total Deposits vs Total Inflows for each year.
 * @param {Array} data The cashflow data array
 */
function renderCashflowChart(data) {
    const canvas = document.getElementById('cashflowChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    if (cashflowChartInstance) {
        cashflowChartInstance.destroy();
    }

    // Extract unique sorted years
    const years = [...new Set(data.map(d => d.year))].sort();

    // Helper function to clean Italian currency strings and convert to float
    // e.g., "€ 16.217,12" -> 16217.12
    const parseCurrency = (valStr) => {
        const cleanStr = String(valStr).replace(/[^0-9,-]/g, '').replace(',', '.');
        return parseFloat(cleanStr) || 0;
    };

    // Aggregate Deposits and Inflows by Year
    const yearlyDeposits = years.map(year => {
        return data.filter(d => d.year === String(year))
                   .reduce((sum, d) => sum + parseCurrency(d.deposits), 0);
    });

    const yearlyInflows = years.map(year => {
        return data.filter(d => d.year === String(year))
                   .reduce((sum, d) => sum + parseCurrency(d.totalInflow), 0);
    });

    const isDark = document.body.classList.contains('dark-mode');
    const textColor = isDark ? '#fff' : '#333';
    const gridColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.05)';

    cashflowChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: years,
            datasets: [
                {
                    label: 'Total Deposits (Buys)',
                    data: yearlyDeposits,
                    backgroundColor: '#ff9500', // Warning/Orange
                    borderRadius: 4
                },
                {
                    label: 'Total Inflow (Sells + Divs)',
                    data: yearlyInflows,
                    backgroundColor: '#34c759', // Success/Green
                    borderRadius: 4
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { color: textColor, font: { size: 11 }, usePointStyle: true, boxWidth: 8, padding: 20 }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            // Apply privacy mode to tooltips
                            if (document.body.classList.contains('privacy-mode')) return context.dataset.label + ': ****';
                            return context.dataset.label + ': ' + new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(context.raw);
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: { color: textColor, font: { weight: 'bold' } }
                },
                y: {
                    grid: { color: gridColor, borderDash: [5, 5] },
                    border: { display: false },
                    ticks: {
                        color: textColor,
                        callback: function(value) {
                            // Apply privacy mode to y-axis
                            if (document.body.classList.contains('privacy-mode')) return '****';
                            return new Intl.NumberFormat('it-IT', { notation: "compact" }).format(value);
                        }
                    }
                }
            }
        }
    });
}

// --- GLOBAL VARIABLES FOR CLOSED POSITIONS ---
let cpData = [];
let cpSubView = 'overview'; 
let cpSortCol = 'totalPnL';
let cpSortAsc = false;

function fetchClosedPositions() {
    run('getClosedPositionsData').then(data => {
        if (data && data.error) {
            document.getElementById('cp-table-body').innerHTML = `<tr><td colspan="15" style="text-align: center; color: var(--danger); padding: 20px;">Error: ${data.error}</td></tr>`;
            return;
        }
        
        cpData = data;
        document.getElementById('cp-count').innerText = `${data.length} Positions`;
        calculateAndRenderCPKPIs();
        renderCPTerminal();
        renderCPScatterChart();
        
    }).catch(err => console.error("Error fetching closed positions:", err));
}

function setCPView(view, btnElement) {
    cpSubView = view;
    // Resetta i bottoni
    const btns = btnElement.parentElement.querySelectorAll('.term-view-btn');
    btns.forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
    renderCPTerminal();
}

function sortCPTerminal(colKey) {
    if (cpSortCol === colKey) { cpSortAsc = !cpSortAsc; } 
    else { cpSortCol = colKey; cpSortAsc = false; }
    renderCPTerminal();
}

// Reuse the parse logic from Market to sort EUR/USD/% values correctly
function parseCPSort(val) {
    if (!val || val === '-' || val === '#N/A' || val === '') return -Infinity; 
    let s = String(val).replace(/[€$%+ ]/g, '').trim();
    let lastComma = s.lastIndexOf(',');
    let lastDot = s.lastIndexOf('.');
    if (lastComma > lastDot) s = s.replace(/\./g, '').replace(',', '.');
    else if (lastDot > lastComma) s = s.replace(/,/g, '');
    else if (s.includes(',')) s = s.replace(',', '.');
    let n = parseFloat(s);
    return isNaN(n) ? String(val).toLowerCase() : n;
}

// Reuse the Heatmap Style logic from Market
function getCPHeatmapStyle(val) {
    if (!val || val === '-' || val === '#N/A' || val === '') return '';
    let n = parseCPSort(val);
    if (n === -Infinity || isNaN(n) || n === 0) return '';
    let intensity = Math.min(Math.abs(n) / 1000, 1);
    let alpha = 0.05 + (intensity * 0.35);
    if (String(val).includes('%')) alpha = 0.05 + (Math.min(Math.abs(n) / 50, 1) * 0.35); // Scale for %
    if (n > 0) return `background-color: rgba(52, 199, 89, ${alpha}); color: var(--text-main); font-weight: 800;`;
    if (n < 0) return `background-color: rgba(255, 59, 48, ${alpha}); color: var(--text-main); font-weight: 800;`;
    return '';
}

/**
 * Calculates and renders category-specific KPIs for Closed Positions.
 * Splits insights by Stocks, ETFs, and Crypto.
 */
function calculateAndRenderCPKPIs() {
    const container = document.getElementById('cp-kpi-container');
    if (!container) return;

    // Define the categories we want to track
    const categories = {
        'Stock': { title: '📈 Stocks', pnl: 0, wins: 0, best: null, worst: null, totalDays: 0, count: 0 },
        'ETF': { title: '🧺 ETFs', pnl: 0, wins: 0, best: null, worst: null, totalDays: 0, count: 0 },
        'Crypto': { title: '🪙 Crypto', pnl: 0, wins: 0, best: null, worst: null, totalDays: 0, count: 0 }
    };

    // Parse data and assign to categories
    cpData.forEach(d => {
        let type = d.type;
        // Fallback for custom types, map them to 'Other' if needed, but we focus on the main 3
        if (!categories[type]) return; 

        let pnl = parseCPSort(d.totalPnL);
        let days = parseInt(d.daysHeld) || 0;

        if (pnl !== -Infinity) {
            let cat = categories[type];
            cat.count++;
            cat.pnl += pnl;
            cat.totalDays += days;
            if (pnl > 0) cat.wins++;

            // Check for Best Trade
            if (!cat.best || pnl > cat.best.pnl) {
                cat.best = { ticker: d.ticker, pnl: pnl };
            }
            // Check for Worst Trade
            if (!cat.worst || pnl < cat.worst.pnl) {
                cat.worst = { ticker: d.ticker, pnl: pnl };
            }
        }
    });

    let html = '';
    const fmt = (v) => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(v);

    // Build the HTML cards for each category that has data
    Object.keys(categories).forEach(key => {
        let cat = categories[key];
        if (cat.count === 0) return; // Skip empty categories

        let winRatePct = ((cat.wins / cat.count) * 100).toFixed(1) + '%';
        let avgDays = Math.round(cat.totalDays / cat.count);
        let pnlColor = cat.pnl >= 0 ? 'var(--success)' : 'var(--danger)';

        let bestStr = cat.best && cat.best.pnl > 0 ? `${cat.best.ticker} <span style="color:var(--success);">(${fmt(cat.best.pnl)})</span>` : '-';
        let worstStr = cat.worst && cat.worst.pnl < 0 ? `${cat.worst.ticker} <span style="color:var(--danger);">(${fmt(cat.worst.pnl)})</span>` : '-';

        html += `
        <div style="background: var(--card-bg, #fff); padding: 15px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--row-border);">
                <div style="font-weight: 800; font-size: 14px; color: var(--text-main);">${cat.title}</div>
                <div class="sensitive" style="font-weight: 800; font-size: 16px; color: ${pnlColor};">${fmt(cat.pnl)}</div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 8px; font-size: 12px;">
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--gray); font-weight: 600;">Win Rate</span>
                    <span style="font-weight: 800; color: var(--text-main);">${winRatePct} <span style="font-size:10px; opacity:0.6; font-weight:600;">(${cat.wins}/${cat.count})</span></span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--gray); font-weight: 600;">Best Trade</span>
                    <span class="sensitive" style="font-weight: 800;">${bestStr}</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--gray); font-weight: 600;">Worst Trade</span>
                    <span class="sensitive" style="font-weight: 800;">${worstStr}</span>
                </div>
                <div style="display: flex; justify-content: space-between; padding-top: 6px; border-top: 1px dashed var(--row-border); margin-top: 2px;">
                    <span style="color: var(--gray); font-weight: 600;">Avg Holding Time</span>
                    <span style="font-weight: 800; color: var(--text-main);">${avgDays} Days</span>
                </div>
            </div>
        </div>`;
    });

    container.innerHTML = html;
}

/**
 * Renders the Graveyard Terminal table, grouped by Asset Type.
 */
function renderCPTerminal() {
    const thead = document.getElementById('cp-thead');
    const tbody = document.getElementById('cp-table-body');
    if (!thead || !tbody || cpData.length === 0) return;

    const th = (label, colKey, isDivider = false) => {
        let arrow = cpSortCol === colKey ? (cpSortAsc ? ' <span style="color:var(--primary); font-size:12px;">↑</span>' : ' <span style="color:var(--primary); font-size:12px;">↓</span>') : '';
        let cls = isDivider ? 'class="term-group-divider"' : '';
        return `<th ${cls} onclick="sortCPTerminal('${colKey}')" style="cursor:pointer; user-select:none;">${label}${arrow}</th>`;
    };

    // Sort Data Globally
    let sorted = [...cpData].sort((a, b) => {
        let valA = parseCPSort(a[cpSortCol]);
        let valB = parseCPSort(b[cpSortCol]);
        if (typeof valA === 'string' && typeof valB === 'string') return cpSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        return cpSortAsc ? (valA - valB) : (valB - valA);
    });

    const fmt = (val) => (val && val !== "-" && val !== "") ? val : "-";

    // Header Rendering
    let headerHtml = `<tr>${th('TICKER', 'ticker')}`;
    if (cpSubView === 'overview') {
        // AGGIUNTE COLONNE QTY, AVG SELL e PRICE TODAY
        headerHtml += `${th('QTY', 'qty', true)}${th('AVG SELL', 'avgSell')}${th('PRICE TODAY', 'priceToday')}${th('INVESTED', 'invested', true)}${th('REALIZED P&L', 'realPnL', true)}${th('DIVS', 'divs')}${th('TOTAL P&L', 'totalPnL')}${th('ROI %', 'roi', true)}${th('XIRR', 'xirr')}${th('TWR', 'twr')}`;
    } else {
        headerHtml += `${th('FIRST BUY', 'firstBuy', true)}${th('LAST ACT.', 'lastAct')}${th('DAYS HELD', 'daysHeld')}${th('TRADES', 'trades')}${th('WIN RT', 'winRate', true)}${th('PRF FCT', 'profitFactor')}${th('FIRST P.', 'firstPrice', true)}${th('MIN BUY', 'minBuy')}${th('MAX BUY', 'maxBuy')}${th('AVG SELL', 'avgSell', true)}${th('MAX SELL', 'maxSell')}`;
    }
    headerHtml += `</tr>`;
    thead.innerHTML = headerHtml;

    let bodyHtml = '';
    const groupsToRender = ['Stock', 'ETF', 'Crypto', 'Other'];

    groupsToRender.forEach(groupName => {
        let groupData = sorted.filter(r => {
            let rawType = String(r.type).trim().toUpperCase();
            let normType = 'Other';
            if (rawType === 'STOCK' || rawType === 'STOCKS') normType = 'Stock';
            else if (rawType === 'ETF' || rawType === 'ETFS') normType = 'ETF';
            else if (rawType === 'CRYPTO' || rawType === 'CRYPTOS') normType = 'Crypto';
            return normType === groupName;
        });

        if (groupData.length === 0) return;

        let groupPnl = groupData.reduce((sum, r) => {
            let pnl = parseCPSort(r.totalPnL);
            return sum + (pnl === -Infinity ? 0 : pnl);
        }, 0);
        
        let gPnlColor = groupPnl >= 0 ? 'var(--success)' : 'var(--danger)';
        let fmtGPnl = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(groupPnl);
        
        // AGGIORNATO COLSPAN
        let colSpan = cpSubView === 'overview' ? 11 : 12;

        bodyHtml += `
        <tr class="term-group-header">
            <td colspan="${colSpan}" style="background:rgba(0,122,255,0.05); color:var(--text-main); font-weight:800; text-align:left; border-top: 2px solid var(--row-border);">
                📂 ${groupName} <span style="font-size:11px; opacity:0.7; color:var(--gray); font-weight:600; margin-left:6px;">(${groupData.length} Trades)</span>
                <span class="sensitive" style="float:right; color:${gPnlColor}; font-weight:800;">Tot P&L: ${fmtGPnl}</span>
            </td>
        </tr>`;

        groupData.forEach(row => {
            let clickAction = `openPostMortemModal('${row.ticker}')`;
            
            bodyHtml += `<tr onclick="${clickAction}" style="cursor:pointer; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,122,255,0.05)'" onmouseout="this.style.background='transparent'">
                         <td><div style="font-weight:800;">${fmt(row.ticker)}</div></td>`;
            if (cpSubView === 'overview') {
                bodyHtml += `
                    <td class="term-group-divider" style="color:var(--gray); font-weight:700;">${fmt(row.qty)}</td>
                    <td><span class="sensitive" style="font-weight:600;">${fmt(row.avgSell)}</span></td>
                    <td><span class="sensitive" style="color:var(--gray);">${fmt(row.priceToday)}</span></td>
                    <td class="term-group-divider"><span class="sensitive">${fmt(row.invested)}</span></td>
                    <td class="term-group-divider term-heatmap" style="${getCPHeatmapStyle(row.realPnL)}"><span class="sensitive">${fmt(row.realPnL)}</span></td>
                    <td><span class="sensitive" style="color:var(--primary); font-weight:700;">${fmt(row.divs)}</span></td>
                    <td class="term-heatmap" style="${getCPHeatmapStyle(row.totalPnL)}"><span class="sensitive" style="font-weight:800;">${fmt(row.totalPnL)}</span></td>
                    <td class="term-group-divider term-heatmap" style="${getCPHeatmapStyle(row.roi)}">${fmt(row.roi)}</td>
                    <td class="term-heatmap" style="${getCPHeatmapStyle(row.xirr)}" title="${row.xirrNote}">${fmt(row.xirr)}</td>
                    <td class="term-heatmap" style="${getCPHeatmapStyle(row.twr)}">${fmt(row.twr)}</td>
                `;
            } else {
                let wrFloat = parseCPSort(row.winRate);
                let pfFloat = parseCPSort(row.profitFactor);
                
                bodyHtml += `
                    <td class="term-group-divider" style="color:var(--gray);">${fmt(row.firstBuy)}</td>
                    <td style="color:var(--gray);">${fmt(row.lastAct)}</td>
                    <td style="font-weight:700;">${fmt(row.daysHeld)}</td>
                    <td style="font-weight:700;">${fmt(row.trades)}</td>
                    <td class="term-group-divider" style="${wrFloat >= 50 ? 'color:var(--success)' : (wrFloat < 50 ? 'color:var(--danger)' : 'color:var(--text-main)')}; font-weight:700;">${fmt(row.winRate)}</td>
                    <td style="${pfFloat >= 1 ? 'color:var(--success)' : (pfFloat < 1 ? 'color:var(--danger)' : 'color:var(--text-main)')}; font-weight:700;">${fmt(row.profitFactor)}</td>
                    <td class="term-group-divider"><span class="sensitive">${fmt(row.firstPrice)}</span></td>
                    <td><span class="sensitive">${fmt(row.minBuy)}</span></td>
                    <td><span class="sensitive">${fmt(row.maxBuy)}</span></td>
                    <td class="term-group-divider"><span class="sensitive" style="color:#ff9500; font-weight:700;">${fmt(row.avgSell)}</span></td>
                    <td><span class="sensitive" style="color:#ff9500; font-weight:700;">${fmt(row.maxSell)}</span></td>
                `;
            }
            bodyHtml += `</tr>`;
        });
    });

    tbody.innerHTML = bodyHtml;
}

let cpScatterChartInstance = null;

/**
 * Renders a Scatter Plot to analyze Trading Efficiency (Days Held vs ROI).
 */
function renderCPScatterChart() {
    const canvas = document.getElementById('cpScatterChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    if (cpScatterChartInstance) cpScatterChartInstance.destroy();

    // Map and clean data for the scatter plot
    let scatterData = cpData.map(d => {
        let xVal = parseInt(d.daysHeld) || 0;
        let yVal = parseCPSort(d.roi); // Usa la tua funzione per convertire "10,50%" in 10.5
        yVal = (yVal === -Infinity || isNaN(yVal)) ? 0 : yVal;
        
        return {
            x: xVal,
            y: yVal,
            ticker: d.ticker,
            pnl: parseCPSort(d.totalPnL)
        };
    }).filter(d => d.x > 0); // Nascondi trade con 0 giorni per pulizia visiva

    const isDark = document.body.classList.contains('dark-mode');
    const textColor = isDark ? '#fff' : '#333';
    const gridColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.05)';

    // Dividi profitti e perdite per colorare i puntini di verde o rosso
    const wins = scatterData.filter(d => d.y >= 0);
    const losses = scatterData.filter(d => d.y < 0);

    cpScatterChartInstance = new Chart(ctx, {
        type: 'scatter',
        data: {
            datasets: [
                {
                    label: 'Profit Trades',
                    data: wins,
                    backgroundColor: 'rgba(52, 199, 89, 0.7)',
                    borderColor: 'rgba(52, 199, 89, 1)',
                    pointRadius: 6,
                    pointHoverRadius: 9
                },
                {
                    label: 'Loss Trades',
                    data: losses,
                    backgroundColor: 'rgba(255, 59, 48, 0.7)',
                    borderColor: 'rgba(255, 59, 48, 1)',
                    pointRadius: 6,
                    pointHoverRadius: 9
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'top', labels: { color: textColor, font: { size: 10, weight: 'bold' }, usePointStyle: true, boxWidth: 6 } },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let raw = context.raw;
                            let privacy = document.body.classList.contains('privacy-mode');
                            let pnlStr = privacy ? '****' : new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(raw.pnl);
                            return `${raw.ticker} | Days Held: ${raw.x} | ROI: ${raw.y.toFixed(2)}% | P&L: ${pnlStr}`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    type: 'linear',
                    position: 'bottom',
                    title: { display: true, text: 'Days Held', color: textColor, font: { weight: 'bold', size: 11 } },
                    ticks: { color: textColor, font: { size: 10 } },
                    grid: { color: gridColor }
                },
                y: {
                    title: { display: true, text: 'ROI %', color: textColor, font: { weight: 'bold', size: 11 } },
                    ticks: { color: textColor, callback: v => v + '%', font: { size: 10 } },
                    grid: { color: gridColor, borderDash: [5, 5] }
                }
            }
        }
    });
}
/**
 * Calls the backend to retrieve the summary of Real Estate, Bonds, and Liabilities.
 * Uses LocalStorage Cache for instant UI rendering without waiting.
 * Renders detailed lists grouped by Asset Type.
 */
function loadRealAssetsDashboard() {
    // Internal helper to print data to the screen
    const renderData = (summary) => {
        const fmt = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
        
        // 1. Populate the Grid Widgets (Totals)
        if(document.getElementById('dash-re-net')) document.getElementById('dash-re-net').innerText = fmt.format(summary.realEstate.net);
        if(document.getElementById('dash-re-gross')) document.getElementById('dash-re-gross').innerText = fmt.format(summary.realEstate.gross);
        if(document.getElementById('dash-re-debt')) document.getElementById('dash-re-debt').innerText = "-" + fmt.format(summary.realEstate.debt);
        
        if(document.getElementById('dash-bond-net')) document.getElementById('dash-bond-net').innerText = fmt.format(summary.bonds.net);
        if(document.getElementById('dash-liab-net')) document.getElementById('dash-liab-net').innerText = fmt.format(summary.liabilities.net);

        // 2. Helper to render grouped item lists inside the cards
        const renderDetails = (containerId, items, isDebt = false) => {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            if (!items || items.length === 0) {
                container.innerHTML = '<div style="color: var(--gray); font-size: 11px; text-align: center; margin-top: 10px;">No detailed data found</div>';
                return;
            }

            // Group items by their exact type (e.g., "Corporate Bond")
            const groupedItems = {};
            items.forEach(item => {
                let t = item.type || "Other";
                // Clean up prefixes if you want shorter labels (optional)
                t = t.replace("Real Estate - ", "").replace("Liability - ", ""); 
                if (!groupedItems[t]) groupedItems[t] = [];
                groupedItems[t].push(item);
            });

            let html = '<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px; border-top: 1px dashed var(--row-border); padding-top: 12px;">';
            
            Object.keys(groupedItems).forEach(groupType => {
                // Render Group Header
                html += `
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <div style="font-size: 10px; font-weight: 800; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px;">
                        ${groupType}
                    </div>`;
                
                // Render Items inside the group
                groupedItems[groupType].forEach(item => {
                    let valColor = isDebt ? 'var(--danger)' : 'var(--text-main)';
                    let valText = isDebt ? "-" + fmt.format(Math.abs(item.net)) : fmt.format(item.net);
                    
                    html += `
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding-left: 6px; border-left: 2px solid var(--primary);">
                        <span style="color: var(--gray); font-weight: 600; text-transform: capitalize;">${item.name}</span>
                        <span class="sensitive" style="font-weight: 800; color: ${valColor};">${valText}</span>
                    </div>`;
                });
                html += `</div>`; // Close group container
            });
            
            html += '</div>';
            container.innerHTML = html;
        };

        // Render the grouped detailed lists
        renderDetails('dash-re-details', summary.realEstate.items);
        renderDetails('dash-bond-details', summary.bonds.items);
        renderDetails('dash-liab-details', summary.liabilities.items, true);

        // 3. Populate Legend under the Pie Chart
        if(document.getElementById('sum-re-a')) document.getElementById('sum-re-a').innerText = fmt.format(summary.realEstate.net);
        if(document.getElementById('sum-b-a')) document.getElementById('sum-b-a').innerText = fmt.format(summary.bonds.net);
        
        // 4. Save globally for Charts and Net Worth Calculator
        window.globalRealEstateNet = summary.realEstate.net || 0;
        window.globalBondsNet = summary.bonds.net || 0;
        window.globalLiabilitiesNet = summary.liabilities.net || 0;
        window.realAssetsNetImpact = summary.totalNetWorthImpact || 0; 
        
        // 5. Trigger visual update of the Pie Chart and Total Balance
        if (typeof recalculateGrandTotal === "function") recalculateGrandTotal();
        const cachedSummary = JSON.parse(localStorage.getItem('dashboard_cache'))?.summary || {};
        if (typeof renderAssetChart === "function") renderAssetChart(cachedSummary);
    };

    // --- PHASE 1: FAST RENDER FROM CACHE ---
    const cachedRealAssets = localStorage.getItem('realAssets_cache');
    if (cachedRealAssets) {
        try { renderData(JSON.parse(cachedRealAssets)); } catch(e) {}
    }

    // --- PHASE 2: FETCH IN BACKGROUND ---
    google.script.run.withSuccessHandler(function(summary) {
        if (!summary) return;
        localStorage.setItem('realAssets_cache', JSON.stringify(summary)); // Save to cache
        renderData(summary); // Update UI invisibly
    }).getRealAssetsSummary();
}
