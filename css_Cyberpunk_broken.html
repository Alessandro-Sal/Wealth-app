<style>
/* --- ANIMAZIONI CYBERPUNK --- */
@keyframes panGrid {
    0% { background-position: 0px 0px; }
    100% { background-position: 40px 40px; }
}

@keyframes holographicScan {
    0% { top: -10%; opacity: 0; }
    10% { opacity: 0.5; }
    50% { opacity: 0.8; }
    90% { opacity: 0.5; }
    100% { top: 110%; opacity: 0; }
}

@keyframes neonPulse {
    0% { box-shadow: 0 0 15px rgba(0, 229, 255, 0.2), inset 0 0 5px rgba(0, 229, 255, 0.1); }
    50% { box-shadow: 0 0 25px rgba(0, 229, 255, 0.5), inset 0 0 15px rgba(0, 229, 255, 0.2); }
    100% { box-shadow: 0 0 15px rgba(0, 229, 255, 0.2), inset 0 0 5px rgba(0, 229, 255, 0.1); }
}

@keyframes glitchClick {
    0% { transform: translate(0); filter: hue-rotate(0deg); }
    20% { transform: translate(-2px, 2px); filter: hue-rotate(90deg); }
    40% { transform: translate(-2px, -2px); filter: hue-rotate(-90deg); }
    60% { transform: translate(2px, 2px); filter: hue-rotate(90deg); }
    80% { transform: translate(2px, -2px); filter: hue-rotate(-90deg); }
    100% { transform: translate(0); filter: hue-rotate(0deg); }
}

/* 1. VARIABILI E SFONDO IN MOVIMENTO */
body.dark-mode {
    --bg: #020305 !important; 
    --section-bg: rgba(7, 10, 15, 0.75) !important; 
    --primary: #00e5ff !important; 
    --success: #00ff9d !important; 
    --danger: #ff003c !important; 
    --warning: #ffea00 !important; 
    --text-main: #f0f8ff !important;
    --gray: #5c7799 !important;
    --row-border: rgba(0, 229, 255, 0.2) !important;
    
    background-color: var(--bg) !important;
    background-image: 
        linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px) !important;
    background-size: 40px 40px !important;
    animation: panGrid 15s linear infinite !important;
}

/* 2. LO SCANNER LASER OLOGRAFICO */
body.dark-mode::before {
    content: "";
    position: fixed;
    left: 0; right: 0;
    height: 3px;
    background: var(--primary);
    box-shadow: 0 0 20px 4px var(--primary);
    z-index: 999999;
    pointer-events: none;
    animation: holographicScan 8s ease-in-out infinite;
    opacity: 0;
}

/* 3. CRT BLOOM SU TUTTI I TESTI (Fosforescenza) */
body.dark-mode * {
    text-shadow: 0 0 1px rgba(255,255,255,0.1);
}

/* 4. STERMINIO TOTALE DEI COLORI INLINE (LA BOMBA FINE DI MONDO) */
/* Qualsiasi attributo style che tenta di imporre sfondi chiari o testi scuri viene annientato */
body.dark-mode [style*="background-color: #"], 
body.dark-mode [style*="background-color:#"],
body.dark-mode [style*="background: #"],
body.dark-mode [style*="background:#"],
body.dark-mode [style*="background: rgb(2"],
body.dark-mode [style*="background: white"],
body.dark-mode [style*="background: var(--white)"] {
    background-color: var(--section-bg) !important;
    background: var(--section-bg) !important;
}

body.dark-mode [style*="color: #0"], 
body.dark-mode [style*="color:#0"], 
body.dark-mode [style*="color: #1"], 
body.dark-mode [style*="color: #2"], 
body.dark-mode [style*="color: #3"], 
body.dark-mode [style*="color: black"],
body.dark-mode [style*="color: rgb(0"] {
    color: var(--text-main) !important;
    text-shadow: 0 0 4px rgba(255,255,255,0.3) !important;
}

body.dark-mode [style*="color: #4"], 
body.dark-mode [style*="color: #5"], 
body.dark-mode [style*="color: #6"], 
body.dark-mode [style*="color: #7"], 
body.dark-mode [style*="color: #8"] {
    color: var(--gray) !important;
}

/* 5. VETRO OLOGRAFICO PER LE CARD */
body.dark-mode .card, 
body.dark-mode .dash-widget, 
body.dark-mode .dash-list,
body.dark-mode .wl-stat-box,
body.dark-mode .sheet-modal-content,
body.dark-mode .nav-bar,
body.dark-mode .recap-header-container,
body.dark-mode [id$="-sheet"] {
    background: var(--section-bg) !important;
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
    border: 1px solid rgba(0, 229, 255, 0.15) !important;
    box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.02), 0 10px 30px rgba(0,0,0,0.8) !important;
}

body.dark-mode .dash-widget:active,
body.dark-mode .dash-list-row:active,
body.dark-mode button:active {
    animation: glitchClick 0.2s cubic-bezier(.25, .46, .45, .94) both !important;
}

/* 6. NUMERI FLUO GIGANTI */
body.dark-mode .widget-value, 
body.dark-mode .total-amount,
body.dark-mode .sensitive[style*="font-size:4"],
body.dark-mode .sensitive[style*="font-size: 4"],
body.dark-mode .sensitive[style*="font-size:2"],
body.dark-mode #pm-mod-pnl {
    color: #ffffff !important;
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.6), 0 0 20px rgba(0, 229, 255, 0.4), 0 0 40px rgba(0, 229, 255, 0.2) !important;
    font-weight: 900 !important;
}

/* 7. COLORI STATUS FLUO INCANDESCENTI */
body.dark-mode .sensitive[style*="success"],
body.dark-mode [style*="color: #34c759"],
body.dark-mode [style*="color:#34c759"],
body.dark-mode .term-chip[onclick*="profit"] {
    color: var(--success) !important;
    text-shadow: 0 0 15px rgba(0, 255, 157, 0.8) !important;
}

body.dark-mode .sensitive[style*="danger"],
body.dark-mode [style*="color: #ff3b30"],
body.dark-mode [style*="color:#ff3b30"],
body.dark-mode .trip-cost,
body.dark-mode .term-chip[onclick*="loss"] {
    color: var(--danger) !important;
    text-shadow: 0 0 15px rgba(255, 0, 60, 0.8) !important;
}

/* 8. BOTTONI "PULSANTI" (Effetto Respiro) */
body.dark-mode button.active, 
body.dark-mode .nav-btn.active,
body.dark-mode .term-chip.active,
body.dark-mode button[style*="primary"],
body.dark-mode .calc-btn.op {
    background: rgba(0, 229, 255, 0.15) !important;
    color: var(--primary) !important;
    border: 1px solid var(--primary) !important;
    animation: neonPulse 3s infinite alternate !important;
}

body.dark-mode button, 
body.dark-mode .nav-btn,
body.dark-mode .term-chip {
    background: rgba(0, 229, 255, 0.02) !important;
    color: var(--primary) !important;
    border: 1px solid rgba(0, 229, 255, 0.2) !important;
    border-radius: 12px !important;
    text-shadow: 0 0 5px rgba(0, 229, 255, 0.4) !important;
}

/* 9. INPUT DA TERMINALE HACKER */
body.dark-mode input, 
body.dark-mode textarea, 
body.dark-mode select {
    background: rgba(0, 5, 10, 0.8) !important;
    color: var(--primary) !important;
    border: 1px solid rgba(0, 229, 255, 0.4) !important;
    box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.1) !important;
    font-family: 'Courier New', Courier, monospace !important;
    letter-spacing: 1px !important;
}

body.dark-mode input:focus, 
body.dark-mode textarea:focus {
    border: 1px solid var(--primary) !important;
    box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.2), 0 0 15px rgba(0, 229, 255, 0.4) !important;
    outline: none !important;
}

/* 10. LA HERO CARD SUPREMA */
body.dark-mode .dash-hero {
    background: radial-gradient(circle at 50% -20%, rgba(0, 229, 255, 0.3), transparent 60%), 
                linear-gradient(180deg, rgba(11, 15, 25, 0.9), rgba(2, 3, 5, 0.95)) !important;
    border: 1px solid rgba(0, 229, 255, 0.5) !important;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(0, 229, 255, 0.1) !important;
}

/* 11. TABELLE (Hover Olografico) */
body.dark-mode table th, 
body.dark-mode table td,
body.dark-mode .dash-list-row {
    border-bottom: 1px solid rgba(0, 229, 255, 0.1) !important;
}

body.dark-mode table tr:hover td,
body.dark-mode .dash-list-row:hover {
    background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.1), transparent) !important;
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.8) !important;
}

/* RIMOZIONE FORZATA BADGE COLORATI */
body.dark-mode .bg-blue, body.dark-mode .bg-green, body.dark-mode .bg-red, body.dark-mode .bg-orange, body.dark-mode .bg-purple {
    background: rgba(0, 229, 255, 0.05) !important;
    border: 1px solid rgba(0, 229, 255, 0.3) !important;
    color: var(--primary) !important;
    box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.2) !important;
}
</style>
<style>
/* 1. SPOTLIGHT TRACKING CSS */
body.dark-mode .dash-widget, 
body.dark-mode .card, 
body.dark-mode .dash-list,
body.dark-mode .sheet-modal-content {
    position: relative;
    overflow: hidden;
}

body.dark-mode .dash-widget::before, 
body.dark-mode .card::before, 
body.dark-mode .dash-list::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: inherit;
    /* Il faro che segue le coordinate CSS iniettate dal JS */
    background: radial-gradient(
        600px circle at var(--mouse-x, -500px) var(--mouse-y, -500px), 
        rgba(0, 229, 255, 0.15),
        transparent 40%
    );
    z-index: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    opacity: 0;
}

body.dark-mode .dash-widget:hover::before, 
body.dark-mode .card:hover::before, 
body.dark-mode .dash-list:hover::before {
    opacity: 1;
}

/* Protegge i contenuti dal faro per farli restare cliccabili */
body.dark-mode .dash-widget > *, 
body.dark-mode .card > *, 
body.dark-mode .dash-list > * {
    position: relative;
    z-index: 1;
}

/* 2. MATRIX CANVAS BACKGROUND */
#cyber-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: -2;
    opacity: 0;
    transition: opacity 1s;
    pointer-events: none;
}
body.dark-mode #cyber-canvas {
    opacity: 0.15; /* Sottilissimo, dietro il vetro */
}
</style>

<canvas id="cyber-canvas"></canvas>

<script>
// ==========================================
// THE SINGULARITY ENGINE (JAVASCRIPT)
// ==========================================

// 1. MAGNETIC MOUSE GLOW OVER CARDS
document.addEventListener("mousemove", (e) => {
    if(!document.body.classList.contains('dark-mode')) return;
    // Cerca tutte le card e inietta la posizione X/Y del cursore come variabile CSS
    document.querySelectorAll('.dash-widget, .card, .dash-list, .sheet-modal-content').forEach(card => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        card.style.setProperty("--mouse-x", `${x}px`);
        card.style.setProperty("--mouse-y", `${y}px`);
    });
});

// 2. DATA DECRYPTION EFFECT (MATRIX SCRAMBLE)
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789€%$#@*>";
function cyberDecrypt(element) {
    if(!document.body.classList.contains('dark-mode')) return;
    const originalText = element.dataset.realText || element.innerText;
    
    // Evita loop su testi vuoti o non numerici essenziali
    if(!originalText || originalText === '--' || originalText.length < 2) return;
    
    // Salva il testo originale per non perderlo
    if(!element.dataset.realText) element.dataset.realText = originalText;
    
    let iterations = 0;
    clearInterval(element.dataset.cyberInterval);
    
    element.dataset.cyberInterval = setInterval(() => {
        element.innerText = originalText.split("").map((letter, index) => {
            if(index < iterations) return originalText[index]; // Fissa la lettera se l'onda è passata
            return letters[Math.floor(Math.random() * letters.length)]; // Scramble casuale
        }).join("");
        
        if(iterations >= originalText.length) {
            clearInterval(element.dataset.cyberInterval);
            element.innerText = originalText; // Assicura che l'ultimo frame sia perfetto
        }
        iterations += 1 / 3; // Velocità di decrittazione (più alto = più veloce)
    }, 30);
}

// Intercetta automaticamente l'aggiornamento dei numeri giganti e fa partire l'hacking
const targetNodes = document.querySelectorAll('body');
const observer = new MutationObserver((mutations) => {
    mutations.forEach((mutation) => {
        if (mutation.type === 'childList' || mutation.type === 'characterData') {
            const targets = document.querySelectorAll('.widget-value, .total-amount, .sensitive[style*="font-size:4"], #pm-mod-pnl');
            targets.forEach(el => {
                // Esegue l'effetto solo se il testo è appena cambiato e non è in decrittazione
                if(el.innerText !== el.dataset.lastText) {
                    el.dataset.lastText = el.innerText;
                    cyberDecrypt(el);
                }
            });
        }
    });
});
observer.observe(document.body, { childList: true, subtree: true, characterData: true });


// 3. BACKGROUND DIGITAL RAIN (CANVAS)
const canvas = document.getElementById('cyber-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const alphabet = katakana.split('');
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];
for (let x = 0; x < columns; x++) drops[x] = 1;

function drawMatrix() {
    if(!document.body.classList.contains('dark-mode')) return;
    
    ctx.fillStyle = 'rgba(2, 3, 5, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#00e5ff'; // Colore Ciano Laser
    ctx.font = fontSize + 'px monospace';
    
    for (let i = 0; i < drops.length; i++) {
        const text = alphabet[Math.floor(Math.random() * alphabet.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 40);

// Gestione resize finestra
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
