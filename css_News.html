<style>
/* Horizontal scrollable category pills */
.news-cat-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 5px 0 20px 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none; /* Firefox */
}
.news-cat-scroll::-webkit-scrollbar {
  display: none; /* Chrome/Safari */
}

/* Category Buttons */
.news-cat-btn {
  background: var(--section-bg);
  border: 1px solid var(--row-border);
  color: var(--gray);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s ease;
}

.news-cat-btn.active {
  background: var(--text-main);
  color: var(--bg);
  border-color: var(--text-main);
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

body.dark-mode .news-cat-btn.active {
  background: var(--white);
  color: #000;
}

/* Grid Layout */
.news-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  padding-bottom: 40px;
}

/* Premium News Card */
.news-card {
  background: var(--white);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  border: 1px solid var(--row-border);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  text-decoration: none; /* Since the whole card will be clickable */
}

body.dark-mode .news-card {
  background: #1c1c1e;
  border: 1px solid rgba(255,255,255,0.05);
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.news-card:active {
  transform: scale(0.97);
}

@media (min-width: 768px) {
  .news-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
  }
}

.news-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.news-badge {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;

  color: #007aff;
  padding: 4px 10px;
  border-radius: 8px;
}

.news-date {
  font-size: 11px;
  font-weight: 600;
  color: var(--gray);
}

.news-title {
  margin: 0 0 15px 0;
  font-size: 16px;
  font-weight: 800;
  line-height: 1.4;
  color: var(--text-main);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.news-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--gray);
  border-top: 1px dashed var(--row-border);
  padding-top: 12px;
}

.news-source-icon {
  width: 18px;

  justify-content: center;

}

.news-summary {
  font-size: 13px;
  color: var(--gray);
  margin-top: 8px;
  margin-bottom: 15px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 3; /* Truncates the text after 3 lines */
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Adjust title margin to look good with the new summary */
.news-title {
  margin: 0 0 5px 0;
  font-size: 16px;
  font-weight: 800;
  line-height: 1.4;
  color: var(--text-main);
  display: -webkit-box;

  overflow: hidden;
}

}

.ticker-pill {

}

}

}

}

}

}

}

}

}

/* --- SKELETON LOADER ANIMATION --- */
@keyframes shimmer {
  0% { background-position: -468px 0; }
  100% { background-position: 468px 0; }
}

.skeleton-card {
  background: var(--white);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 15px;
  border: 1px solid rgba(0,0,0,0.04);
  box-shadow: 0 4px 15px rgba(0,0,0,0.02);
}

.skeleton-element {

  background-repeat: no-repeat;
  background-size: 800px 100%;
  animation-duration: 1.5s;
  animation-fill-mode: forwards;
  animation-iteration-count: infinite;

}

.skel-footer { height: 14px; width: 120px; }

/* --- NEWS IMAGE THUMBNAILS --- */
.news-thumbnail-wrapper {

  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.news-thumbnail-wrapper img {

}

.news-card:hover .news-thumbnail-wrapper img {

}

@media (max-width: 400px) {

    height: 75px;
  }
}
