    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var errInfo = "Error: " + msg + "\nLine: " + lineNo;
        alert(errInfo);
        document.body.innerHTML += '<div style="color:red;font-size:20px;padding:20px;">' + errInfo + '</div>';
        return false;
      };
    </script>
    <style>
      body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
        .initial-loader {
          position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
          display: flex; flex-direction: column; justify-content: center; align-items: center;
          background: #09090b; z-index: 9999;
        }
        .spinner {
          width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
          border-radius: 50%; border-top-color: #3b82f6;
          animation: spin 1s ease-in-out infinite;
          margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
          font-size: 14px; font-weight: 600; color: #a1a1aa; letter-spacing: 1px;
        }
      </style>
