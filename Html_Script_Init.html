<script>
   /**
    * ======================================================================================
    * BLOCK 3: INITIALIZATION & DATA FETCHING
    * App startup logic, caching strategy, and initial rendering of dashboard/charts.
    * ======================================================================================
    */
   
   /**
    * Main Entry Point.
    * 1. Checks LocalStorage for cached data (Fast Render).
    * 2. Fetches fresh data from server (Network Update).
    * 3. Handles Skeleton loading UI.
    * 
    */
   const APP_STATE = {
       history: null,
       balances: null,
       budgets: null
   };

   function stateChanged(key, data) {
       const str = JSON.stringify(data);
       if (APP_STATE[key] === str) return false;
       APP_STATE[key] = str;
       return true;
   }

   async function initApp() {
     console.log("🚀 App Launch: Skeleton First...");
     
     setTimeout(() => {
       try {
         if (typeof changeTab === 'function') {
           changeTab('add'); 
         }
       } catch(e) {
         console.error("Errore avvio navigazione:", e);
       }
     }, 100);
     
     // Check for portfolio alerts silently in the background after app load
     if (typeof checkPortfolioAlertsSilent === 'function') {
       setTimeout(checkPortfolioAlertsSilent, 2000);
     }
     
     if (typeof fetchAndRenderSmartSuggestions === 'function') {
         setTimeout(fetchAndRenderSmartSuggestions, 500);
     }
     // Theme Setup
     const savedTheme = localStorage.getItem('theme');
     if (savedTheme === 'dark') toggleTheme();
     
     // Utils Init
     setTodayDate();
     setupInputValidation();
   
     const splash = document.getElementById('splash-screen');
     const cachedFast = localStorage.getItem('cache_fast');
     const cachedHeavy = localStorage.getItem('cache_heavy');
   
     // Render Skeletons immediately
     showSkeleton('budget-container', 4, '35px');
     showSkeleton('history-container', 5, '50px');
     showSkeleton('live-stocks', 3, '70px', true);
   
     // --- STAGE 1: CACHE RENDER (Instant UI) ---
     if (cachedFast) {
         try { 
             renderAllData(JSON.parse(cachedFast)); 
             console.log("⚡ Cache Fast Rendered."); 
         } catch (e) { console.error("Corrupt Fast Cache", e); }
     }
     if (cachedHeavy) {
         try { 
             renderAllData(JSON.parse(cachedHeavy)); 
             console.log("⚡ Cache Heavy Rendered."); 
         } catch (e) { console.error("Corrupt Heavy Cache", e); }
     }
     
     // UX FIX: Nascondi subito lo splash per mostrare gli skeleton animati (migliora percezione)
     const hideSplash = () => { if (splash) splash.classList.add('hidden'); };
     if (cachedFast) {
         hideSplash(); // utente di ritorno: dati da cache già a schermo -> via subito
     } else {
         setTimeout(hideSplash, 150);
     }
   
     const currentYear = new Date().getFullYear().toString();
   
     try {
         // --- STAGE 2: FAST DATA FETCH (Network) ---
         const fastData = await run('loadFastStart', currentYear);
         localStorage.setItem('cache_fast', JSON.stringify(fastData));
         renderAllData(fastData);
         
         // PERFORMANCE FIX: Avvia chiamate secondarie solo DOPO il caricamento principale
         // per non saturare la pool di connessioni simultanee di Google Apps Script
         fetchBalances(fastData.balances);
         fetchSubsStatus(fastData.subsStatus);
         fetchPlannedExpensesStatus();
         fetchActiveCredits(fastData.credits);

         // --- STAGE 3: HEAVY DATA FETCH (Lazy Load) ---
         run('loadHeavyContent', currentYear).then(heavyData => {
             console.log("📡 Portfolio Data Received.");
             localStorage.setItem('cache_heavy', JSON.stringify(heavyData));
             renderAllData(heavyData);
   
             if(heavyData.autocomplete) {
                 notesData = heavyData.autocomplete.notes;
                 tickersData = heavyData.autocomplete.tickers;
             }
             
             isFullDataLoaded = true; 
             console.log("🤖 Data Ready.");
             
             // --- MODIFICATION: PARTIAL LOAD ON INIT ---
             // Loads only Benchmarks (Macro data) immediately. 
             // AI Analysis is skipped until user clicks "Refresh".
             loadMarketInsights(false); 
             
         }).catch(err => {
             console.warn("Heavy Load Error:", err);
         });

         // Start Live Market Updates & Background Fetches
         if (typeof loadNews === 'function') loadNews('market'); // Avvia il download delle news all'apertura dell'app
             
         // Start Live Market Updates
         fetchWatchlist();
         fetchAnalyticsData();
         fetchTaxOptimizationData();
         setTimeout(() => {
             if (typeof renderNetWorthTrendChart === 'function') {
                 renderNetWorthTrendChart();
             }
         }, 2000);
         setTimeout(() => startMarketPolling(), 5000);
         setTimeout(() => startDashboardPolling(), 6000);
         
     } catch (err) {
         console.error("Critical Init Error:", err);
         if (!cachedFast) {
             document.getElementById('budget-container').innerHTML = '<div style="text-align:center;color:red;padding:20px;">Connection Error.<br>Try again later.</div>';
         }
     } finally {
         hideSplash(); // Ensure splash is always hidden after initial fast data network request
     }
   }
   
   /**
    * Universal Data Renderer.
    * Dispatches data chunks to specific UI update functions.
    * Handles both partial updates (Fast) and full updates (Heavy).
    * @param {Object} data - The data payload from server/cache.
    */
   function renderAllData(data) {
     console.log("📦 Rendering Partial:", Object.keys(data));
     
     if (data.years) {
         const sel = document.getElementById('trendYear');
         if (sel && sel.options.length <= 1) {
             const current = sel.value || new Date().getFullYear().toString();
             renderYearSelector(data.years, current);
         }
     }
     
     if (data.dashboard) updateDashboardDOM(data.dashboard);
     if (data.historyNW) renderHistoricalNWDOM(data.historyNW);
     if (data.watchlist) { myWatchlistData = data.watchlist; renderWatchlist(); }
     if (data.portfolio) renderLivePortfolio(data.portfolio);
     if (data.transactions) renderHistory(data.transactions);
     
     // Extracted modular UI update functions
     if (data.fire) updateFireDOM(data.fire);
     if (data.projection) updateProjectionDOM(data.projection);
     if (data.runway) updateRunwayDOM(data.runway);
     if (data.yearlyTotals) updateYearlyTotalsDOM(data.yearlyTotals);
     if (data.budget) updateBudgetDOM(data.budget);
     if (data.pension) renderPensionChart(data.pension);
     if (data.savings) updateSavingsDOM(data.savings, data.runway);
   }

// --- MODULAR UI UPDATE FUNCTIONS ---

function updateFireDOM(fireData) {
    if(document.getElementById('fire-pct')) document.getElementById('fire-pct').innerText = fireData.pct + "%";
    if(document.getElementById('fire-nw')) document.getElementById('fire-nw').innerText = "€ " + new Intl.NumberFormat('it-IT', {maximumFractionDigits:0}).format(fireData.currentNW);
    if(document.getElementById('fire-target')) document.getElementById('fire-target').innerText = "€ " + new Intl.NumberFormat('it-IT', {maximumFractionDigits:0}).format(fireData.fireTarget);
    setTimeout(() => { if(document.getElementById('fire-bar')) document.getElementById('fire-bar').style.width = fireData.bar + "%"; }, 100);
}

function updateProjectionDOM(projData) {
    const elVal = document.getElementById('proj-val');
    const elCurr = document.getElementById('proj-curr');
    const elMsg = document.getElementById('proj-msg');
    const pVal = new Intl.NumberFormat('it-IT').format(projData.projected);
    const cVal = new Intl.NumberFormat('it-IT').format(projData.current);
    
    if(elVal) elVal.innerText = "€ " + pVal;
    if(elCurr) elCurr.innerText = "€ " + cVal;
    if(elMsg) elMsg.innerText = projData.message;
    
    // Dynamic Card Color based on projection (Elegant style)
    const card = elVal ? elVal.closest('.card') : null;
    if (card) {
        // Clean layout with left border emphasis, respecting themes
        card.style.background = ""; // Revert to CSS default
        card.style.color = "var(--text-main)";
        card.style.boxShadow = "0 4px 12px rgba(0,0,0,0.08)";
        card.style.border = "none";
        
        if(elVal) {
            elVal.style.textShadow = "none";
            elVal.style.fontWeight = "900";
        }
        if(elCurr) elCurr.style.color = "var(--gray)";
        if(elMsg) elMsg.style.color = "var(--gray)";

        if (parseFloat(projData.projected) < 0) { 
            // Danger red accent
            card.style.borderLeft = "5px solid var(--danger, #ff3b30)"; 
            if(elVal) elVal.style.color = "var(--danger, #ff3b30)";
        } else { 
            // Success green accent
            card.style.borderLeft = "5px solid var(--stocks-bg, #34c759)"; 
            if(elVal) elVal.style.color = "var(--stocks-bg, #34c759)";
        } 
    }
}

function updateRunwayDOM(runwayData) {
    // 1. Render Standard Runway (Lifestyle based)
    const elVal = document.getElementById('runway-val');
    if (elVal) {
        elVal.innerText = runwayData.months;
        const m = parseFloat(runwayData.months);
        
        // Color coding based on safety thresholds
        if (m < 6) elVal.style.color = 'var(--danger)';
        else if (m < 12) elVal.style.color = 'var(--warning)';
        else elVal.style.color = 'var(--success)';
    }
    
   // 2. Render Average Burn vs Fixed Costs
    if (document.getElementById('runway-avg')) {
        const fmtAvg = new Intl.NumberFormat('it-IT').format(runwayData.avg);
        
        // Get server data directly
        const fixedAmount = runwayData.fixed || 0;
        const fmtFix = new Intl.NumberFormat('it-IT').format(fixedAmount);
        
        // Shows: "€ 1.500 (Fix: € 800)"
        document.getElementById('runway-avg').innerHTML = 
            `€ ${fmtAvg} <span style="font-size:0.8em; opacity:0.7; font-weight:600;">(Fix: € ${fmtFix})</span>`;
    }
    // 3. Render Survival Mode (Emergency Runway)
    // Checks if the element exists in HTML before updating
    if (document.getElementById('runway-survival')) {
        const s = runwayData.survival || 0;
        document.getElementById('runway-survival').innerText = s + " mo";
        
        // Optional: Add visual emphasis for high survival rate
        if (parseFloat(s) > 12) document.getElementById('runway-survival').style.color = 'var(--success)';
    }

    // 4. Update Current Month Flow Fixed Expenses (Was previously failing due to async load)
    const elFlowOutFix = document.getElementById('flow-out-fix');
    if (elFlowOutFix) {
        const fixedAmount = runwayData.fixed || 0;
        const fmtFixOut = new Intl.NumberFormat('it-IT').format(fixedAmount);
        elFlowOutFix.innerText = `(Fix: € ${fmtFixOut})`;
    }
}

function updateYearlyTotalsDOM(yearlyTotals) {
    const label = document.getElementById('yr-label');
    const curYear = document.getElementById('trendYear') ? document.getElementById('trendYear').value : new Date().getFullYear();
    if(label) label.innerText = curYear;
    
    const d = yearlyTotals;
    if(document.getElementById('yr-inc')) document.getElementById('yr-inc').innerText = d.income;
    if(document.getElementById('yr-exp')) document.getElementById('yr-exp').innerText = d.expense;
    
    const elSav = document.getElementById('yr-sav');
    if(elSav) {
        elSav.innerText = d.saving;
        if (d.rawSaving >= 0) { elSav.style.color = 'var(--stocks-bg)'; if(d.rawSaving > 0) elSav.innerText = "+" + d.saving; }
        else { elSav.style.color = 'var(--danger)'; }
    }
    
    // Helper to render top categories list
    const renderCatList = (containerId, list, color) => {
        const cont = document.getElementById(containerId);
        if(!cont) return;
        if(!list || list.length === 0) { 
            cont.innerHTML = `
            <div class="empty-state" style="padding: 20px;">
                <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px; margin-bottom: 8px;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <div class="empty-title" style="font-size: 12px;">No data</div>
            </div>`;
            return; 
        }
        const topList = list.slice(0, 5); 
        let html = '';
        topList.forEach(item => {
            let valFmt = new Intl.NumberFormat('it-IT', { notation: "compact", compactDisplay: "short", maximumFractionDigits: 1 }).format(item.val);
            html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3px; font-size:10px;">
                <span style="color:var(--text-main); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:70px;">${item.cat}</span>
                <span class="sensitive" style="font-weight:700; color:${color};">€ ${valFmt}</span>
            </div>`;
        });
        cont.innerHTML = html;
    };
    renderCatList('yr-cat-inc', d.incCats, '#34c759');
    renderCatList('yr-cat-exp', d.expCats, '#ff3b30');
}

function updateBudgetDOM(budgetData) {
    const cont = document.getElementById('budget-container');
    if(!cont) return;
    if (budgetData.length === 0) {
        cont.innerHTML = '<div style="text-align:center;color:var(--gray);">No expenses yet</div>';
    } else {
        let html = '';
        budgetData.forEach(b => {
            let colorClass = 'bg-green';
            if (b.pct > 85) colorClass = 'bg-orange';
            if (b.pct > 100) colorClass = 'bg-red';
            let width = Math.min(b.pct, 100);
            html += `<div class="budget-item">
                <div class="bg-head"><span>${b.category}</span><span class="bg-nums sensitive">${b.spent.toFixed(0)} / ${b.limit} €</span></div>
                <div class="budget-track"><div class="budget-bar ${colorClass}" style="width:${width}%"></div></div>
            </div>`;
        });
        cont.innerHTML = html;
    }
}

function updateSavingsDOM(savingsData, runwayData) {
    document.getElementById('flow-in').innerText = "€ " + savingsData.income;
    document.getElementById('flow-out').innerText = "€ " + savingsData.expenses;
    document.getElementById('flow-save').innerText = "€ " + savingsData.savings;
    document.getElementById('flow-rate').innerText = "Rate: " + savingsData.rate + "%";
    const elSave = document.getElementById('flow-save');
    if(elSave) elSave.style.color = parseFloat(savingsData.savings) >= 0 ? 'var(--stocks-bg)' : 'var(--danger)';
}
   
/**
 * Updates the Dashboard Summary DOM elements natively.
 */
function updateDashboardDOM(d) {
  if(!d) return;
  
  document.getElementById('liq-eur').innerText = d.liquidNetWorth || "--";
  document.getElementById('liq-usd').innerText = d.liquidNetWorthUSD || "--";
  document.getElementById('tot-eur').innerText = d.totalNetWorth || "--";
  document.getElementById('tot-usd').innerText = d.totalNetWorthUSD || "--";
  
  if (d.summary) {
      if(d.summary.stocks) { document.getElementById('sum-s-a').innerText = d.summary.stocks.amount; setP('sum-s-p', d.summary.stocks.percent); }
      
      // FIX PUNTO 3: Voce Unificata Liquidità per Legenda e Card
      if(d.summary.liquid) { 
          if(document.getElementById('sum-liq-a')) document.getElementById('sum-liq-a').innerText = d.summary.liquid.amount; 
          if(document.getElementById('sum-liq-p')) setP('sum-liq-p', d.summary.liquid.percent); 
          if(document.getElementById('dash-liq-main')) document.getElementById('dash-liq-main').innerText = d.summary.liquid.amount;
      }
      
      if(d.summary.etfs) { document.getElementById('sum-e-a').innerText = d.summary.etfs.amount; setP('sum-e-p', d.summary.etfs.percent); }
      if(d.summary.crypto) { document.getElementById('sum-y-a').innerText = d.summary.crypto.amount; setP('sum-y-p', d.summary.crypto.percent); }
      if(d.summary.others) { document.getElementById('sum-o-a').innerText = d.summary.others.amount; setP('sum-o-p', d.summary.others.percent); }
      if(d.summary.pension) { 
          if(document.getElementById('sum-p-a')) document.getElementById('sum-p-a').innerText = d.summary.pension.amount; 
          if(document.getElementById('sum-p-p')) setP('sum-p-p', d.summary.pension.percent); 
      }
      if(d.summary.realEstate) { 
          if(document.getElementById('sum-re-a')) document.getElementById('sum-re-a').innerText = d.summary.realEstate.amount;
          if(document.getElementById('sum-re-p')) setP('sum-re-p', d.summary.realEstate.percent);
      }
      if(d.summary.bonds) { 
          if(document.getElementById('sum-b-a')) document.getElementById('sum-b-a').innerText = d.summary.bonds.amount;
          if(document.getElementById('sum-b-p')) setP('sum-b-p', d.summary.bonds.percent);
      }

      if(typeof renderAssetChart === 'function') renderAssetChart(d.summary);
  }
  
  const renderSection = (prefix, data) => {
      if(!data) return;
      document.getElementById(`${prefix}-det-main`).innerText = data.main.amount;
      document.getElementById(`${prefix}-det-un-a`).innerText = data.unrealized.amount; 
      setP(`${prefix}-det-un-p`, data.unrealized.percent);
      document.getElementById(`${prefix}-det-re-a`).innerText = data.realized.amount; 
      setP(`${prefix}-det-re-p`, data.realized.percent);
      document.getElementById(`${prefix}-det-bal-a`).innerText = data.balance.amount; 
      setP(`${prefix}-det-bal-p`, data.balance.percent);
  };

  renderSection('y', d.cryptoSection);
  renderSection('s', d.stocksSection);
  renderSection('e', d.etfSection);

  // Autocaricamento asincrono scomposizione conti bancari nella nuova Card
  google.script.run.withSuccessHandler(banksData => {
      const container = document.getElementById('dash-banks-container');
      if(!container || !banksData || !banksData.banks) return;
      let html = '';
      banksData.banks.forEach(b => {
          html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:2px 0;">
                      <span class="label" style="font-size:13px; color:var(--gray); font-weight:600;">${b.name}</span>
                      <span class="amt sensitive" style="font-size:14px; font-weight:700; color:var(--text-main);">€ ${b.balance}</span>
                   </div>`;
      });
      container.innerHTML = html;
  }).getBankBalances();
}

   /**
    * Dashboard Data Polling Management.
    * Handles the cyclical update of the Recap/Dashboard tab.
    */
   let dashboardPollTimeout = null;
   let isDashboardPolling = false;
   
   function startDashboardPolling() {
     if (isDashboardPolling) return;
     isDashboardPolling = true;
     console.log("🟢 Dashboard Polling Started (Smart Loop)");
     
     const poll = () => {
         if (!isDashboardPolling) return;
         dashboardPollTimeout = setTimeout(async () => {
             const dashboardPage = document.getElementById('p-recap'); 
             const isVisible = dashboardPage && 
                               dashboardPage.style.display !== 'none' && 
                               !dashboardPage.classList.contains('hidden');
             
             const yearBox = document.getElementById('trendYear');
             const currentYear = new Date().getFullYear().toString();
             const selectedYear = yearBox ? yearBox.value : currentYear;
             
             if (!document.hidden && isVisible && selectedYear === currentYear) {
                 console.log("🔄 Polling Dashboard Data...");
                 try {
                     const data = await run('getDashboardData');
                     if(data && !data.error) {
                         localStorage.setItem('dashboard_cache', JSON.stringify(data));
                         updateDashboardDOM(data);
                     }
                 } catch(err) {
                     console.warn("Polling error:", err);
                 }
             } else if (document.hidden) {
                 console.log("⏸️ Dashboard Polling skipped: Document hidden");
             } else if (!isVisible) {
                 console.log("⏸️ Dashboard Polling skipped: Dashboard not visible");
             } else {
                 console.log("⏸️ Dashboard Polling skipped: Viewing historical year");
             }
             poll();
         }, 60000); // 60s
     };
     poll();
   }
   
   function stopDashboardPolling() {
     isDashboardPolling = false;
     if (dashboardPollTimeout) {
         clearTimeout(dashboardPollTimeout);
         dashboardPollTimeout = null;
     }
     console.log("🔴 Dashboard Polling Stopped");
   }
   
   function fetchBudgets(pre) {
     // FIX (2.12): se riceve dati pre-caricati (da getPostTransactionRefresh) renderizza subito,
     // senza un nuovo round-trip. Senza argomento il comportamento è identico a prima.
     if (pre !== undefined) { renderBudgets(pre); return; }
     showSkeleton('budget-container', 5, '30px');
     google.script.run.withSuccessHandler(renderBudgets).getBudgetStatus();
   }
   function renderBudgets(data) {
     if (!stateChanged('budgets', data)) return;
     const cont = document.getElementById('budget-container');
     if (data.length === 0) { cont.innerHTML = '<div style="text-align:center;color:var(--gray);">No expenses yet</div>'; return; }
     let html = '';
     data.forEach(b => {
         let colorClass = 'bg-green';
         if (b.pct > 85) colorClass = 'bg-orange';
         if (b.pct > 100) colorClass = 'bg-red';
         let width = Math.min(b.pct, 100);
         html += `<div class="budget-item"><div class="bg-head"><span>${b.category}</span><span class="bg-nums sensitive">${b.spent.toFixed(0)} / ${b.limit} €</span></div><div class="budget-track"><div class="budget-bar ${colorClass}" style="width:${width}%"></div></div></div>`;
     });
     cont.innerHTML = html;
   }
   
   function fetchBalances(pre) {
     if (pre !== undefined) { renderBalances(pre); return; } // FIX (2.12): usa dati pre-caricati
     google.script.run.withSuccessHandler(renderBalances).getBankBalances();
   }
   function renderBalances(data) {
     if (!stateChanged('balances', data)) return;
     if (data) {
         document.getElementById('bal-col5').innerText = data.col5;
         document.getElementById('bal-col6').innerText = data.col6;
         document.getElementById('bal-col7').innerText = data.col7;

   function hardResetApp() {
  if(!confirm("Force reload all data from server?")) return;
  
  if (typeof Swal !== 'undefined') {
    Swal.fire({
      title: '🧹 Cleaning...',
      text: 'Resetting cache and reloading...',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });
  } else if (window.event && window.event.currentTarget) {
    window.event.currentTarget.innerText = "🧹 Cleaning...";
  }

  localStorage.clear();
  google.script.run.withSuccessHandler(() => {
      console.log("System Reset Complete.");
      window.location.reload(); 
  }).clearServerCache();

   function setP(id, val) {
     const el = document.getElementById(id);
     if (!el) return;
     el.innerText = val;
   
     if (id.startsWith('sum-')) {
         el.style.color = 'var(--text-main)';
         const amtId = id.replace('-p', '-a');
         const amtEl = document.getElementById(amtId);
         if (amtEl) amtEl.style.color = 'var(--text-main)';
         return;
     }
   
     const isNegative = val && String(val).includes('-');
     const color = isNegative ? 'var(--danger)' : 'var(--stocks-bg)';
     el.style.color = color;
   
     if (id.endsWith('-p') && id.includes('-det-')) {
         const amtId = id.replace('-p', '-a');
         const amtEl = document.getElementById(amtId);
         if (amtEl) {
             amtEl.style.color = color;
             amtEl.style.transition = 'color 0.3s ease';
         }
     }
   }

   function renderHistory(data) {
     if (!stateChanged('history', data)) return;
     const container = document.getElementById('history-container');
     if (!data || data.length === 0) { container.innerHTML = '<div style="text-align:center; padding:10px; color:var(--gray)">No recent transactions</div>'; return; }
     let html = '';
     data.forEach(tx => {
         let colorClass = 'type-' + tx.type;
         let displayAmt = tx.amount < 0 ? tx.amount.toFixed(2) : '+' + tx.amount.toFixed(2);
         let noteHtml = '';
         if (tx.details && tx.details !== "No Note" && tx.details !== "") {
             noteHtml = `<div style="font-size:11px; color:#8e8e93; margin-bottom:2px; font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:140px;">${tx.details}</div>`;
         }
         let editBtn = (tx.type === 'Investment' || tx.type === 'Pension' || tx.type === 'Debt') ? '' : `<span class="h-edit" style="margin-right:12px; cursor:pointer;" onclick="editTx('${tx.sheet || 'Expenses Tracker 2026'}', ${tx.row})">✏️</span>`;
         html += `<div class="h-item"><div class="h-left"><span class="h-cat">${tx.category}</span>${noteHtml} <span class="h-date">${tx.date}</span></div><div class="h-right"><div class="h-amt ${colorClass} sensitive">€ ${displayAmt}</div><div style="display:flex; align-items:center; justify-content:flex-end;"><div class="h-type" style="margin-right:8px;">${tx.type}</div>${editBtn}<span class="h-del" style="cursor:pointer;" onclick="deleteTx('${tx.sheet || 'Expenses Tracker 2026'}', ${tx.row})">🗑️</span></div></div></div>`;
     });
     container.innerHTML = html;
   }
   
  function renderHistoricalNWDOM(data) {
     if (!data || data.error) {
         console.warn("Historical Data skipped or Error:", data ? data.error : "No data");
         return;
     }

     const fmtEur = (n) => "€ " + new Intl.NumberFormat('it-IT', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n);
     const fmtUsd = (n) => "$ " + new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n);
     
     const setVal = (id, val) => { const el = document.getElementById(id); if(el) el.innerText = fmtEur(val); };
     const setUsd = (id, val) => { const el = document.getElementById(id); if(el) el.innerText = fmtUsd(val); };
     const setAlloc = (id, textPct) => { const el = document.getElementById(id); if(el) { el.innerText = textPct; el.style.color = 'var(--text-main)'; } };   
     const setTrend = (id, valStr) => {
         const el = document.getElementById(id); if(!el) return;
         el.innerText = valStr;
         el.classList.remove('pos-change', 'neg-change');
         if (String(valStr).includes('-')) { el.style.color = 'var(--danger)'; el.classList.add('neg-change'); }
         else { el.style.color = 'var(--stocks-bg)'; el.classList.add('pos-change'); }
     };
     
     // FIX: Invertiti per correggere il bug, ora Total è su Total e Liquid su Liquid
     setVal('liq-eur', data.liquid.val); setUsd('liq-usd', data.liquid.usd);
     setVal('tot-eur', data.total.val);  setUsd('tot-usd', data.total.usd);
     
     setVal('sum-s-a', data.summary.stocks.val); setAlloc('sum-s-p', data.summary.stocks.pct);
     setVal('sum-e-a', data.summary.etfs.val); setAlloc('sum-e-p', data.summary.etfs.pct);
     setVal('sum-y-a', data.summary.crypto.val); setAlloc('sum-y-p', data.summary.crypto.pct);
     setVal('sum-o-a', data.summary.others.val); setAlloc('sum-o-p', data.summary.others.pct);
     
     if (!document.getElementById('sum-ceq-a')) {
         setVal('sum-c-a', data.summary.cash.val + data.summary.cashEq.val);
         setAlloc('sum-c-p', data.summary.cash.pct); 
     } else {
         setVal('sum-c-a', data.summary.cash.val); setAlloc('sum-c-p', data.summary.cash.pct);
         setVal('sum-ceq-a', data.summary.cashEq.val); setAlloc('sum-ceq-p', data.summary.cashEq.pct);
     }
     
     if(document.getElementById('sum-p-a')) {
         setVal('sum-p-a', data.summary.pension.val); setAlloc('sum-p-p', data.summary.pension.pct);
     }

     // --- UPDATE: Aggiornamento dinamico Card "Sottostanti" (Real Estate, Bonds, Liabilities) ---
     if(data.summary.realEstate) {
         if(document.getElementById('sum-re-a')) setVal('sum-re-a', data.summary.realEstate.val);
         if(document.getElementById('sum-re-p')) setAlloc('sum-re-p', data.summary.realEstate.pct);
         
         // Detail Cards Update
         if(document.getElementById('re-det-main')) setVal('re-det-main', data.summary.realEstate.val);
         if(document.getElementById('re-det-gross')) setVal('re-det-gross', data.summary.realEstate.gross);
         if(document.getElementById('re-det-debt')) setVal('re-det-debt', data.summary.realEstate.debt);
     }
     
     if(data.summary.bonds) {
         if(document.getElementById('sum-b-a')) setVal('sum-b-a', data.summary.bonds.val);
         if(document.getElementById('sum-b-p')) setAlloc('sum-b-p', data.summary.bonds.pct);
         
         // Detail Cards Update
         if(document.getElementById('b-det-main')) setVal('b-det-main', data.summary.bonds.val);
         if(document.getElementById('b-det-gross')) setVal('b-det-gross', data.summary.bonds.gross);
         if(document.getElementById('b-det-debt')) setVal('b-det-debt', data.summary.bonds.debt);
         if(document.getElementById('b-det-corp')) setVal('b-det-corp', data.summary.bonds.corpNet);
         if(document.getElementById('b-det-gov')) setVal('b-det-gov', data.summary.bonds.govNet);
     }

     if(data.summary.liabilities) {
         if(document.getElementById('sum-l-a')) setVal('sum-l-a', data.summary.liabilities.val);
         if(document.getElementById('l-det-main')) setVal('l-det-main', data.summary.liabilities.val);
         if(document.getElementById('l-det-gross')) setVal('l-det-gross', data.summary.liabilities.gross);
         if(document.getElementById('l-det-debt')) setVal('l-det-debt', data.summary.liabilities.debt);
     }
     
     const fillCard = (prefix, d) => {
         setVal(`${prefix}-det-main`, d.main);
         setVal(`${prefix}-det-un-a`, d.unrVal); setTrend(`${prefix}-det-un-p`, d.unrPct);
         setVal(`${prefix}-det-re-a`, d.realVal); setTrend(`${prefix}-det-re-p`, d.realPct);
         setVal(`${prefix}-det-bal-a`, d.balVal); setTrend(`${prefix}-det-bal-p`, d.balPct);
         if(document.getElementById(`${prefix}-det-inv`)) setVal(`${prefix}-det-inv`, d.invested);
     };
     
     if (data.details) { 
         fillCard('y', data.details.crypto); 
         fillCard('s', data.details.stocks); 
         fillCard('e', data.details.etfs); 
     }
     
     const mockSummary = { 
         stocks: { raw: data.summary.stocks.val }, 
         liquid: { raw: data.summary.cash.val + data.summary.cashEq.val }, 
         etfs: { raw: data.summary.etfs.val }, 
         crypto: { raw: data.summary.crypto.val }, 
         others: { raw: data.summary.others.val }, 
         pension: { raw: data.summary.pension.val },
         realEstate: { raw: data.summary.realEstate ? data.summary.realEstate.val : 0 },
         bonds: { raw: data.summary.bonds ? data.summary.bonds.val : 0 }
     };
     if(typeof renderAssetChart === 'function') renderAssetChart(mockSummary);
   }

   function renderTaxOptimization(data) {
       if(!data || data.error) {
           document.getElementById('tax-bill-container').innerHTML = '<div style="color:var(--danger); text-align:center; padding: 20px;">Data not available</div>';
           document.getElementById('tax-harvest-container').innerHTML = '<div style="color:var(--danger); text-align:center; padding: 20px;">Data not available</div>';
           return;
       }
       
       // Handle Expiring Zainetto Alert
       const alertBanner = document.getElementById('tax-alert-banner');
       const alertText = document.getElementById('tax-alert-text');
       if (data.zainettoDetails && data.zainettoDetails.isExpiringThisYear && alertBanner && alertText) {
           alertBanner.style.display = 'block';
           let amtFmt = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(data.zainettoDetails.expiringAmount);
           alertText.innerHTML = `Hai <b>€ ${amtFmt}</b> di minusvalenze pregresse che scadranno alla fine di quest'anno se non compensate con plusvalenze.`;
       } else if (alertBanner) {
           alertBanner.style.display = 'none';
       }

       // Render Tax Bill
       let billHtml = '';
       data.bill.forEach(item => {
           let valColor = "var(--text-main)";
           if(item.metric.includes("Gains") || item.metric.includes("Residual Basket")) valColor = "var(--success)";
           if(item.metric.includes("Losses") || item.metric.includes("TAX DUE") || item.metric.includes("TAXABLE")) valColor = "var(--danger)";
           
           let valFmt = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(item.value);
           
           billHtml += `
           <div class="tax-row" style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom: 1px solid var(--row-border);">
               <div>
                   <div class="tax-label" style="font-weight: 800; font-size: 13px; color: var(--text-main);">${item.metric}</div>
                   <div class="tax-desc" style="font-size: 11px; color: var(--gray); margin-top:2px;">${item.desc}</div>
               </div>
               <div class="tax-val sensitive" style="font-weight: 900; font-size: 14px; color: ${valColor};">€ ${valFmt}</div>
           </div>`;
       });
       document.getElementById('tax-bill-container').innerHTML = billHtml || '<div style="text-align:center; color:var(--gray); padding: 20px;">No tax data</div>';
       
       // Render Harvesting
       let harvHtml = '';
       data.harvesting.forEach(item => {
           let pnlFmt = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(item.unrealized);
           let minusFmt = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(item.minus);
           
           harvHtml += `
           <div style="display:flex; justify-content:space-between; align-items:center; padding: 12px 0; border-bottom: 1px solid var(--row-border);">
               <div>
                   <div style="font-weight: 800; font-size: 14px; color: var(--text-main);">${item.ticker} <span style="font-size:11px; font-weight:600; color:var(--gray); background:var(--section-bg); padding:2px 6px; border-radius:6px; margin-left:6px;">${item.qty} units</span></div>
                   <div style="font-size: 11px; color: var(--gray); margin-top:4px;">${item.note}</div>
               </div>
               <div style="text-align:right;">
                   <div class="sensitive" style="font-size: 14px; font-weight: 800; color: var(--danger);">-€ ${pnlFmt.replace('-','')}</div>
                   <div class="sensitive" style="font-size: 11px; font-weight: 700; color: var(--success); margin-top:2px;">+€ ${minusFmt} offset</div>
               </div>
           </div>`;
       });
       document.getElementById('tax-harvest-container').innerHTML = harvHtml || '<div style="text-align:center; color:var(--gray); padding: 20px;">No losing positions found.</div>';
       
       let totFmt = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(data.totalPotential);
       document.getElementById('tax-harvest-total').innerText = "€ " + totFmt;
   }

   function runTaxSimulation() {
       const ticker = document.getElementById('simTicker').value;
       const qty = document.getElementById('simQty').value;
       const price = document.getElementById('simPrice').value;
       const resDiv = document.getElementById('sim-result');
       
       if(!ticker || !qty || !price) {
           alert("Please fill all fields for the simulation.");
           return;
       }
       
       resDiv.style.display = 'block';
       resDiv.innerHTML = '<div style="text-align:center; color:var(--gray); font-size:12px;">Running simulation...</div>';
       
       google.script.run.withSuccessHandler(function(res) {
           if(res && res.success) {
               let tbFmt = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(res.simulatedTaxableBase);
               let taxFmt = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(res.simulatedTaxDue);
               let resFmt = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(res.simulatedResidualBasket);
               
               function formatDelta(val, invertColors) {
                   if(Math.abs(val) < 0.01) return `<span style="color:var(--gray); font-size:11px; margin-left:6px;">(0.00)</span>`;
                   let color = val > 0 ? "var(--danger)" : "var(--success)";
                   if(invertColors) color = val > 0 ? "var(--success)" : "var(--danger)";
                   let sign = val > 0 ? "+" : "";
                   let f = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val);
                   return `<span style="color:${color}; font-size:11px; margin-left:6px;">(${sign}€ ${f})</span>`;
               }

               let dTb = formatDelta(res.deltaTaxableBase, false); // Increase in taxable base is BAD
               let dTax = formatDelta(res.deltaTaxDue, false);     // Increase in tax due is BAD
               let dRes = formatDelta(res.deltaResidualBasket, true); // Increase in residual basket is GOOD
               
               resDiv.innerHTML = `
                   <div style="font-weight:bold; font-size:12px; color:var(--text-main); margin-bottom:10px; border-bottom:1px solid var(--row-border); padding-bottom:5px;">
                      Simulation Results <span style="font-weight:normal; color:var(--gray); font-size:10px;">(${res.inferredType})</span>
                   </div>
                   <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                       <span style="font-size:12px; color:var(--gray);">New Taxable Base:</span>
                       <span style="font-size:13px; font-weight:bold; color:var(--text-main);">€ ${tbFmt} ${dTb}</span>
                   </div>
                   <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                       <span style="font-size:12px; color:var(--gray);">New Estimated Tax Due:</span>
                       <span style="font-size:13px; font-weight:bold; color:var(--text-main);">€ ${taxFmt} ${dTax}</span>
                   </div>
                   <div style="display:flex; justify-content:space-between;">
                       <span style="font-size:12px; color:var(--gray);">New Residual Basket:</span>
                       <span style="font-size:13px; font-weight:bold; color:var(--text-main);">€ ${resFmt} ${dRes}</span>
                   </div>
               `;
           } else {
               resDiv.innerHTML = '<div style="color:var(--danger); font-size:12px;">Simulation failed. Ensure ticker exists.</div>';
           }
       }).simulateSale(ticker, qty, price);
   }

// Toggle menu without needing specific IDs
function toggleMasterMenu(buttonElement) {
  // Find the dropdown that is immediately after the clicked button
  const currentMenu = buttonElement.nextElementSibling;
  
  // Close all other open dropdowns
  const allDropdowns = document.querySelectorAll('.kebab-dropdown-content');
  const allTriggers = document.querySelectorAll('.kebab-trigger');
  
  allDropdowns.forEach((dropdown, index) => {
    if (dropdown !== currentMenu && dropdown.classList.contains('show-kebab')) {
      dropdown.classList.remove('show-kebab');
      if(allTriggers[index]) allTriggers[index].setAttribute('aria-expanded', 'false');
    }
  });
  
  // Toggle the current one
  const isExpanded = currentMenu.classList.toggle('show-kebab');
  buttonElement.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
}

// Close when clicking outside
window.addEventListener('click', function(event) {
  if (!event.target.closest('.kebab-trigger')) {
    const allDropdowns = document.querySelectorAll('.kebab-dropdown-content');
    const allTriggers = document.querySelectorAll('.kebab-trigger');
    allDropdowns.forEach((dropdown, index) => {
      dropdown.classList.remove('show-kebab');
      if(allTriggers[index]) allTriggers[index].setAttribute('aria-expanded', 'false');
    });
  }
});

// Call the injection function when the DOM is fully loaded
document.addEventListener('DOMContentLoaded', injectMasterMenus);
