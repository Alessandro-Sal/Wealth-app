<script>
   /**
    * ======================================================================================
    * BLOCK 2: NAVIGATION, PIN LOCK & UI HANDLERS
    * Handles Tab Switching, Pull-to-Refresh, PIN Pad logic, and Modal interactions.
    * ======================================================================================
    */
   
   /**
    * Main Tab Switcher.
    * Manages visibility of pages and triggers specific data fetches per tab.
    * 
    */
   const tabLastLoaded = {}; // ← sostituisci "const loadedTabs = new Set()"
   const TAB_CACHE_MS = 1 * 60 * 1000; // 1 minuto
   
   function changeTab(tab) {
     stopMarketPolling(); 
     
     document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
     document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
     
     const page = document.getElementById('p-' + tab);
     if(page) page.classList.add('active-page');
     
     const btn = document.getElementById('btn-' + tab);
     if(btn) btn.classList.add('active');
     
     if(navigator.vibrate) navigator.vibrate(10);
     window.scrollTo({top: 0, behavior: 'auto'});
   
     // Ricarica solo se è passato abbastanza tempo
     const now = Date.now();
     const lastLoad = tabLastLoaded[tab] || 0;
     const needsRefresh = (now - lastLoad) > TAB_CACHE_MS;
   
     if (needsRefresh) {
       tabLastLoaded[tab] = now; // aggiorna il timer
   
       if (tab === 'recap') {
           fetchDashboard(); 
           setTimeout(() => { if (typeof updateAllCharts === 'function') updateAllCharts(); }, 50);
       }
       if (tab === 'market') {
           startMarketPolling(); 
           checkMarketStatus(); 
       }
       if (tab === 'news') {
           loadNews();
       }
       if (tab === 'invest') {
           fetchInvestHistory();
       }
     }
   }
   
   /**
    * Closes all active modal sheets.
    */
   function closeAllSheets() {
     // FIX (2.2): chiude QUALSIASI bottom-sheet aperto (tutti usano la classe .sheet-modal),
     // non piu' una lista hardcoded di 7 id. Prima 3 modali (portfolio-news-sheet,
     // portfolio-alerts-sheet, ticker-notes-sheet) non venivano chiusi -> UI bloccata.
     document.querySelectorAll('.sheet-modal.active').forEach(el => el.classList.remove('active'));
     const backdrop = document.getElementById('common-backdrop');
     if (backdrop) backdrop.classList.remove('active');
   }
   
   // --- PIN Management (Main App Lock) ---
   
   /**
    * Adds a digit to the PIN entry.
    * Triggers verification when 4 digits are entered.
    */
   function addPin(num) {
     if (navigator.vibrate) navigator.vibrate(15);
     if (currentPin.length < 4) {
       currentPin += num;
       updatePinDots();
       if (currentPin.length === 4) setTimeout(checkPin, 100); 
     }
   }
   
   function clearPin() {
     if (navigator.vibrate) navigator.vibrate(15);
     currentPin = "";
     updatePinDots();
   }
   
   function updatePinDots() {
     for (let i = 1; i <= 4; i++) {
       let dot = document.getElementById('d' + i);
       if (i <= currentPin.length) dot.classList.add('filled');
       else dot.classList.remove('filled');
     }
   }
   
   /**
    * Aborts PIN entry and keeps the app in Privacy Mode.
    */
   function abortPin() {
     if (navigator.vibrate) navigator.vibrate(20);
     const lock = document.getElementById('lock-screen');
     lock.style.opacity = '0';
     setTimeout(() => {
         lock.style.display = 'none';
         clearPin();
         // Ensure Privacy Mode remains active if aborted
         if (!document.body.classList.contains('privacy-mode')) {
             document.body.classList.add('privacy-mode');
         }
     }, 300);
   }
   
   /**
    * Verifies the PIN against the server.
    * 
    */
   function checkPin() {
     const title = document.getElementById('pinTitle');
     const originalTitle = title.innerText;
     title.innerText = "Verifying...";
     
     google.script.run
       .withSuccessHandler(isValid => {
           if (isValid) {
               // Success: Set Session Expiry (15 mins)
               const expiry = new Date().getTime() + (15 * 60 * 1000);
               localStorage.setItem('auth_expiry', expiry);
               
               // Hide Lock Screen & Unlock UI
               const lock = document.getElementById('lock-screen');
               lock.style.opacity = '0';
               setTimeout(() => {
                   lock.style.display = 'none';
                   document.body.classList.remove('privacy-mode');
                   updateAllCharts();
                   updateGeminiLockIcon(true);
                   resetGeminiChat();
                   clearPin();
                   title.innerText = originalTitle;
               }, 300);
           } else {
               // Failure: Shake Animation & Feedback
               if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
               const dots = document.querySelector('.pin-display');
               title.innerText = "Error";
               title.style.color = "#ff3b30";
               dots.classList.add('shake');
               setTimeout(() => {
                   dots.classList.remove('shake');
                   clearPin();
                   title.innerText = "Enter Passcode";
                   title.style.color = "white";
               }, 500);
           }
       })
       .withFailureHandler(err => {
           alert("Connection error during verification.");
           clearPin();
           title.innerText = "Enter Passcode";
       })
       .verifyUserPin(currentPin);
   }
   
   // --- Pull to Refresh Logic ---
   
   let touchStartY = 0;
   let ptrThreshold = 150; 
   const ptrElement = document.createElement('div');
   ptrElement.id = 'ptr-indicator';
   ptrElement.style.cssText = `position: fixed; top: -60px; left: 0; width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #007aff; font-size: 24px; z-index: 999; transition: top 0.3s ease; background: rgba(255,255,255,0.8); backdrop-filter: blur(5px);`;
   ptrElement.innerHTML = '⬇️ Pull'; 
   document.body.appendChild(ptrElement);
   
   window.addEventListener('touchstart', e => { 
       if (window.scrollY === 0) touchStartY = e.touches[0].clientY; 
   }, {passive: true});
   
   window.addEventListener('touchmove', e => {
     const touchY = e.touches[0].clientY;
     const pullDistance = touchY - touchStartY;
     
     if (window.scrollY === 0 && pullDistance > 0) {
       if (pullDistance < ptrThreshold) {
          ptrElement.style.top = (pullDistance / 2.5 - 60) + 'px';
          ptrElement.innerHTML = '⬇️ Pull';
          ptrElement.style.opacity = '0.5';
       } else {
          ptrElement.style.top = '0px'; 
          ptrElement.innerHTML = '🚀 Release!';
          ptrElement.style.opacity = '1';
       }
     }
   }, {passive: true});
   
   window.addEventListener('touchend', e => {
     const touchEndY = e.changedTouches[0].clientY;
     if (window.scrollY === 0 && (touchEndY - touchStartY) > ptrThreshold) {
       performRefresh();
     } else {
       ptrElement.style.top = '-60px';
     }
     touchStartY = 0;
   });
   
   /**
    * Triggers a global data refresh.
    * Updates dashboard, charts, history, and markets.
    */
   function performRefresh() {
     if(navigator.vibrate) navigator.vibrate(50);
     ptrElement.innerHTML = '<div class="skeleton" style="width:30px; height:30px; border-radius:50%; margin:0;"></div>'; 
     console.log("Refreshing Data...");
     
     let year = document.getElementById('trendYear') ? document.getElementById('trendYear').value : 2026;
     
     fetchDashboard();
     fetchHistory();
     fetchInvestHistory();
     fetchBudgets();
     fetchLivePortfolio();
     fetchProjection(year);
     fetchFireProgress(year);
     fetchYearlyTotals(year);
     
     setTimeout(() => {
       ptrElement.style.top = '-60px';
       setTimeout(() => ptrElement.innerHTML = '⬇️ Pull', 300);
     }, 1500);
   }
   
   // --- Connectivity & Scroll Helpers ---
   
   // Offline Banner
   const offlineDiv = document.createElement('div');
   offlineDiv.id = 'offline-banner';
   offlineDiv.innerText = '⚠️ No Connection';
   document.body.appendChild(offlineDiv);
   
   function updateOnlineStatus() {
     if (navigator.onLine) {
       offlineDiv.style.top = '-50px'; 
       offlineDiv.style.background = '#34c759'; 
       offlineDiv.innerText = 'Connection Restored';
       setTimeout(() => { 
           offlineDiv.style.background = '#ff3b30'; 
           offlineDiv.innerText = '⚠️ No Connection'; 
       }, 2000);
     } else {
       offlineDiv.style.top = '0'; 
     }
   }
   window.addEventListener('online', updateOnlineStatus);
   window.addEventListener('offline', updateOnlineStatus);
   updateOnlineStatus();
   
   // Scroll to Top Button
   const btnUp = document.createElement('div');
   btnUp.id = 'btn-up';
   btnUp.innerHTML = '⬆️';
   btnUp.onclick = () => window.scrollTo({top: 0, behavior: 'smooth'});
   document.body.appendChild(btnUp);
   
   window.addEventListener('scroll', () => {
     const allHeaders = document.querySelectorAll('.header-actions');
     
     // Hide header actions on scroll for cleaner UI
     allHeaders.forEach(header => {
       if (window.scrollY > 50) header.classList.add('nav-hidden');
       else header.classList.remove('nav-hidden');
     });
     
     // Show "Back to Top" button
     if (btnUp) {
       if (window.scrollY > 300) btnUp.classList.add('visible');
       else btnUp.classList.remove('visible');
     }
   }, {passive: true});
   
   // Keyboard Support for PIN Entry (Desktop Mode)
   document.addEventListener('keydown', function(e) {
     const lockScreen = document.getElementById('lock-screen');
     const style = window.getComputedStyle(lockScreen);
     
     if (style.display === 'none' || style.opacity === '0') return;
     
     if (e.key >= '0' && e.key <= '9') addPin(parseInt(e.key));
     if (e.key === 'Backspace') clearPin();
   });

   function openSettings() {
    closeAllSheets();
    document.getElementById('settings-sheet').classList.add('active');
    document.getElementById('common-backdrop').classList.add('active');
}

// --- GESTIONE CATEGORIE UNIFICATA ---
   function manageCategoriesUI() {
       closeAllSheets(); // Chiude il modal Settings automaticamente
       const isDark = document.body.classList.contains('dark-mode');
       
       Swal.fire({
           title: `Nuova Categoria`,
           html: `
               <select id="swal-cat-type" class="swal2-input" style="width: 80%; margin-bottom: 10px;">
                   <option value="Expense">Expense (Uscita)</option>
                   <option value="Income">Income (Entrata)</option>
                   <option value="Investment">Investment (Investimento)</option>
                   <option value="Transfer">Transfer (Giroconto)</option>
               </select>
               <input id="swal-cat-name" class="swal2-input" placeholder="Nome Categoria (es. Ristorante)" style="width: 80%;">
           `,
           showCancelButton: true,
           confirmButtonText: 'Salva',
           cancelButtonText: 'Annulla',
           background: isDark ? '#1c1c1e' : '#fff',
           color: isDark ? '#fff' : '#000',
           preConfirm: () => {
               const type = document.getElementById('swal-cat-type').value;
               const name = document.getElementById('swal-cat-name').value;
               if (!name) {
                   Swal.showValidationMessage('Devi inserire un nome per la categoria!');

               }
               return { type: type, name: name };
           }
       }).then((result) => {
           if (result.isConfirmed) {
               Swal.fire({ title: 'Salvataggio...', didOpen: () => { Swal.showLoading() }, background: isDark ? '#1c1c1e' : '#fff' });
               
               google.script.run.withSuccessHandler(res => {
                   Swal.fire({ icon: 'success', title: 'Salvato!', showConfirmButton: false, timer: 1500, background: isDark ? '#1c1c1e' : '#fff' });
                   if (typeof fetchAppConfigInit === 'function') fetchAppConfigInit(); // Ricarica le categorie nel form
               }).withFailureHandler(err => {
                   Swal.fire({ icon: 'error', title: 'Errore', text: err.message, background: isDark ? '#1c1c1e' : '#fff' });
               }).addCategoryToSheet(result.value.type, result.value.name); 
           }
       });
   }

   // --- FIXED EXPENSES MANAGEMENT (Advanced UI with Dynamic Split, Dates & Actual Banks) ---
   function addFixedExpenseUI() {
       closeAllSheets(); 
       const isDark = document.body.classList.contains('dark-mode');
       
       // 1. Generate category options dynamically
       let catOptions = '<option value="">-- Seleziona Categoria --</option>';
       if (typeof GLOBAL_APP_CONFIG !== 'undefined' && GLOBAL_APP_CONFIG.categories && GLOBAL_APP_CONFIG.categories['Expense']) {
           GLOBAL_APP_CONFIG.categories['Expense'].forEach(c => {
               catOptions += `<option value="${c}">${c}</option>`;
           });
       }

       // 2. Define Bank options based on your real columns
       const bankOptions = `
           <option value="5">Intesa San Paolo</option>
           <option value="6">N26</option>
           <option value="7">On the go Wallet</option>
           <option value="8">BuddyBank</option>
           <option value="9">Revolut</option>
           <option value="10">Food stamps</option>
       `;

       Swal.fire({
           title: 'Nuova Spesa Fissa',
           html: `
               <input id="swal-note" class="swal2-input" placeholder="Nome (es. Netflix, Affitto)" style="width: 80%;">
               
               <select id="swal-cat" class="swal2-input" style="width: 80%;">
                   ${catOptions}
               </select>

               <div style="display:flex; justify-content:space-between; width:80%; margin: 15px auto 0;">
                   <div style="width:48%; text-align:left;">
                       <label style="font-size:11px; color:var(--gray); margin-left:5px;">Data Inizio (Opzionale)</label>
                       <input id="swal-start" type="date" class="swal2-input" style="width:100%; margin:0; padding: 0 10px;">
                   </div>
                   <div style="width:48%; text-align:left;">
                       <label style="font-size:11px; color:var(--gray); margin-left:5px;">Data Fine (Opzionale)</label>
                       <input id="swal-end" type="date" class="swal2-input" style="width:100%; margin:0; padding: 0 10px;">
                   </div>
               </div>
               
               <input id="swal-day" type="number" class="swal2-input" placeholder="Giorno addebito mensile (es. 15)" min="1" max="31" style="width: 80%; margin-top: 15px;">

               <div id="swal-single-bank-container" style="margin-top: 15px;">
                   <input id="swal-amt" type="number" class="swal2-input" placeholder="Importo Totale (es. 12.99)" step="0.01" style="width: 80%; margin-bottom: 10px;">
                   <select id="swal-col" class="swal2-input" style="width: 80%;">
                       <option value="">-- Seleziona Banca --</option>
                       ${bankOptions}
                   </select>
               </div>

               <div style="margin-top: 20px; text-align: left; width: 80%; margin-left: auto; margin-right: auto; background: var(--section-bg); padding: 10px; border-radius: 10px;">
                   <label style="font-size: 14px; color: var(--text-main); display:flex; align-items:center; gap:8px; cursor:pointer;">
                       <input type="checkbox" id="swal-split-check" style="width:18px; height:18px;">
                       🔁 Dividi su più conti (Split)
                   </label>
               </div>

               <div id="swal-split-container" style="display:none; margin-top: 10px; background: rgba(255,59,48,0.05); border: 1px solid rgba(255,59,48,0.2); padding: 15px; border-radius: 12px; width: 80%; margin-left: auto; margin-right: auto; text-align: left;">
                   <div style="font-size: 12px; color: var(--gray); margin-bottom: 12px; line-height:1.4;">
                       Scegli i conti e gli importi. Il totale verrà calcolato automaticamente.
                   </div>
                   
                   <div id="split-rows-container">
                       <div class="split-row" style="display:flex; gap:8px; margin-bottom:10px;">
                           <select class="swal2-input split-bank" style="width:65%; margin:0; padding:0 10px; font-size:13px;">
                               <option value="">-- Banca --</option>
                               ${bankOptions}
                           </select>
                           <input type="number" class="swal2-input split-amt" placeholder="€" step="0.01" style="width:35%; margin:0; padding:0 10px; font-size:14px; text-align:center;">
                       </div>
                       <div class="split-row" style="display:flex; gap:8px; margin-bottom:10px;">
                           <select class="swal2-input split-bank" style="width:65%; margin:0; padding:0 10px; font-size:13px;">
                               <option value="">-- Banca --</option>
                               ${bankOptions}
                           </select>
                           <input type="number" class="swal2-input split-amt" placeholder="€" step="0.01" style="width:35%; margin:0; padding:0 10px; font-size:14px; text-align:center;">
                       </div>
                   </div>
                   
                   <button type="button" id="btn-add-split" style="background:var(--text-main); color:var(--bg-main); border:none; border-radius:8px; padding:6px 12px; font-size:11px; font-weight:bold; cursor:pointer; margin-top:5px;">
                       + Aggiungi Conto
                   </button>
               </div>
           `,
           showCancelButton: true,
           confirmButtonText: 'Aggiungi',
           cancelButtonText: 'Annulla',
           background: isDark ? '#1c1c1e' : '#fff',
           color: isDark ? '#fff' : '#000',
           
           // EVENT LISTENERS for dynamic split logic
           didOpen: () => {
               const splitCheck = document.getElementById('swal-split-check');
               const singleCont = document.getElementById('swal-single-bank-container');
               const splitCont = document.getElementById('swal-split-container');
               const btnAddSplit = document.getElementById('btn-add-split');
               const splitRowsCont = document.getElementById('split-rows-container');
               
               // Toggle Split view
               splitCheck.addEventListener('change', (e) => {
                   if (e.target.checked) {
                       singleCont.style.display = 'none';
                       splitCont.style.display = 'block';
                   } else {
                       singleCont.style.display = 'block';
                       splitCont.style.display = 'none';
                   }
               });

               // Add new split row dynamically
               btnAddSplit.addEventListener('click', () => {
                   const row = document.createElement('div');
                   row.className = 'split-row';
                   row.style.cssText = 'display:flex; gap:8px; margin-bottom:10px;';
                   row.innerHTML = `
                       <select class="swal2-input split-bank" style="width:65%; margin:0; padding:0 10px; font-size:13px;">
                           <option value="">-- Banca --</option>
                           ${bankOptions}
                       </select>
                       <input type="number" class="swal2-input split-amt" placeholder="€" step="0.01" style="width:35%; margin:0; padding:0 10px; font-size:14px; text-align:center;">
                   `;
                   splitRowsCont.appendChild(row);
               });
           },
           
           // VALIDATION & DATA CONSTRUCTION
           preConfirm: () => {
               const note = document.getElementById('swal-note').value;
               const cat = document.getElementById('swal-cat').value;
               const day = document.getElementById('swal-day').value;
               const start = document.getElementById('swal-start').value;
               const end = document.getElementById('swal-end').value;
               const isSplit = document.getElementById('swal-split-check').checked;

               if (!note || !cat) {
                   Swal.showValidationMessage('Inserisci Nome e Categoria!');
                   return false;
               }

               let finalAmt = 0;
               let bankCol = null;
               let splitDetails = "";

               if (isSplit) {
                   // Build the split string (e.g., "5:270|7:180") behind the scenes
                   const rows = document.querySelectorAll('.split-row');
                   let splitsArray = [];
                   
                   rows.forEach(row => {
                       const b = row.querySelector('.split-bank').value;
                       const a = row.querySelector('.split-amt').value;
                       if (b && a) {
                           splitsArray.push(`${b}:${parseFloat(a).toFixed(2)}`);
                           finalAmt += parseFloat(a);
                       }
                   });
                   
                   if (splitsArray.length < 2) {
                       Swal.showValidationMessage('Per uno split servono almeno 2 conti con importi validi!');
                       return false;
                   }
                   splitDetails = splitsArray.join('|');
               } else {
                   finalAmt = parseFloat(document.getElementById('swal-amt').value);
                   bankCol = document.getElementById('swal-col').value;
                   if (!finalAmt || !bankCol) {
                       Swal.showValidationMessage('Inserisci Importo e Banca!');
                       return false;
                   }
               }

               // Return formatted object for the backend
               return { 
                   note: note, 
                   amt: finalAmt, 
                   cat: cat, 
                   bankCol: bankCol ? parseInt(bankCol) : "", 
                   payDay: day ? parseInt(day) : "",
                   startDate: start || "", // Send string date or empty
                   endDate: end || "",     // Send string date or empty
                   isSplit: isSplit,
                   splitDetails: splitDetails
               };
           }
       }).then((result) => {
           if (result.isConfirmed) {
               Swal.fire({ title: 'Salvataggio...', didOpen: () => { Swal.showLoading() }, background: isDark ? '#1c1c1e' : '#fff' });
               
               google.script.run.withSuccessHandler(res => {
                   Swal.fire({ icon: 'success', title: 'Salvato!', showConfirmButton: false, timer: 1500, background: isDark ? '#1c1c1e' : '#fff' });
                   if (typeof fetchAppConfigInit === 'function') fetchAppConfigInit(); 
               }).withFailureHandler(err => {
                   Swal.fire({ icon: 'error', title: 'Errore', text: err.message, background: isDark ? '#1c1c1e' : '#fff' });
               }).addFixedExpenseToSheet(result.value);
           }
       });
   }

   // --- ELIMINA SPESA FISSA ---
   function deleteFixedExpenseUI() {
       closeAllSheets();
       const isDark = document.body.classList.contains('dark-mode');

       if (!GLOBAL_APP_CONFIG || !GLOBAL_APP_CONFIG.fixedExpenses || GLOBAL_APP_CONFIG.fixedExpenses.length === 0) {
           Swal.fire({ icon: 'info', title: 'Nessuna spesa', text: 'Non ci sono spese fisse da eliminare.', background: isDark ? '#1c1c1e' : '#fff', color: isDark ? '#fff' : '#000' });
           return;
       }

       // Crea dinamicamente le opzioni
       let optionsHtml = '<option value="">-- Seleziona spesa da eliminare --</option>';
       GLOBAL_APP_CONFIG.fixedExpenses.forEach(sub => {
           let displayAmt = sub.isSplit ? "Split" : `€ ${sub.amt.toFixed(2)}`;
           optionsHtml += `<option value="${sub.id}">${sub.note} (${displayAmt})</option>`;
       });

       Swal.fire({
           title: 'Elimina Spesa Fissa',
           html: `<select id="swal-del-expense" class="swal2-input" style="width: 80%;">${optionsHtml}</select>`,
           showCancelButton: true,
           confirmButtonText: 'Elimina',
           confirmButtonColor: '#ff3b30',
           cancelButtonText: 'Annulla',
           background: isDark ? '#1c1c1e' : '#fff',
           color: isDark ? '#fff' : '#000',
           preConfirm: () => {
               const val = document.getElementById('swal-del-expense').value;
               if (!val) {
                   Swal.showValidationMessage('Devi selezionare una spesa!');
                   return false;
               }
               return val;
           }
       }).then((result) => {
           if (result.isConfirmed) {
               Swal.fire({ title: 'Eliminazione...', didOpen: () => { Swal.showLoading() }, background: isDark ? '#1c1c1e' : '#fff' });
               
               google.script.run.withSuccessHandler(res => {
                   Swal.fire({ icon: 'success', title: 'Eliminata!', text: res, showConfirmButton: false, timer: 1500, background: isDark ? '#1c1c1e' : '#fff' });
                   if (typeof fetchAppConfigInit === 'function') fetchAppConfigInit(); // Ricarica i dati
               }).withFailureHandler(err => {
                   Swal.fire({ icon: 'error', title: 'Errore', text: err.message, background: isDark ? '#1c1c1e' : '#fff' });
               }).deleteFixedExpenseFromSheet(result.value);
           }
       });
   }

   // --- ELIMINA CATEGORIA ---
   function deleteCategoryUI() {
       closeAllSheets();
       const isDark = document.body.classList.contains('dark-mode');

       if (!GLOBAL_APP_CONFIG || !GLOBAL_APP_CONFIG.categories) {
           Swal.fire({ icon: 'error', title: 'Errore', text: 'Categorie non caricate.', background: isDark ? '#1c1c1e' : '#fff', color: isDark ? '#fff' : '#000' });
           return;
       }

       // Crea i gruppi di categorie (Expense, Income, etc.) per il menu a tendina
       let optionsHtml = '<option value="">-- Seleziona categoria da eliminare --</option>';
       const types = ['Expense', 'Income', 'Investment', 'Transfer'];
       types.forEach(t => {
           if (GLOBAL_APP_CONFIG.categories[t] && GLOBAL_APP_CONFIG.categories[t].length > 0) {
               optionsHtml += `<optgroup label="--- ${t} ---">`;
               GLOBAL_APP_CONFIG.categories[t].forEach(c => {
                   optionsHtml += `<option value="${t}|${c}">${c}</option>`; // Salvo tipo e nome assieme
               });
               optionsHtml += `</optgroup>`;
           }
       });

       Swal.fire({
           title: 'Elimina Categoria',
           html: `<select id="swal-del-cat" class="swal2-input" style="width: 80%;">${optionsHtml}</select>`,
           showCancelButton: true,
           confirmButtonText: 'Elimina',
           confirmButtonColor: '#ff3b30',
           cancelButtonText: 'Annulla',
           background: isDark ? '#1c1c1e' : '#fff',
           color: isDark ? '#fff' : '#000',
           preConfirm: () => {
               const val = document.getElementById('swal-del-cat').value;
               if (!val) {
                   Swal.showValidationMessage('Devi selezionare una categoria!');
                   return false;
               }
               const [type, name] = val.split('|'); // Divido il tipo dal nome
               return { type, name };
           }
       }).then((result) => {
           if (result.isConfirmed) {
               Swal.fire({ title: 'Eliminazione...', didOpen: () => { Swal.showLoading() }, background: isDark ? '#1c1c1e' : '#fff' });
               
               google.script.run.withSuccessHandler(res => {
                   Swal.fire({ icon: 'success', title: 'Eliminata!', text: res, showConfirmButton: false, timer: 1500, background: isDark ? '#1c1c1e' : '#fff' });
                   if (typeof fetchAppConfigInit === 'function') fetchAppConfigInit(); // Ricarica i dati
               }).withFailureHandler(err => {
                   Swal.fire({ icon: 'error', title: 'Errore', text: err.message, background: isDark ? '#1c1c1e' : '#fff' });
               }).deleteCategoryFromSheet(result.value.type, result.value.name);
           }
       });
   }
</script>
