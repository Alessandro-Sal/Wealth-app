   /** * Promise Wrapper for Google Script Run.
    * Converts the standard callback-based google.script.run into a modern Promise-based structure.
    * 
    */
   const run = (fnName, ...args) => {
     return new Promise((resolve, reject) => {
       google.script.run
         .withSuccessHandler(resolve)
         .withFailureHandler(error => {
           console.error(`Server Error [${fnName}]:`, error);
           reject(error);
         })
         [fnName](...args);
     });
   };

   let tickersData = [];
   let loadedCharts = [];

   let assetChart = null; // Chart instance variable for Assets
   let analyticsChartInstance = null; // Chart instance for Market Analytics

   let mapInstance = null;
   let mapMarkers = [];

   let incomeStackInstance = null;

   // --- Immediate Execution Functions ---

   /**

    */

   // --- UI Utilities (Skeleton, Themes, Privacy) ---
   
   /**
    * Renders a loading skeleton effect in a container.
    * 
    */
   function showSkeleton(containerId, count = 3, height = '40px', isCard = false) {
     const cont = document.getElementById(containerId);
     if (!cont) return;
     let html = '';
     let className = isCard ? 'skeleton skeleton-card' : 'skeleton';
     for(let i=0; i<count; i++) {
       html += `<div class="${className}" style="height:${height}"></div>`;
     }
     cont.innerHTML = html;
   }
   
   /**
    * Toggles Dark/Light mode and updates meta tags.
    */
   function toggleTheme() {
     document.body.classList.toggle('dark-mode');
     const isDark = document.body.classList.contains('dark-mode');
     document.querySelectorAll('.theme-toggler').forEach(b => b.innerText = isDark ? '☀️' : '🌙');
     localStorage.setItem('theme', isDark ? 'dark' : 'light');
     const metaThemeColor = document.getElementById('theme-color-meta');
     if (metaThemeColor) {
       metaThemeColor.setAttribute('content', isDark ? '#121212' : '#f2f2f7');
     }
   }
   
   /**
    * Toggles Privacy Mode (Blurring sensitive data).
    * 
    */
   function togglePrivacy() {
     const isHidden = document.body.classList.contains('privacy-mode');
     if (isHidden) {
       // CASE 1: USER WANTS TO VIEW DATA (Open Pin Pad)
       const lock = document.getElementById('lock-screen');
       lock.style.display = 'flex';
       setTimeout(() => lock.style.opacity = '1', 10);
     } else {
       // CASE 2: USER WANTS TO HIDE DATA (Lock Everything)
       document.body.classList.add('privacy-mode');
       updateAllCharts();
       localStorage.removeItem('auth_expiry');
       // 🔥 NEW: LOCK GEMINI AI AS WELL
       geminiSessionPin = ""; 
       updateGeminiLockIcon(false); 
       console.log("Sync Lock: Privacy Active -> AI Locked");
     }
   }
   
   // --- Input Helpers (+/- toggle and commas) ---
   
   /**
    * Attaches validation listeners to inputs.
    * Handles comma-to-dot conversion and input type adjustments.
    * 
    */
   function setupInputValidation() {
     const inputs = document.querySelectorAll('input[type="number"], input.bank-in, #penAmount, #invCostEur, #invCostUsd, #invQty');
     inputs.forEach(el => {
       el.type = 'text';
       el.inputMode = 'decimal';
       const newEl = el.cloneNode(true);
       el.parentNode.replaceChild(newEl, el);
       
       // Auto-replace comma with dot for calculation safety
       newEl.addEventListener('input', function(e) {
           let val = this.value;
           if (val.includes(',')) {
               let cursorPosition = this.selectionStart;
               this.value = val.replace(/,/g, '.');
               this.setSelectionRange(cursorPosition, cursorPosition);
           }
       });
       
       // Sync UI color based on positive/negative value
       newEl.addEventListener('input', function() {
            if(typeof syncIconColor === 'function') syncIconColor(this);
       });
     });
   }
   
   /**
    * Toggles the sign (+/-) icon next to an input field.
    * L'input rimane un valore assoluto, il segno effettivo lo decide il bottone!
    */
   function toggleSignIcon(icon) {
     const wrapper = icon.parentElement;
     const input = wrapper.querySelector('input');
     const isPlus = icon.classList.contains('sign-plus');
     
     if (isPlus) {
       icon.classList.remove('sign-plus');
       icon.classList.add('sign-minus');
       icon.innerHTML = '&#8722;'; // Segno meno pulito
       input.style.color = 'var(--danger)';
     } else {
       icon.classList.remove('sign-minus');
       icon.classList.add('sign-plus');
       icon.innerText = '+';
       input.style.color = 'var(--stocks-bg)';
     }
     if(navigator.vibrate) navigator.vibrate(20);
   }
   
   /**
    * Sincronizza il colore dell'input col bottone e intercetta i meno digitati a mano.
    */
   function syncIconColor(input) {
     const wrapper = input.parentElement;
     const icon = wrapper.querySelector('.sign-toggle');
     
     // Se l'utente digita esplicitamente un "-", lo assorbiamo nel bottone e puliamo il testo
     if (input.value.includes('-')) {
         input.value = input.value.replace(/-/g, '');
         if (icon.classList.contains('sign-plus')) {
             toggleSignIcon(icon); // Gira il bottone su meno
         }
     }
     
     // Il colore segue sempre lo stato visivo del bottone
     if (icon.classList.contains('sign-minus')) {
         input.style.color = 'var(--danger)';
     } else {
         input.style.color = 'var(--stocks-bg)';
     }
     
     // --- NUOVA RIGA PER LO SPLIT ---
     // Ricalcola lo split in tempo reale quando si digitano importi nelle banche
     if(document.getElementById('splitToggle') && document.getElementById('splitToggle').checked) {
         if (typeof updateSplitMath === 'function') updateSplitMath('friends');
     }
   }
   /**
    * Switches the active sub-tab inside the Recap (Dashboard) page.
    * Forces a resize event to ensure Chart.js canvases render correctly 
    * when their container goes from display:none to display:block.
    * @param {string} tabId - The ID suffix of the tab to show (overview, cashflow, planning).
    * @param {HTMLElement} btnElement - The button element that was clicked.
    */
   function switchRecapTab(tabId, btnElement) {
       // 1. Remove active state from all buttons inside Recap
       const recapNav = document.querySelector('#p-recap .market-sub-nav');
       if (recapNav) {
           const buttons = recapNav.querySelectorAll('.m-sub-btn');
           buttons.forEach(btn => btn.classList.remove('active'));
       }
       
       // 2. Add active state to the clicked button
       if (btnElement) {
           btnElement.classList.add('active');
       }
       
       // 3. Hide all tab contents inside Recap
       const recapWrapper = document.querySelector('#p-recap .pc-wrapper');
       if (recapWrapper) {
           const tabs = recapWrapper.querySelectorAll('.m-tab-content');
           tabs.forEach(tab => {
               tab.classList.remove('active');
           });
       }
       
       // 4. Show the target tab
       const targetTab = document.getElementById('rtab-' + tabId);
       if (targetTab) {
           targetTab.classList.add('active');
           
           // 5. CRITICAL FIX FOR CHART.JS
           // Dispatching a resize event forces Chart.js to recalculate its bounds
           // because canvases size down to 0 when their container is display:none
           setTimeout(() => {
               window.dispatchEvent(new Event('resize'));
           }, 10);
       }
   }

  // Toggle menu without needing specific IDs
function toggleMasterMenu(buttonElement) {
  // Find the dropdown that is immediately after the clicked button
  const currentMenu = buttonElement.nextElementSibling;
  
  // Close all other open dropdowns
  const allDropdowns = document.querySelectorAll('.kebab-dropdown-content');
  allDropdowns.forEach(dropdown => {
    if (dropdown !== currentMenu && dropdown.classList.contains('show-kebab')) {
      dropdown.classList.remove('show-kebab');
    }
  });
  
  // Toggle the current one
  currentMenu.classList.toggle('show-kebab');
}

// Close when clicking outside
window.addEventListener('click', function(event) {
  if (!event.target.closest('.kebab-trigger')) {
    const allDropdowns = document.querySelectorAll('.kebab-dropdown-content');
    allDropdowns.forEach(dropdown => {
      dropdown.classList.remove('show-kebab');
    });
  }
});

}
