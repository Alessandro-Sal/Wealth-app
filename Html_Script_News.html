<script>
let currentNewsCategory = 'market';
let allFetchedNews = [];      
let filteredNews = [];        
let lastFetchedTickers = [];  
let displayedNewsCount = 0;   
const CHUNK_SIZE = 15;        

/**
 * Utility: Converte il Markdown generato dall'AI in HTML pulito
 */
function cleanAIMarkdown(text) {
  if (!text) return "";
  let cleaned = text.replace(/\*\*(.*?)\*\*/g, '<strong style="color: var(--text-main);">$1</strong>'); // Grassetto
  cleaned = cleaned.replace(/\n/g, '<br>'); // A capo
  cleaned = cleaned.replace(/(<br>|^)\s*\*\s/g, '$1• '); // Liste puntate
  return cleaned;
}

/**
 * Handles clicks on category buttons, updates UI, and fetches new data.
 */
function setNewsCategory(category, buttonElement) {
  const buttons = document.querySelectorAll('.news-cat-btn');
  buttons.forEach(btn => btn.classList.remove('active'));
  buttonElement.classList.add('active');
  
  const searchInput = document.getElementById('newsSearchInput');
  if (searchInput) searchInput.value = '';
  
  currentNewsCategory = category;
  loadNews(currentNewsCategory);
}

/**
 * Triggers the backend function to fetch news data, or loads from local storage.
 * Includes Soft Reload and Skeleton UI for premium loading experience.
 */
function loadNews(category = 'market') {
  const container = document.getElementById('news-container');
  if (!container) return; 
  
  if (category === 'saved') {
    const savedArticles = JSON.parse(localStorage.getItem('saved_news') || '[]');
    container.style.opacity = '1';
    container.style.pointerEvents = 'auto';
    renderNews({ articles: savedArticles, tickers: [] });
    return;
  }
  
  // --- SOFT RELOAD & SKELETON LOGIC ---
  if (container.innerHTML.trim() !== "" && !container.innerHTML.includes("skeleton-card")) {
      container.style.opacity = '0.5'; 
      container.style.transition = 'opacity 0.3s ease';
      container.style.pointerEvents = 'none'; 
  } else {
      // First time loading: inject 4 Skeleton Cards
      let skeletonHtml = '';
      for(let i=0; i<4; i++) {
          skeletonHtml += `
          <div class="skeleton-card">
              <div class="skeleton-element skel-badge"></div>
              <div class="skeleton-element skel-title"></div>
              <div class="skeleton-element skel-title-short"></div>
              <div class="skeleton-element skel-text"></div>
              <div class="skeleton-element skel-text-short"></div>
              <div class="skeleton-element skel-footer"></div>
          </div>`;
      }
      container.innerHTML = skeletonHtml;
  }

  // Fetch data
  google.script.run
    .withSuccessHandler(function(response) {
        container.style.opacity = '1';
        container.style.pointerEvents = 'auto';
        renderNews(response);
    })
    .withFailureHandler(function(error) {
        console.error("Failed to load news: ", error);
        container.style.opacity = '1';
        container.style.pointerEvents = 'auto';
        container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--danger); grid-column: 1 / -1;">Could not load news at this time. Please try again later.</div>';
    })
    .getMarketNews(category);
}

/**
 * Receives data from server, resets states, and applies filters to start rendering.
 */
function renderNews(response) {
  allFetchedNews = response.articles || [];
  lastFetchedTickers = response.tickers || [];
  
  filterNewsItems();
}

/**
 * Filters the news globally based on search and prepares the DOM container.
 */
function filterNewsItems() {
  const searchInput = document.getElementById('newsSearchInput');
  const filterText = searchInput ? searchInput.value.toLowerCase() : '';
  
  if (!filterText) {
    filteredNews = [...allFetchedNews];
  } else {
    filteredNews = allFetchedNews.filter(item => {
      const textToSearch = (item.title + " " + item.summary + " " + item.source + " " + (item.relatedTickers ? item.relatedTickers.join(' ') : '')).toLowerCase();
      return textToSearch.includes(filterText);
    });
  }
  
  displayedNewsCount = 0; 
  
  const container = document.getElementById('news-container');
  if (!container) return;
  
  container.innerHTML = ''; 
  
  if (currentNewsCategory === 'portfolio' && lastFetchedTickers.length > 0) {
    const tickerBanner = document.createElement('div');
    tickerBanner.style.gridColumn = '1 / -1';
    tickerBanner.style.background = 'rgba(52, 199, 89, 0.1)';
    tickerBanner.style.border = '1px solid rgba(52, 199, 89, 0.2)';
    tickerBanner.style.borderRadius = '12px';
    tickerBanner.style.padding = '12px 15px';
    tickerBanner.style.fontSize = '12px';
    tickerBanner.style.color = 'var(--text-main)';
    tickerBanner.style.marginBottom = '10px';
    tickerBanner.innerHTML = `<span style="font-weight:800; color:#34c759; text-transform:uppercase; font-size:10px; display:block; margin-bottom:4px;">🎯 Tracking your assets</span> <b>${lastFetchedTickers.join(', ')}</b>`;
    container.appendChild(tickerBanner);
  }

  if (filteredNews.length === 0) {
    let emptyMsg = filterText ? 'No articles match your search.' : 'No articles available right now.';
    if (currentNewsCategory === 'saved' && !filterText) emptyMsg = "You haven't saved any articles yet.<br><br>Tap the 🔖 icon on any news to read it later.";
    
    container.innerHTML += `<div id="news-no-results" style="text-align:center; padding:50px 20px; color:var(--gray); grid-column: 1 / -1; font-weight:600; line-height: 1.5;">${emptyMsg}</div>`;
    return;
  }

  renderNextChunk();
}

/**
 * Renders a specific chunk of articles (Pagination)
 */
function renderNextChunk() {
  const container = document.getElementById('news-container');
  if (!container) return;

  const existingBtn = document.getElementById('load-more-btn');
  if (existingBtn) existingBtn.remove();

  const chunk = filteredNews.slice(displayedNewsCount, displayedNewsCount + CHUNK_SIZE);
  const savedNews = JSON.parse(localStorage.getItem('saved_news') || '[]');

  chunk.forEach((item, chunkIndex) => {
    const absoluteIndex = displayedNewsCount + chunkIndex;
    
    const dateObj = new Date(item.date);
    const formattedDate = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    
    const readTime = Math.max(2, Math.floor(item.title.length / 20) % 5 + 1);
    
    let badgeColor = 'rgba(0, 122, 255, 0.1)';
    let badgeText = '#007aff';
    if (item.category === 'portfolio') { badgeColor = 'rgba(52, 199, 89, 0.1)'; badgeText = '#34c759'; }
    else if (item.category === 'world') { badgeColor = 'rgba(88, 86, 214, 0.1)'; badgeText = '#5856d6'; }
    else if (item.category === 'politics') { badgeColor = 'rgba(255, 59, 48, 0.1)'; badgeText = '#ff3b30'; }
    else if (item.category === 'science' || item.category === 'tech') { badgeColor = 'rgba(255, 149, 0, 0.1)'; badgeText = '#ff9500'; }

    let tickersHtml = '';
    if (item.relatedTickers && item.relatedTickers.length > 0) {
        tickersHtml = '<div class="ticker-pill-container">';
        item.relatedTickers.forEach(t => { tickersHtml += `<span class="ticker-pill">📈 ${t}</span>`; });
        tickersHtml += '</div>';
    }
    
    const isSaved = savedNews.some(savedItem => savedItem.link === item.link);
    const bookmarkClass = isSaved ? 'bookmark-btn bookmarked' : 'bookmark-btn';

    const newsCard = document.createElement('a');
    newsCard.href = item.link;
    newsCard.target = '_blank';
    newsCard.rel = 'noopener noreferrer';
    newsCard.className = 'news-card';
    
    newsCard.innerHTML = `
      <div class="news-card-actions">
         <div class="ai-btn" onclick="summarizeArticle(${absoluteIndex}, event, this)" title="AI Insight">✨</div>
         <div class="share-btn" onclick="shareArticle('${item.link}', '${item.title.replace(/'/g, "\\'")}', event)" title="Share">📤</div>
         <div class="${bookmarkClass}" onclick="toggleBookmark(${absoluteIndex}, event)" title="Save">🔖</div>
      </div>
      <div>
        <div class="news-card-header" style="padding-right: 125px; flex-wrap: wrap; gap: 5px;">
          <span class="news-badge" style="background:${badgeColor}; color:${badgeText};">${item.category}</span>
          <span class="news-read-time" style="white-space: nowrap;">⏱️ ${readTime} min</span>
        </div>
        <h3 class="news-title">${item.title}</h3>
        ${item.summary ? `<p class="news-summary">${item.summary}</p>` : ''}
        ${tickersHtml}
        <div id="ai-summary-box-${absoluteIndex}" class="ai-article-summary"></div>
      </div>
      <div class="news-footer">
        <div class="news-source-icon">🗞️</div>
        <span>${item.source} • ${formattedDate}</span>
      </div>
    `;
    
    container.appendChild(newsCard);
  });

  displayedNewsCount += chunk.length;

  if (displayedNewsCount < filteredNews.length) {
    const loadMoreBtn = document.createElement('button');
    loadMoreBtn.id = 'load-more-btn';
    loadMoreBtn.className = 'load-more-btn';
    loadMoreBtn.innerText = 'Load Older News ⬇️';
    loadMoreBtn.onclick = renderNextChunk;
    container.appendChild(loadMoreBtn);
  }
}

/**
 * Toggles the saved status of an article in localStorage.
 */
function toggleBookmark(absoluteIndex, event) {
  event.preventDefault(); 
  event.stopPropagation(); 
  
  const article = filteredNews[absoluteIndex];
  if (!article) return;
  
  let savedNews = JSON.parse(localStorage.getItem('saved_news') || '[]');
  const existingIndex = savedNews.findIndex(item => item.link === article.link);
  const btnEl = event.currentTarget;
  
  if (existingIndex > -1) {
    savedNews.splice(existingIndex, 1);
    btnEl.classList.remove('bookmarked');
  } else {
    savedNews.push(article);
    btnEl.classList.add('bookmarked');
    if (navigator.vibrate) navigator.vibrate(15);
  }
  
  localStorage.setItem('saved_news', JSON.stringify(savedNews));
  if (currentNewsCategory === 'saved') loadNews('saved');
}

/**
 * Triggers native mobile share sheet or copies to clipboard.
 */
function shareArticle(url, title, event) {
  event.preventDefault();
  event.stopPropagation();
  
  if (navigator.share) {
    navigator.share({
      title: title,
      url: url
    }).catch(console.error);
  } else {
    navigator.clipboard.writeText(url);
    const btn = event.currentTarget;
    const oldHtml = btn.innerHTML;
    btn.innerHTML = '✅';
    setTimeout(() => btn.innerHTML = oldHtml, 2000);
  }
}

/**
 * Calls backend AI function to summarize current category news.
 */
function requestAIBriefing() {
  const container = document.getElementById('news-container');
  if (!container || allFetchedNews.length === 0) {
      alert("Please wait for news to load before asking AI.");
      return;
  }
  
  let aiCard = document.getElementById('ai-briefing-box');
  if (!aiCard) {
      aiCard = document.createElement('div');
      aiCard.id = 'ai-briefing-box';
      aiCard.className = 'ai-briefing-card';
      container.insertBefore(aiCard, container.firstChild);
  }
  
  aiCard.innerHTML = `
      <div class="ai-briefing-header">✨ AI Morning Briefing</div>
      <div class="ai-briefing-content" style="color:var(--gray);"><span class="loader" style="display:inline-block; border-width:2px; width:12px; height:12px; margin-right:5px;"></span> AI is analyzing the markets...</div>
  `;
  
  google.script.run
      .withSuccessHandler(function(summary) {
          const aiContent = cleanAIMarkdown(summary);
          aiCard.innerHTML = `
              <div class="ai-briefing-header">✨ AI Morning Briefing</div>
              <div class="ai-briefing-content">${aiContent}</div>
          `;
      })
      .withFailureHandler(function(err) {
          aiCard.innerHTML = `
              <div class="ai-briefing-header">✨ AI Morning Briefing</div>
              <div class="ai-briefing-content" style="color:var(--danger);">⚠️ Could not generate summary.</div>
          `;
      })
      .getNewsAIBriefing(allFetchedNews);
}

/**
 * Calls backend AI to analyze a single article and expands the card to show it.
 */
function summarizeArticle(absoluteIndex, event, btnElement) {
  event.preventDefault(); 
  event.stopPropagation(); 
  
  const article = filteredNews[absoluteIndex];
  if (!article) return;
  
  const summaryBox = document.getElementById(`ai-summary-box-${absoluteIndex}`);
  if (!summaryBox) return;
  
  if (summaryBox.innerHTML !== '') {
    summaryBox.style.display = summaryBox.style.display === 'none' ? 'block' : 'none';
    return;
  }
  
  summaryBox.style.display = 'block';
  summaryBox.innerHTML = '<span class="loader" style="width:10px; height:10px; border-width:2px; display:inline-block; margin-right:5px;"></span> <i>Analisi AI in corso...</i>';
  
  google.script.run
    .withSuccessHandler(function(response) {
      const formattedResponse = cleanAIMarkdown(response);
      summaryBox.innerHTML = `<strong>✨ AI Insight:</strong><br>${formattedResponse}`;
    })
    .withFailureHandler(function(err) {
      summaryBox.innerHTML = '<span style="color:var(--danger)">⚠️ Errore di connessione. Riprova.</span>';
    })
    .getSingleArticleAISummary(article.title, article.summary);
}

setTimeout(function() {
  const container = document.getElementById('news-container');
  if (container && container.innerHTML.includes('Loading insights')) {
    loadNews('market');
  }
}, 500);
</script>
