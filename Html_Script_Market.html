                 if (termActiveFilter === 'loss' && parseForSort(item.unrealizedEur) >= 0) return false;
                 if (termAdvFilterValue) {
                     let parts = termAdvFilterValue.split('||');
                     if (parts[0] === 'sector' && item.sector !== parts[1]) return false;
                     if (parts[0] === 'industry' && item.ind !== parts[1]) return false;
                     if (parts[0] === 'country' && item.ctry !== parts[1]) return false;
                 }
                 return true; 
             });
   
             if (portfolioViewMode === 'cards') {
                 let sorted = typeof sortTickerData === 'function' ? sortTickerData(filteredList) : filteredList;
                 c.className = "live-scroll";
                 c.innerHTML = sorted.map((item) => createTickerCard(item, type)).join('');
             } else {
                 let thead = `<tr>${th('TICKER', 't')}`;
                 
                 if (termSubView === 'overview') {
                     thead += `
                       ${th('QTY', 'qty')} ${th('AVG P', 'avgPrice')}
                       ${th('MKT P', 'price', true)} ${th('24H %', 'pct')} ${th('24H €', 'dCh')} ${th('VALUE', 'val')}
                       ${th('UNREAL €', 'unrealizedEur', true)} ${th('UNREAL %', 'unrealizedPct')}
                       ${th('REAL €', 'realizedEur', true)} ${th('REAL %', 'realizedPct')}
                       ${th('TOT BAL', 'balEur', true)} ${th('TOT BAL %', 'balPct')}
                       ${th('DIVS', 'div', true)} ${th('EXP DIV', 'expectedDividend')} ${th('YOC', 'yoc')}
                       ${th('XIRR UNREAL', 'xirrUnrealized', true)} ${th('XIRR REAL', 'xirrRealized')} ${th('TWR', 'twr')}
                     `;
                 } else if (termSubView === 'fundamentals') {
                     thead += `
                       ${th('NAME', 'name', true)} ${th('SECTOR', 'sector')} ${th('INDUSTRY', 'ind')} ${th('COUNTRY', 'ctry')} ${th('CURR', 'curr')}
                       ${th('P/E', 'pe', true)} ${th('EPS', 'eps')} ${th('MKT CAP', 'mkt')} ${th('BETA', 'beta')}
                       <th colspan="2" class="term-group-divider" style="text-align:center;">52W RANGE</th>
                       ${th('VOLUME', 'vol')} ${th('AVG VOL', 'avgVol')}
                     `;
                 } else if (termSubView === 'trading') {
                     thead += `
                       ${th('BRK EVEN', 'bep', true)} ${th('DELTA', 'delta')} ${th('WIN RT', 'winRate')} ${th('PRF FCT', 'profitFactor')} ${th('DRAWDOWN', 'drawdown')}
                       ${th('FIRST BUY', 'firstBuyDate', true)} ${th('DAYS HELD', 'daysHeld')} ${th('TRADES', 'tradeCount')}
                       ${th('MIN BUY', 'minBuy', true)} ${th('MAX BUY', 'maxBuy')} ${th('MAX SELL', 'maxSell')} ${th('AVG SELL', 'avgSell')}
                     `;
                 }
                 thead += `</tr>`;
   
                 let sorted = [...filteredList].sort((a, b) => {
                     let valA = parseForSort(a[termSortCol]);
                     let valB = parseForSort(b[termSortCol]);
                     if (typeof valA === 'string' && typeof valB === 'string') return termSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                     return termSortAsc ? (valA - valB) : (valB - valA);
                 });
   
                 let finalHtml = `<table class="terminal-table"><thead>${thead}</thead><tbody>`;
   
                 if (sorted.length === 0) {
                     finalHtml += '<tr><td colspan="25" style="text-align:center; padding:20px;">No assets match your filters 🔍</td></tr>';
                 } else {
                     
                     // --- TOTALS & WEIGHTED AVERAGES CALCULATION ---
                     const calcTotals = (listData) => {
                         let t = { 
                             val: 0, unreal: 0, real: 0, bal: 0, div: 0, expDiv: 0, dch: 0,
                             wPe: 0, wEps: 0, wBeta: 0, wMkt: 0,
                             wWinRate: 0, wProfitFactor: 0, wDrawdown: 0,
                             valFund: 0, valTrad: 0,
                             
                             // For direct weighted averages of percentages
                             wPctDch: 0, wPctUnreal: 0, wPctReal: 0, wPctBal: 0, wYoc: 0,
                             baseDch: 0, baseUnreal: 0, baseReal: 0, baseBal: 0, baseYoc: 0
                         };
   
                         listData.forEach(item => {
                             let v = parseForSort(item.val); if (v === -Infinity || isNaN(v)) v = 0;
                             t.val += v;
                             
                             let u = parseForSort(item.unrealizedEur); if (u !== -Infinity && !isNaN(u)) t.unreal += u;
                             let r = parseForSort(item.realizedEur); if (r !== -Infinity && !isNaN(r)) t.real += r;
                             let b = parseForSort(item.balEur); if (b !== -Infinity && !isNaN(b)) t.bal += b;
                             let d = parseForSort(item.div); if (d !== -Infinity && !isNaN(d)) t.div += d;
                             let ed = parseForSort(item.expectedDividend); if (ed !== -Infinity && !isNaN(ed)) t.expDiv += ed;
                             let dch = parseForSort(item.dCh); if (dch !== -Infinity && !isNaN(dch)) t.dch += dch;
   
                             // PERCENTAGES (Weighted Averages logic for accurate rendering)
                             let pDch = parseForSort(item.pct); 
                             if (pDch !== -Infinity && !isNaN(pDch)) { t.wPctDch += pDch * v; t.baseDch += v; }
   
                             let pUnreal = parseForSort(item.unrealizedPct); 
                             let costBasis = (u !== -Infinity && !isNaN(u)) ? (v - u) : v; // Approximates cost basis
                             if (costBasis <= 0) costBasis = v; 
                             if (pUnreal !== -Infinity && !isNaN(pUnreal)) { t.wPctUnreal += pUnreal * costBasis; t.baseUnreal += costBasis; }
   
                             let pReal = parseForSort(item.realizedPct);
                             if (pReal !== -Infinity && !isNaN(pReal)) { t.wPctReal += pReal * costBasis; t.baseReal += costBasis; }
   
                             let pBal = parseForSort(item.balPct);
                             if (pBal !== -Infinity && !isNaN(pBal)) { t.wPctBal += pBal * costBasis; t.baseBal += costBasis; }
   
                             let pYoc = parseForSort(item.yoc);
                             if (pYoc !== -Infinity && !isNaN(pYoc)) { t.wYoc += pYoc * costBasis; t.baseYoc += costBasis; }
   
                             // Fundamentals (weighted by position value)
                             let pe = parseForSort(item.pe); if (pe !== -Infinity && !isNaN(pe) && v > 0) { t.wPe += pe * v; t.valFund += v; }
                             let eps = parseForSort(item.eps); if (eps !== -Infinity && !isNaN(eps) && v > 0) { t.wEps += eps * v; }
                             let beta = parseForSort(item.beta); if (beta !== -Infinity && !isNaN(beta) && v > 0) { t.wBeta += beta * v; }
                             
                             // Market Cap Custom Parse for Weighted Avg
                             let rawMkt = String(item.mkt || '').toUpperCase().replace(',', '.');
                             let mktMulti = 1;
                             if (rawMkt.includes('T')) mktMulti = 1e12;
                             else if (rawMkt.includes('B')) mktMulti = 1e9;
                             else if (rawMkt.includes('M')) mktMulti = 1e6;
                             let mktClean = parseFloat(rawMkt.replace(/[^\d.-]/g, ''));
                             if (!isNaN(mktClean) && v > 0) { t.wMkt += (mktClean * mktMulti) * v; }
   
                             // Trading Data (weighted by position value)
                             let wr = parseForSort(item.winRate); if (wr !== -Infinity && !isNaN(wr) && v > 0) { t.wWinRate += wr * v; t.valTrad += v; }
                             let pf = parseForSort(item.profitFactor); if (pf !== -Infinity && !isNaN(pf) && v > 0) { t.wProfitFactor += pf * v; }
                             let dd = parseForSort(item.drawdown); if (dd !== -Infinity && !isNaN(dd) && v > 0) { t.wDrawdown += dd * v; }
                         });
   
                         // Final Division for Weighted Averages
                         t.pctDch = t.baseDch > 0 ? t.wPctDch / t.baseDch : 0;
                         t.pctUnreal = t.baseUnreal > 0 ? t.wPctUnreal / t.baseUnreal : 0;
                         t.pctReal = t.baseReal > 0 ? t.wPctReal / t.baseReal : 0;
                         t.pctBal = t.baseBal > 0 ? t.wPctBal / t.baseBal : 0;
                         t.yoc = t.baseYoc > 0 ? t.wYoc / t.baseYoc : 0;
   
                         t.avgPe = t.valFund > 0 ? t.wPe / t.valFund : 0;
                         t.avgEps = t.valFund > 0 ? t.wEps / t.valFund : 0;
                         t.avgBeta = t.valFund > 0 ? t.wBeta / t.valFund : 0;
                         t.avgMkt = t.valFund > 0 ? t.wMkt / t.valFund : 0;
   
                         t.avgWinRate = t.valTrad > 0 ? t.wWinRate / t.valTrad : 0;
                         t.avgProfitFactor = t.valTrad > 0 ? t.wProfitFactor / t.valTrad : 0;
                         t.avgDrawdown = t.valTrad > 0 ? t.wDrawdown / t.valTrad : 0;
   
                         return t;
                     };
   
                     const fmtBig = (val) => { 
                         if (val === 0 || isNaN(val)) return "-"; 
                         if (val >= 1e12) return (val/1e12).toLocaleString('it-IT', {maximumFractionDigits: 2}) + "T"; 
                         if (val >= 1e9) return (val/1e9).toLocaleString('it-IT', {maximumFractionDigits: 2}) + "B"; 
                         if (val >= 1e6) return (val/1e6).toLocaleString('it-IT', {maximumFractionDigits: 2}) + "M"; 
                         return val.toLocaleString('it-IT', {maximumFractionDigits: 2}); 
                     };
   
                     // --- UI ROW GENERATOR FOR TOTALS ---
                     const createTotalRow = (totals, label, isMaster = false) => {
                         const fmt = (v) => (!isNaN(v) && v !== 0) ? Math.abs(v).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2}) : '0,00';
                         const fmtPct = (v) => (!isNaN(v) && v !== 0) ? Math.abs(v).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%' : '0,00%';
                         const sign = (v) => v > 0 ? '+' : (v < 0 ? '-' : '');
                         const fmtCol = (v) => v > 0 ? 'color:var(--stocks-bg);' : (v < 0 ? 'color:var(--danger);' : 'color:var(--text-main);');
                         
                         let bgStyle = isMaster ? 'background: rgba(0,122,255,0.08); border-top: 3px solid var(--primary);' : 'background: rgba(0,0,0,0.02); border-top: 2px dashed var(--row-border);';
   
                         if (termSubView === 'overview') {
                             return `
                                 <tr style="${bgStyle} font-weight: 800; font-size: 13px;">
                                     <td colspan="4" style="text-align:right;">${label}</td>
                                     <td style="${fmtCol(totals.pctDch)}">${sign(totals.pctDch)}${fmtPct(totals.pctDch)}</td>
                                     <td style="${fmtCol(totals.dch)}"><span class="sensitive">${sign(totals.dch)}${fmt(totals.dch)}</span></td>
                                     <td style="color:var(--text-main);"><span class="sensitive">${fmt(totals.val)}</span></td>
                                     <td class="term-group-divider" style="${fmtCol(totals.unreal)}"><span class="sensitive">${sign(totals.unreal)}${fmt(totals.unreal)}</span></td>
                                     <td style="${fmtCol(totals.pctUnreal)}">${sign(totals.pctUnreal)}${fmtPct(totals.pctUnreal)}</td>
                                     <td class="term-group-divider" style="${fmtCol(totals.real)}"><span class="sensitive">${sign(totals.real)}${fmt(totals.real)}</span></td>
                                     <td style="${fmtCol(totals.pctReal)}">${sign(totals.pctReal)}${fmtPct(totals.pctReal)}</td>
                                     <td class="term-group-divider" style="${fmtCol(totals.bal)}"><span class="sensitive">${sign(totals.bal)}${fmt(totals.bal)}</span></td>
                                     <td style="${fmtCol(totals.pctBal)}">${sign(totals.pctBal)}${fmtPct(totals.pctBal)}</td>
                                     <td class="term-group-divider" style="color:var(--primary);"><span class="sensitive">${fmt(totals.div)}</span></td>
                                     <td style="color:var(--primary);"><span class="sensitive">${fmt(totals.expDiv)}</span></td>
                                     <td style="color:var(--primary);">${fmtPct(totals.yoc)}</td>
                                     <td class="term-group-divider"></td>
                                     <td></td>
                                     <td></td>
                                 </tr>
                             `;
                         } else if (termSubView === 'fundamentals') {
                             return `
                                 <tr style="${bgStyle} font-weight: 800; font-size: 13px;">
                                     <td colspan="6" style="text-align:right;">${label} <span style="font-size:10px; color:var(--gray);">(Weighted)</span></td>
                                     <td class="term-group-divider">${fmt(totals.avgPe)}</td>
                                     <td>${fmt(totals.avgEps)}</td>
                                     <td>${fmtBig(totals.avgMkt)}</td>
                                     <td>${fmt(totals.avgBeta)}</td>
                                     <td colspan="4" class="term-group-divider"></td>
                                 </tr>
                             `;
                         } else if (termSubView === 'trading') {
                             return `
                                 <tr style="${bgStyle} font-weight: 800; font-size: 13px;">
                                     <td colspan="3" style="text-align:right;">${label} <span style="font-size:10px; color:var(--gray);">(Weighted)</span></td>
                                     <td class="term-group-divider" style="${totals.avgWinRate >= 50 ? 'color:var(--stocks-bg)' : 'color:var(--danger)'}">${fmtPct(totals.avgWinRate)}</td>
                                     <td style="${totals.avgProfitFactor >= 1 ? 'color:var(--stocks-bg)' : 'color:var(--danger)'}">${fmt(totals.avgProfitFactor)}</td>
                                     <td style="color:var(--danger);">${sign(totals.avgDrawdown)}${fmtPct(totals.avgDrawdown)}</td>
                                     <td colspan="7" class="term-group-divider"></td>
                                 </tr>
                             `;
                         }
                     };
   
                     let masterTot = calcTotals(filteredList);
   
                     if (termGroupByKey) {
                         let grouped = {};
                         sorted.forEach(item => {
                             let key = item[termGroupByKey];
                             if (!key || key === "#N/A") key = "Other / Unassigned";
                             if (!grouped[key]) grouped[key] = [];
                             grouped[key].push(item);
                         });
   
                         for (let groupName in grouped) {
                             let groupList = grouped[groupName];
                             let gTot = calcTotals(groupList);
                             
                             let pnlSign = gTot.unreal > 0 ? '+' : '';
                             let pnlColor = gTot.unreal > 0 ? 'color:var(--stocks-bg)' : (gTot.unreal < 0 ? 'color:var(--danger)' : '');
                             
                             finalHtml += `
                               <tr class="term-group-header"><td colspan="25" style="background:rgba(0,122,255,0.05); color:var(--primary); font-weight:800;">
                                   📂 ${groupName} <span style="font-size:11px; opacity:0.7;">(${groupList.length} assets)</span>
                                   <span class="term-subtotal sensitive" style="float:right;">P&L: <b style="${pnlColor}">${pnlSign}€ ${gTot.unreal.toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</b></span>
                                   <span class="term-subtotal sensitive" style="float:right; margin-right:15px; color:var(--text-main);">Val: <b>€ ${gTot.val.toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</b></span>
                               </td></tr>
                             `;
                             finalHtml += groupList.map((item) => createTerminalRow(item, type)).join('');
                             finalHtml += createTotalRow(gTot, `Subtotal ${groupName}`, false);
                         }
                     } else {
                         finalHtml += sorted.map((item) => createTerminalRow(item, type)).join('');
                     }
   
                     // Aggiunge la riga del totale complessivo in base ai filtri attivi
                     if (filteredList.length > 0) {
                         finalHtml += createTotalRow(masterTot, 'TOTAL (FILTERED)', true);
                     }
                 }
   
                 finalHtml += `</tbody></table>`;
                 c.className = "terminal-container";
                 c.innerHTML = finalHtml;
             }
         } else { 
             c.className = "live-scroll"; 
             c.innerHTML = '<div style="padding:10px; font-size:12px;">No data</div>'; 
         }
     };
   
     if (portfolioViewMode === 'heatmap') {
         renderPortfolioHeatmap(data);
         return;
     }
   
     renderCont('live-stocks', data.stocks, 'stocks');
     renderCont('live-etfs', data.etfs, 'etfs');
     renderCont('live-crypto', data.crypto, 'crypto');
   }
   // --- Custom Right-Click Menu Logic ---
   function showContextMenu(e, ticker, assetClass, price) {
       e.preventDefault(); // Prevent default browser menu
       
       const menu = document.getElementById('terminal-context-menu');
       if (!menu) return;
   
       // Apply dark mode styling if body has dark-mode
       if (document.body.classList.contains('dark-mode')) {
           menu.classList.add('dark-mode');
       } else {
           menu.classList.remove('dark-mode');
       }
   
       // Populate menu data
       document.getElementById('ctx-header').innerText = ticker + ' Actions';
       
       // Bind actions
       document.getElementById('ctx-trade').onclick = () => { hideContextMenu(); quickTrade(ticker, assetClass); };
       document.getElementById('ctx-alert').onclick = () => { hideContextMenu(); openSniperAlert(ticker, price); };
       const ctxNotesBtn = document.getElementById('ctx-notes');
       if (ctxNotesBtn) {
           ctxNotesBtn.innerHTML = hasTickerNote(ticker) ? '📝 Edit Note' : '➕ Add Note';
           ctxNotesBtn.onclick = (event) => { hideContextMenu(); openTickerNotes(ticker, event); };
       }
       document.getElementById('ctx-history').onclick = () => { hideContextMenu(); searchTickerHistory(ticker); };
       document.getElementById('ctx-news').onclick = () => { hideContextMenu(); window.open('https://www.google.com/search?q=' + encodeURIComponent(ticker + ' stock news'), '_blank'); };
       document.getElementById('ctx-chart').onclick = () => { hideContextMenu(); window.open('https://www.tradingview.com/chart/?symbol=' + encodeURIComponent(ticker), '_blank'); };
   
       // Position the menu
       menu.style.display = 'block';
       
       // Prevent menu from going off-screen
       let x = e.pageX;
       let y = e.pageY;
       if (x + menu.offsetWidth > window.innerWidth) x = window.innerWidth - menu.offsetWidth - 10;
       if (y + menu.offsetHeight > window.innerHeight) y = window.innerHeight - menu.offsetHeight - 10;
       
       menu.style.left = x + 'px';
       menu.style.top = y + 'px';
   }
   
   function hideContextMenu() {
       const menu = document.getElementById('terminal-context-menu');
       if (menu) menu.style.display = 'none';
   }
   
   // Close menu when clicking anywhere else
   document.addEventListener('click', hideContextMenu);
   
   // --- PORTFOLIO HEATMAP LOGIC ---
   // --- PORTFOLIO HEATMAP LOGIC ---
   function renderPortfolioHeatmap(data) {
       const container = document.getElementById('portfolio-heatmap-container');
       if(!container) return;
       container.innerHTML = '';
   
       // 1. Flatten ONLY stocks and etfs (Crypto removed to make blocks bigger)
       let allItems = [];
       ['stocks', 'etfs'].forEach(type => { // <-- Crypto RIMOSSO
           if(data[type]) {
               data[type].forEach(item => {
                   let val = parseForSort(item.val); // Usiamo il valore per dare il peso "fisico" al blocco
                   if(val > 0 && val !== -Infinity) {
                       allItems.push({ ...item, _type: type, numericVal: val });
                   }
               });
           }
       });
   
       // 2. Sort by size (value) descending
       allItems.sort((a, b) => b.numericVal - a.numericVal);
   
       let totalVal = allItems.reduce((sum, it) => sum + it.numericVal, 0);
       if(totalVal === 0) {
           container.innerHTML = '<div style="padding:40px; text-align:center; color:var(--gray);">No active investments for Heatmap</div>';
           return;
       }
   
       // 3. Squarify Algorithm (Slice and Dice)
       let rects = sliceAndDice(allItems, 0, 0, 100, 100, totalVal);
   
       // 4. Color Grading Logic
       const getColor = (pctStr) => {
           let val = parseFloat(String(pctStr).replace('%', '').replace(',', '.'));
           if(isNaN(val)) return '#8e8e93';
           if(val >= 2.5) return '#10893E'; // Deep Green
           if(val > 0) return '#34C759';    // Standard Green
           if(val <= -2.5) return '#C93429';// Deep Red
           if(val < 0) return '#FF3B30';    // Standard Red
           return '#8E8E93';                // Flat
       };
   
       // 5. Build the DOM Nodes
       rects.forEach(rect => {
           let div = document.createElement('div');
           div.className = 'heatmap-block';
           div.style.left = rect.x + '%';
           div.style.top = rect.y + '%';
           div.style.width = rect.w + '%';
           div.style.height = rect.h + '%';
           div.style.backgroundColor = getColor(rect.item.pct);
   
           // Percentage formatting
           let rawPct = String(rect.item.pct || "0%").replace('%', '').trim();
           let pctFloat = parseFloat(rawPct.replace(',', '.'));
           let formattedPct = isNaN(pctFloat) ? "0.00%" : (pctFloat > 0 ? '+' : '') + pctFloat.toFixed(2) + '%';
   
           // --- FIX: Safely parse Day Change using the built-in parseForSort function ---
           let dChFloat = parseForSort(rect.item.dCh);
           if (dChFloat === -Infinity || isNaN(dChFloat)) {
               dChFloat = 0;
           }
           let formattedDch = (dChFloat >= 0 ? '+€ ' : '-€ ') + Math.abs(dChFloat).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
   
           // Mouse interactions
           div.onclick = () => openPortfolioModal(rect.item._type, rect.item._originalIndex);
           div.oncontextmenu = (e) => { 
               if(typeof showContextMenu === 'function') showContextMenu(e, rect.item.t, rect.item._type === 'crypto' ? 'Crypto' : 'Stock', rect.item.price); 
           };
   
           // Output formatting
           div.innerHTML = `
               <div class="hm-ticker" title="${rect.item.t}">${rect.item.t}</div>
               <div class="hm-pct">${formattedPct}</div>
               <div class="hm-val sensitive">${formattedDch}</div>
           `;
           container.appendChild(div);
       });
   }
   
   // Helper: Custom Slice-and-Dice Algorithm
   function sliceAndDice(items, x, y, w, h, total) {
       let rects = [];
       let currentX = x;
       let currentY = y;
       let currentW = w;
       let currentH = h;
       let currentTotal = total;
   
       items.forEach((item) => {
           if(currentTotal <= 0) return;
           let ratio = item.numericVal / currentTotal;
           if (currentW > currentH) { 
               let itemW = currentW * ratio;
               rects.push({item, x: currentX, y: currentY, w: itemW, h: currentH});
               currentX += itemW;
               currentW -= itemW;
           } else { 
               let itemH = currentH * ratio;
               rects.push({item, x: currentX, y: currentY, w: currentW, h: itemH});
               currentY += itemH;
               currentH -= itemH;
           }
           currentTotal -= item.numericVal;
       });
       return rects;
   }
   // Helper: Parses volume strings (like 1.5M, 800K) into clean numbers for ratio calculation
   function parseVolume(v) {
       if (!v || v === '-' || v === '#N/A' || v === 'N/A') return 0;
       let s = String(v).toUpperCase().replace(/,/g, '');
       let multi = 1;
       if (s.includes('M')) { multi = 1e6; s = s.replace('M', ''); }
       else if (s.includes('B')) { multi = 1e9; s = s.replace('B', ''); }
       else if (s.includes('K')) { multi = 1e3; s = s.replace('K', ''); }
       let n = parseFloat(s);
       return isNaN(n) ? 0 : n * multi;
   }

   // --- TICKER NOTES MODULE (FRONTEND) ---
   // ============================================================================
   
   function openTickerNotes(ticker, event) {
       if (event) {
           event.preventDefault();
           event.stopPropagation();
       }
       
       const sheet = document.getElementById('ticker-notes-sheet');
       const backdrop = document.getElementById('common-backdrop');
       const title = document.getElementById('notes-sheet-title');
       const input = document.getElementById('ticker-notes-input');
       const hiddenTicker = document.getElementById('current-notes-ticker');
       
       if (!sheet || !title || !input || !hiddenTicker) return;
       
       hiddenTicker.value = ticker;
       title.innerText = `${ticker} NOTES`;
       
       let notesData = {};
       try {
           notesData = JSON.parse(localStorage.getItem('ticker_notes') || '{}');
       } catch(e) { console.error("Error reading notes"); }
       
       input.value = notesData[ticker] || '';
       
       if (backdrop) backdrop.classList.add('active');
       sheet.classList.add('active');
   }
   
   function closeTickerNotesSheet() {
       const sheet = document.getElementById('ticker-notes-sheet');
       const backdrop = document.getElementById('common-backdrop');
       if (sheet) sheet.classList.remove('active');
       
       const activeSheets = document.querySelectorAll('.sheet-modal.active');
       if (backdrop && activeSheets.length === 0) {
           backdrop.classList.remove('active');
       }
   }
   
   function saveTickerNote(event) {
       const ticker = document.getElementById('current-notes-ticker').value;
       const noteText = document.getElementById('ticker-notes-input').value.trim();
       
       if (!ticker) return;
       
       let notesData = {};
       try { notesData = JSON.parse(localStorage.getItem('ticker_notes') || '{}'); } catch(e) {}
       
       if (noteText === '') {
           delete notesData[ticker]; 
       } else {
           notesData[ticker] = noteText;
       }
       localStorage.setItem('ticker_notes', JSON.stringify(notesData));
       
       const btn = event.currentTarget;
       const oldText = btn.innerText;
       const oldBg = btn.style.background;
       
       btn.innerText = '☁️ SYNCING...';
       btn.style.pointerEvents = 'none';
       
       if (typeof google !== 'undefined' && google.script) {
           google.script.run
               .withSuccessHandler(function() {
                   btn.innerText = '✅ SECURELY SAVED';
                   btn.style.background = 'var(--success, #34c759)';
                   setTimeout(() => {
                       btn.innerText = oldText;
                       btn.style.background = oldBg;
                       btn.style.pointerEvents = 'auto';
                       closeTickerNotesSheet();
                       
                       // Ricarica le card per far apparire l'icona 📝
                       if (typeof fetchWatchlist === 'function') fetchWatchlist(true);
                       if (typeof fetchLivePortfolio === 'function') fetchLivePortfolio(true);
                   }, 800);
               })
               .withFailureHandler(function(err) {
                   btn.innerText = '⚠️ SAVED LOCALLY (SYNC FAILED)';
                   btn.style.background = 'var(--warning, #ff9500)';
                   setTimeout(() => {
                       btn.innerText = oldText;
                       btn.style.background = oldBg;
                       btn.style.pointerEvents = 'auto';
                   }, 2000);
               })
               .saveNoteToCloud(ticker, noteText);
       } else {
           setTimeout(() => closeTickerNotesSheet(), 500);
       }
   }
   
   function hasTickerNote(ticker) {
       try {
           const notesData = JSON.parse(localStorage.getItem('ticker_notes') || '{}');
           return !!notesData[ticker];
       } catch(e) {
           return false;
       }
   }
   
   /**
    * Switches the active sub-tab inside the Market page.
    * @param {string} tabId - The ID suffix of the tab to show (assets, insights, tools).
    * @param {HTMLElement} btnElement - The button element that was clicked.
    */
   function switchMarketTab(tabId, btnElement) {
       // 1. Remove active state from all buttons
       const buttons = document.querySelectorAll('.m-sub-btn');
       buttons.forEach(btn => btn.classList.remove('active'));
       
       // 2. Add active state to the clicked button
       if (btnElement) {
           btnElement.classList.add('active');
       }
       
       // 3. Hide all tab contents
       const tabs = document.querySelectorAll('.m-tab-content');
       tabs.forEach(tab => {
           tab.classList.remove('active');
       });
       
       // 4. Show the target tab
       const targetTab = document.getElementById('mtab-' + tabId);
       if (targetTab) {
           targetTab.classList.add('active');
           
           // Fix potential TradingView render issues when changing from display:none to block
           if (tabId === 'insights') {
               window.dispatchEvent(new Event('resize'));
           }
       }
   }
