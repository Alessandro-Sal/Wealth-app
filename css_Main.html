<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root {
	/* --- COLOR PALETTE (iOS 17 Inspired) --- */
	--primary: #007aff;
	--stocks-bg: #28a745;
	--crypto-bg: #ffc107;
	--invest-bg: #5856d6;
	--market-bg: #ff2d55;

	/* Light Mode Defaults */
	--bg: #f2f2f7;
	--white: #ffffff;
	--gray: #8e8e93;
	--danger: #ff3b30;
	--warning: #ff9500;
	--success: #34c759;
	--text-main: #000000;

	/* Form Elements */
	--input-bg: #ffffff;
	--input-border: #ddd;
	--section-bg: #e5e5ea;
	--row-border: #f2f2f7;
}

body::before,
body::after {
	content: '';
	position: fixed;
	width: 300px;
	height: 300px;
	border-radius: 50%;
	filter: blur(120px);
	z-index: -1;
	opacity: 0.4;
	pointer-events: none;
	animation: floatGlow 10s ease-in-out infinite alternate;
}

body::before {
	top: -50px;
	left: -50px;
	background: var(--primary);
}

body::after {
	bottom: 20%;
	right: -50px;
	background: var(--invest-bg);
	animation-delay: -5s;
}

body.dark-mode::before {
	opacity: 0.15;
}

body.dark-mode::after {
	opacity: 0.15;
}

@keyframes floatGlow {
	0% {
		transform: translate(0, 0) scale(1);
	}

	100% {
		transform: translate(30px, 50px) scale(1.2);
	}
}

body {
	font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	background-color: #f2f2f7;
	color: var(--text-main);
	margin: 0;

	/* Layout Handling for iPhone Notch/Home Bar */
	padding-top: env(safe-area-inset-top);
	padding-bottom: calc(90px + env(safe-area-inset-bottom));

	transition: background 0.3s, color 0.3s;
}

/* Prevent elastic bounce effect on the body */
html,
body {
	overscroll-behavior-y: none;
	-webkit-overflow-scrolling: touch;
}

/* Re-enable bounce scrolling for specific scrollable containers */
.page,
.sheet-modal,
.search-res-cont,
#chat-container {
	overscroll-behavior-y: auto;
	-webkit-overflow-scrolling: touch;
}

h1,
h2,
h3,
h4,
.total-amount,
.card-title {
	letter-spacing: -0.5px;
}

body.dark-mode.privacy-mode #incomeStackChart {

/* --- SCROLLBAR HIDING (Clean UI) --- */
/* Chrome/Safari/Webkit */
::-webkit-scrollbar {
	display: none;
}

/* Firefox/IE/Edge */
* {
	-ms-overflow-style: none;
	scrollbar-width: none;
}

/* --- GLOBAL POLISH (Tocchi Finali) --- */

/* 1. Scrollbar Personalizzata (Webkit) */
::-webkit-scrollbar {
	width: 8px;
	height: 8px;
}

::-webkit-scrollbar-track {
	background: transparent;
}

::-webkit-scrollbar-thumb {
	background: rgba(128, 128, 128, 0.4);
	border-radius: 4px;
}

}

	transition: background-color 5000s ease-in-out 0s;
}

/* 4. Select / Dropdown nativi */
body.dark-mode select option {
	background-color: #1c1c1e;
	color: #fff;

/* =========================================
      ULTRA-PREMIUM DASHBOARD UI (RESPONSIVE)
      ========================================= */
/* 1. Glass Header */
.recap-header-container {
	position: sticky;
	top: 0;
	z-index: 100;
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 15px 20px;

	background: rgba(28, 28, 30, 0.75);
	border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

/* 2. Hero Card with Animated Gradient */
.dash-hero {
	background: linear-gradient(-45deg, #007aff, #5856d6, #5ac8fa, #007aff);
	background-size: 400% 400%;
	animation: gradientBG 15s ease infinite;
	border-radius: 28px;
	padding: 30px 20px;
	color: white;
	box-shadow: 0 12px 35px rgba(0, 122, 255, 0.3);
	margin-bottom: 25px;
	position: relative;
	overflow: hidden;
}

@keyframes gradientBG {
	0% {
		background-position: 0% 50%;
	}

	50% {
		background-position: 100% 50%;
	}

	100% {
		background-position: 0% 50%;
	}
}

.dash-hero::before {
	content: '';
	position: absolute;
	top: -50%;
	left: -50%;
	width: 200%;
	height: 200%;
	background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
	pointer-events: none;
}

/* 3. Modern Responsive Grid */
.dash-grid {
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	gap: 15px;
	margin-bottom: 25px;
}

#p-recap .dash-widget {
	margin-bottom: 0 !important;
}

.dash-widget {
	background: var(--white);
	border-radius: 24px;
	padding: 18px;
	box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
	border: 1px solid rgba(0, 0, 0, 0.02);
	display: flex;
	flex-direction: column;
	justify-content: space-between;
	transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
	position: relative;
}

.dash-widget:active {
	transform: scale(0.98);
}

/* MOBILE SPANS */
.span-2 {
	grid-column: span 2;
}

body.dark-mode .dash-widget {
	background: #1c1c1e;
	border: 1px solid rgba(255, 255, 255, 0.05);
	box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

/* Desktop & Tablet Optimizations */
@media (min-width: 768px) {
	.dash-grid {
		grid-template-columns: repeat(4, 1fr);
	}

	.dash-widget {
		padding: 24px;
	}

	.span-pc-1 {
		grid-column: span 1;
	}

	.span-pc-2 {
		grid-column: span 2;
	}

	.span-pc-4 {
		grid-column: span 4;
	}

	.dash-list-wrapper {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 20px;
	}
}

   PREMIUM iOS DROPDOWNS

}

.dropdown-icon {

/* Floating translucent menu (iOS Style) */
.dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;

    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(25px);

}

/* Active state for menu */
