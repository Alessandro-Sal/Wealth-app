<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root {
	/* --- OKLCH COLOR PALETTE (Luxury Minimalist) --- */
	--primary: oklch(0.6 0.15 255); /* Electric Blue */
	--stocks-bg: oklch(0.65 0.15 150); /* Emerald */
	--crypto-bg: oklch(0.75 0.15 80); /* Gold */
	--invest-bg: oklch(0.5 0.2 280); /* Deep Purple */
	--market-bg: oklch(0.6 0.2 20); /* Ruby Red */

	/* Light Mode Defaults */
	--bg: oklch(0.97 0.01 260); /* Very light cool gray */
	--white: oklch(1 0 0);
	--gray: oklch(0.6 0.02 260); /* Slate gray */
	--danger: oklch(0.6 0.2 20);
	--warning: oklch(0.75 0.15 80);
	--success: oklch(0.65 0.15 150);
	--text-main: oklch(0.1 0 0); /* Near black */

	/* Form Elements */
	--input-bg: var(--white);
	--input-border: oklch(0.9 0.01 260);
	--section-bg: oklch(0.93 0.01 260);
	--row-border: oklch(0.95 0.01 260);

	/* Aliases */
	--card-bg: oklch(1 0 0 / 0.8);
	--card-border: oklch(0 0 0 / 0.04);
	--card-shadow: none; /* Removed for flat bento look */
	--bg-color: var(--section-bg);
	--font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	--font-mono: 'SF Mono', 'Consolas', monospace;
	--purple: var(--invest-bg);
	--primary-light: oklch(0.6 0.15 255 / 0.1);
	--text-color: var(--text-main);
}

body::before,
body::after {
	content: '';
	position: fixed;
	width: 300px;
	height: 300px;
	border-radius: 50%;
	filter: blur(120px);
	z-index: -1;
	opacity: 0.4;
	pointer-events: none;
	animation: floatGlow 10s ease-in-out infinite alternate;
}

body::before {
	top: -50px;
	left: -50px;
	background: var(--primary);
}

body::after {
	bottom: 20%;
	right: -50px;
	background: var(--invest-bg);
	animation-delay: -5s;
}

body.dark-mode::before {
	opacity: 0.15;
}

body.dark-mode::after {
	opacity: 0.15;
}

@keyframes floatGlow {
	0% {
		transform: translate(0, 0) scale(1);
	}

	100% {
		transform: translate(30px, 50px) scale(1.2);
	}
}

body {
	font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	background-color: #f2f2f7;
	color: var(--text-main);
	margin: 0;

	/* Layout Handling for iPhone Notch/Home Bar */
	padding-top: env(safe-area-inset-top);
	padding-bottom: calc(90px + env(safe-area-inset-bottom));

	transition: background 0.3s, color 0.3s;
}

/* Prevent elastic bounce effect on the body */
html,
body {
	overscroll-behavior-y: none;
	-webkit-overflow-scrolling: touch;
}
body {
	overflow-x: hidden;
}

/* Re-enable bounce scrolling for specific scrollable containers */
.page,
.sheet-modal,
.search-res-cont,
#chat-container {
	overscroll-behavior-y: auto;
	-webkit-overflow-scrolling: touch;
}

h1,
h2,
h3,
h4,
.total-amount,
.card-title {
	letter-spacing: -0.5px;
}

/* --- DARK MODE OVERRIDES --- */
body.dark-mode {
	--bg: oklch(0.15 0.01 260); /* Deep slate */
	--white: oklch(0.2 0.01 260); /* Elevated slate */
	--gray: oklch(0.6 0.01 260);
	--text-main: oklch(0.98 0 0); /* Near white */

	--input-bg: oklch(0.25 0.01 260);
	--input-border: oklch(0.3 0.01 260);
	--section-bg: oklch(0.18 0.01 260);
	--row-border: oklch(0.25 0.01 260);

	--card-bg: oklch(0.2 0.01 260 / 0.8);
	--card-border: oklch(1 1 1 / 0.05);
	--card-shadow: none; /* Removed for flat bento look */
}

body.dark-mode .header-actions {
	background: rgba(28, 28, 30, 0.85);
	border: 1px solid rgba(255, 255, 255, 0.15);
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
}

body.dark-mode .nav-bar {
	background: rgba(22, 22, 24, 0.95);
	border-top: 1px solid #2c2c2e;
}

	border-radius: 8px;
}

body.dark-mode h3,
body.dark-mode label {
	color: #fff;
}

body.dark-mode .bank-input-group {
	background: #1c1c1e;
}

body.dark-mode .bank-in {

	color: #fff;

}

	border-bottom: 1px solid var(--row-border);
}

body.dark-mode .nav-btn {

}

body.dark-mode .nav-btn.active {
	color: #0a84ff !important;
	text-shadow: 0 0 10px rgba(10, 132, 255, 0.4);
}

body.dark-mode #lock-screen {
	background: #121212;
}

body.dark-mode .pin-dot {
	border-color: #555;
}

body.dark-mode .pin-btn {
	background: #2c2c2e;
	color: #fff;
}

body.dark-mode .mini-theme-btn {
	border-color: #555;
	color: #fff;
}

body.dark-mode .card,
body.dark-mode .h-item {
	background-color: var(--white);
	border: 1px solid rgba(255, 255, 255, 0.05);
}

body.dark-mode .budget-track {
	background: #2c2c2e;
}

body.dark-mode #search-sheet,
body.dark-mode #subs-sheet,
body.dark-mode #invest-search-sheet,
body.dark-mode #calc-sheet {
	background: #1c1c1e;
	border-top: 1px solid #333;
}

body.dark-mode .search-res-item,
body.dark-mode .sub-item {
	border-bottom: 1px solid #38383a;
}

body.dark-mode .calc-display {
	background: #2c2c2e;
	color: #fff;
	border-color: #333;
}

body.dark-mode .calc-btn {
	background: #3a3a3c;
	color: #fff;
}

body.dark-mode .calc-btn.op {
	background: #ff9f0a;
	color: #fff;
}

body.privacy-mode .sensitive {
	color: inherit !important;
	background: transparent !important;
	filter: blur(6px);
	user-select: none;
	pointer-events: none;
	opacity: 0.7;
	transform: translate3d(0, 0, 0);
	/* Hardware acceleration hack */
	display: inline-block;
}

body.privacy-mode .sensitive * {
	text-shadow: none !important;
}

body.dark-mode.privacy-mode .sensitive {
	background-color: transparent !important;
	color: inherit !important;
}

/* Fade out charts slightly in privacy mode */
body.dark-mode.privacy-mode #expenseStackChart,
body.dark-mode.privacy-mode #incomeStackChart {
	opacity: 0.4;
}

/* --- SCROLLBAR HIDING (Clean UI) --- */
/* Chrome/Safari/Webkit */
::-webkit-scrollbar {
	display: none;
}

/* Firefox/IE/Edge */
* {
	-ms-overflow-style: none;
	scrollbar-width: none;
}

/* --- GLOBAL POLISH (Tocchi Finali) --- */

/* 1. Scrollbar Personalizzata (Webkit) */
::-webkit-scrollbar {
	width: 8px;
	height: 8px;
}

::-webkit-scrollbar-track {
	background: transparent;
}

::-webkit-scrollbar-thumb {
	background: rgba(128, 128, 128, 0.4);
	border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
	background: rgba(128, 128, 128, 0.6);
}

/* 2. Selezione del Testo */
::selection {
	background: rgba(10, 132, 255, 0.3);
	/* Blu iOS trasparente */
	color: inherit;
}

/* 3. Fix Autofill Input (Browser) */
body.dark-mode input:-webkit-autofill,
body.dark-mode input:-webkit-autofill:hover,
body.dark-mode input:-webkit-autofill:focus,
body.dark-mode textarea:-webkit-autofill {
	-webkit-text-fill-color: #fff;
	-webkit-box-shadow: 0 0 0px 1000px #2c2c2e inset;
	transition: background-color 5000s ease-in-out 0s;
}

/* 4. Select / Dropdown nativi */
body.dark-mode select option {
	background-color: #1c1c1e;
	color: #fff;
}

/* =========================================
      ULTRA-PREMIUM DASHBOARD UI (RESPONSIVE)
      ========================================= */
/* 1. Glass Header */
.recap-header-container {
	position: sticky;
	top: 0;
	z-index: 100;
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 15px 20px;
	margin: -15px -15px 20px -15px;
	background: rgba(242, 242, 247, 0.75);
	backdrop-filter: blur(20px);
	-webkit-backdrop-filter: blur(20px);
	border-bottom: 1px solid rgba(0, 0, 0, 0.05);
}

body.dark-mode .recap-header-container {
	background: rgba(28, 28, 30, 0.75);
	border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

/* 2. Hero Card with Animated Gradient */
.dash-hero {
	background: linear-gradient(-45deg, #007aff, #5856d6, #5ac8fa, #007aff);
	background-size: 400% 400%;
	animation: gradientBG 15s ease infinite;
	border-radius: 28px;
	padding: 30px 20px;
	color: white;
	box-shadow: 0 12px 35px rgba(0, 122, 255, 0.3);
	margin-bottom: 25px;
	position: relative;
	overflow: hidden;
}

@keyframes gradientBG {
	0% {
		background-position: 0% 50%;
	}

	50% {
		background-position: 100% 50%;
	}

	100% {
		background-position: 0% 50%;
	}
}

.dash-hero::before {
	content: '';
	position: absolute;
	top: -50%;
	left: -50%;
	width: 200%;
	height: 200%;
	background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
	pointer-events: none;
}

/* 3. Modern Responsive Grid (Bento) */
.dash-grid {
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	gap: 12px;
	margin-bottom: 24px;
}

#p-recap .dash-widget {
	margin-bottom: 0 !important;
}

/* Empty States */
.empty-state {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	padding: 40px 20px;
	text-align: center;
	color: var(--gray);
	background: oklch(0.97 0.01 260 / 0.5); /* subtle bg */
	border-radius: 16px;
	border: 1px dashed var(--card-border);
}

.empty-state .empty-icon {
	color: var(--primary);
	opacity: 0.6;
	margin-bottom: 16px;
	width: 48px;
	height: 48px;
}

.empty-state .empty-title {
	font-size: 16px;
	font-weight: 700;
	color: var(--text-main);
	margin-bottom: 6px;
}

.empty-state .empty-subtitle {
	font-size: 13px;
	max-width: 250px;
	line-height: 1.4;
}

body.dark-mode .empty-state {
	background: oklch(0.2 0.01 260 / 0.5);
}

.dash-widget {
	background: var(--white);
	border-radius: 20px;
	padding: 20px;
	box-shadow: none;
	border: 1px solid var(--card-border);
	display: flex;
	flex-direction: column;
	justify-content: space-between;
	transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s;
	position: relative;
	overflow: hidden;
}

.dash-widget:active {
	transform: scale(0.96);
}

/* MOBILE SPANS */
.span-2 {
	grid-column: span 2;
}

body.dark-mode .dash-widget {
	background: var(--white);
	border: 1px solid var(--card-border);
	box-shadow: none;
}

/* Desktop & Tablet Optimizations */
@media (min-width: 768px) {
	.dash-grid {
		grid-template-columns: repeat(4, 1fr);
	}

	.dash-widget {
		padding: 24px;
	}

	.span-pc-1 {
		grid-column: span 1;
	}

	.span-pc-2 {
		grid-column: span 2;
	}

	.span-pc-4 {
		grid-column: span 4;
	}

	.dash-list-wrapper {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 20px;
	}
}

/* 4. Widget Micro-Elements */
.widget-title {
	font-size: 11px;
	font-weight: 800;
	text-transform: uppercase;

}

.widget-value {

}

body.dark-mode .dash-list {

	flex-direction: column;
	gap: 12px;
}

#trip-list-container>div {

.dash-section-title {

	letter-spacing: -0.5px;

}

/* 8. Tax Section */
.tax-row {

}

}

}

.tax-desc {

}

/* Specific Colored Badges */
.badge-icon {
	width: 28px;
	height: 28px;
	border-radius: 8px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 14px;
	color: white;
}

.bg-blue {
	background: #007aff;
}

.bg-green {
	background: #34c759;
}

.bg-orange {

}

.bg-purple {

}

.bg-red {

}

}

}

.pc-wrapper {
	max-width: 1200px;

	width: 100%;
}

.sensitive,
.widget-value,
.dash-list-value,
.amt {

}

@keyframes floatUp {
	0% {
		opacity: 0;
		transform: translateY(15px);
	}

	100% {

		transform: translateY(0);
	}
}

.dash-widget,
.dash-list,
.dash-hero {

/* Ritarda leggermente ogni elemento per un effetto a cascata */
.dash-grid>div:nth-child(1) {

}

}

/* --- ADVANCED PRIVACY MODE PER NUMERI GIGANTI --- */
