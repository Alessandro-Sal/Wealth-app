<script>
   /**
    * ======================================================================================
    * BLOCK 4: CHARTS (CHART.JS RENDERERS)
    * Handles all visualization: Financial Trends, Asset Allocation, Sankey Flow, Stacked Bars, Pension.
    * ======================================================================================
    */
   
   /**
    * Renders the main Financial Trend Chart (Income vs Expense vs Savings).
    * 
    */
   function renderFinancialChart(year) {
     if (!year) year = document.getElementById('trendYear').value;
     const chartDom = document.getElementById('expensesChart');
     if (!chartDom) return;
     
     if (myChart && typeof myChart.dispose === 'function') { myChart.dispose(); }
     else if (myChart && typeof myChart.destroy === 'function') { myChart.destroy(); }
     
     google.script.run.withSuccessHandler(data => {
         const colIncome = '#28a745'; 
         const colExpense = '#ff3b30'; 
         const colSavings = '#007aff';
         
         const avgs = data.averages || { income: 0, expense: 0, savings: 0 };
         const isPrivacy = document.body.classList.contains('privacy-mode');
         const fmt = (v) => "€ " + new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 }).format(v);
         
         myChart = echarts.init(chartDom);
         const theme = getChartTheme();
         
         const option = {
             tooltip: {
                 trigger: 'axis',
                 axisPointer: { type: 'shadow' },
                 backgroundColor: theme.tooltipBg,
                 textStyle: { color: theme.tooltipText },
                 formatter: function (params) {
                     let res = params[0].name + '<br/>';
                     params.forEach(p => {
                         if (document.body.classList.contains('privacy-mode')) {
                             res += p.marker + ' ' + p.seriesName + ': <b>****</b><br/>';
                         } else {
                             let val = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(p.value);
                             res += p.marker + ' ' + p.seriesName + ': <b>' + val + '</b><br/>';
                         }
                     });
                     return res;
                 }
             },
             legend: {
                 data: ['Income', 'Expense', 'Savings'],
                 bottom: 0,
                 textStyle: { color: theme.text },
                 icon: 'circle'
             },
             grid: {
                 top: '50px',
                 left: '2%',
                 right: '2%',
                 bottom: '10%',
                 containLabel: true
             },
             xAxis: {
                 type: 'category',
                 data: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                 axisLine: { show: false },
                 axisTick: { show: false },
                 axisLabel: { color: theme.text }
             },
             yAxis: {
                 type: 'value',
                 splitLine: { lineStyle: { color: theme.grid, type: 'dashed' } },
                 axisLabel: { 
                     color: theme.text,
                     formatter: function(val) {
                         if (document.body.classList.contains('privacy-mode')) return '****';
                         return new Intl.NumberFormat('it-IT', { notation: "compact" }).format(val);
                     }
                 }
             },
             graphic: {
                 elements: [
                     {
                         type: 'group',
                         right: 10,
                         top: 10,
                         children: [
                             {
                                 type: 'text',
                                 style: {
                                     text: isPrivacy ? 'Inc: **** | Exp: **** | Sav: ****' : `Inc: ${fmt(avgs.income)} | Exp: ${fmt(avgs.expense)} | Sav: ${fmt(avgs.savings)}`,
                                     fill: theme.text,
                                     font: '600 11px Inter, sans-serif'
                                 }
                             }
                         ]
                     }
                 ]
             },
             series: [
                 {
                     name: 'Savings',
                     type: 'line',
                     data: data.savings,
                     itemStyle: { color: colSavings },
                     lineStyle: { width: 3 },
                     symbol: 'circle',
                     symbolSize: 6,
                     z: 3
                 },
                 {
                     name: 'Income',
                     type: 'bar',
                     data: data.income,
                     itemStyle: { color: colIncome, borderRadius: [4, 4, 0, 0] },
                     barGap: '10%',
                     barCategoryGap: '30%'
                 },
                 {
                     name: 'Expense',
                     type: 'bar',
                     data: data.expense,
                     itemStyle: { color: colExpense, borderRadius: [4, 4, 0, 0] }
                 }
             ]
         };
         
         myChart.setOption(option);
     }).getMonthlyChartData(year);
   }
   
/**
 * Renders the Asset Allocation Doughnut Chart.
 */
function renderAssetChart(summary) {
  const chartDom = document.getElementById('assetAllocationChart');
  if (!chartDom) return; 
  
  if (assetChart && typeof assetChart.dispose === 'function') { assetChart.dispose(); }
  else if (assetChart && typeof assetChart.destroy === 'function') { assetChart.destroy(); }
  
  const s = summary || {};
  const valStocks = s.stocks?.raw || 0; 
  const valEtfs = s.etfs?.raw || 0; 
  const valCrypto = s.crypto?.raw || 0; 
  const valOthers = s.others?.raw || 0; 
  const valPension = s.pension?.raw || 0;
  
  const valLiquid = s.liquid?.raw || 0;
  const valRealEstate = s.realEstate?.raw || 0;
  const valBonds = s.bonds?.raw || 0;
  
  const labels = ['Stocks', 'Liquidità', 'ETFs', 'Crypto', 'Bonds', 'Real Estate', 'Others', 'Pension'];
  const values = [valStocks, valLiquid, valEtfs, valCrypto, valBonds, valRealEstate, valOthers, valPension];
  
  const totalCheck = values.reduce((a, b) => a + b, 0);
  const finalColors = totalCheck > 0 ? ['#28a745', '#007aff', '#555555', '#ffc107', '#32ade6', '#34c759', '#ff2d55', '#fd7e14'] : ['#e5e5ea'];
  
  // FIX: Usa AllocatedTotal per allineare le % al 100% esatto senza lo sfasamento dei debiti
  const chartGrandTotal = s.allocatedTotal > 0 ? s.allocatedTotal : totalCheck;
  
  const dataSeries = [];
  if (totalCheck > 0) {
      for (let i = 0; i < labels.length; i++) {
          if (values[i] > 0) {
              dataSeries.push({ value: values[i], name: labels[i], itemStyle: { color: finalColors[i] } });
          }
      }
  } else {
      dataSeries.push({ value: 1, name: 'No Data', itemStyle: { color: '#e5e5ea' } });
  }
  
  assetChart = echarts.init(chartDom);
  const theme = getChartTheme();
  
  const option = {
      tooltip: {
          trigger: 'item',
          backgroundColor: theme.tooltipBg,
          textStyle: { color: theme.tooltipText },
          formatter: function (params) {
              if (totalCheck === 0) return 'No Data';
              let percentage = chartGrandTotal > 0 ? ((params.value / chartGrandTotal) * 100).toFixed(1) + '%' : '0.0%';
              let res = params.marker + ' ' + params.name + ': <br/>';
              if (document.body.classList.contains('privacy-mode')) {
                  res += '<b>****</b> (' + percentage + ')';
              } else {
                  let val = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(params.value);
                  res += '<b>' + val + '</b> (' + percentage + ')';
              }
              return res;
          }
      },
      legend: {
          show: totalCheck > 0,
          bottom: 0,
          textStyle: { color: theme.text },
          icon: 'circle'
      },
      series: [
          {
              type: 'pie',
              radius: ['50%', '80%'],
              avoidLabelOverlap: false,
              itemStyle: {
                  borderRadius: 5,
                  borderColor: theme.bg,
                  borderWidth: 2
              },
              label: { show: false, position: 'center' },
              emphasis: {
                  label: {
                      show: true,
                      fontSize: 14,
                      fontWeight: 'bold',
                      color: theme.text,
                      formatter: function(params) {
                          if (totalCheck === 0) return '';
                          return params.name + '\n' + (chartGrandTotal > 0 ? ((params.value / chartGrandTotal) * 100).toFixed(1) + '%' : '');
                      }
                  }
              },
              labelLine: { show: false },
              data: dataSeries
          }
      ]
  };
  
  assetChart.setOption(option);
}
   
   /**
    * Renders Stacked Bar Charts for Category Breakdown (Income/Expense).
    * Includes Privacy Mode support for Y-axis, Tooltips, and custom Average badge.
    */
   function renderStackedCharts(data) {
     const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
     const categoryColors = { 'Stipendio': '#28a745', 'Family': '#34c759', 'Parenti': '#20c997', 'Entrate Varie': '#007aff', 'Alimentazione': '#ff9500', 'Alloggio': '#007aff', 'Trasporti': '#5856d6', 'Uscite': '#ff2d55', 'Free-Time': '#af52de', 'Necessità': '#ff3b30', 'Viaggi': '#00bcd4', 'Regali': '#ffc107', 'Famiglia': '#ffcc00', 'Varie': '#8e8e93', 'Mamma Calabria': '#fd7e14' };
     const fallbackPalette = ['#32ade6', '#30b0c7', '#34c759', '#00c7be', '#5856d6', '#ff2d55', '#ff9500', '#ffcc00', '#a2845e', '#8e8e93'];
     
     const getCatColor = (cat, index) => { 
         if (categoryColors[cat]) return categoryColors[cat]; 
         let lower = cat.toLowerCase(); 
         if (lower.includes('invest') || lower.includes('azioni')) return '#5856d6'; 
         if (lower.includes('crypto')) return '#ffc107'; 
         return fallbackPalette[index % fallbackPalette.length]; 
     };
     
     const createChart = (ctxId, mapData, existingInstance, totalAvgValue, themeColor, specificAverages) => {
         const chartDom = document.getElementById(ctxId);
         if (!chartDom) return existingInstance;
         if (existingInstance && typeof existingInstance.dispose === 'function') existingInstance.dispose();
         else if (existingInstance && typeof existingInstance.destroy === 'function') existingInstance.destroy();
         
         const sortedCats = Object.keys(mapData).sort();
         let series = [];
         sortedCats.forEach((cat, i) => { 
             series.push({ 
                 name: cat, 
                 type: 'bar', 
                 stack: 'total', 
                 data: mapData[cat], 
                 itemStyle: { color: getCatColor(cat, i), borderRadius: [0, 0, 0, 0] },
                 emphasis: { focus: 'series' }
             }); 
         });
         
         const instance = echarts.init(chartDom);
         const theme = getChartTheme();
         
         const option = {
             tooltip: {
                 trigger: 'axis',
                 axisPointer: { type: 'shadow' },
                 backgroundColor: theme.tooltipBg,
                 textStyle: { color: theme.tooltipText },
                 formatter: function (params) {
                     let res = params[0].name + '<br/>';
                     const isPrivacy = document.body.classList.contains('privacy-mode');
                     params.forEach(p => {
                         if (p.value === 0) return;
                         let label = p.seriesName;
                         if (isPrivacy) {
                             res += p.marker + ' ' + label + ': <b>****</b><br/>';
                         } else {
                             let valStr = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(p.value);
                             let avgStr = "";
                             if (specificAverages && specificAverages[label]) {
                                 let avgVal = specificAverages[label];
                                 let avgFmt = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 }).format(avgVal);
                                 avgStr = ` (Ø ${avgFmt})`;
                             }
                             res += p.marker + ' ' + label + ': <b>' + valStr + '</b>' + avgStr + '<br/>';
                         }
                     });
                     return res;
                 }
             },
             legend: {
                 bottom: 0,
                 type: 'scroll',
                 textStyle: { color: theme.text },
                 icon: 'circle'
             },
             grid: {
                 top: '40px',
                 left: '2%',
                 right: '2%',
                 bottom: '15%',
                 containLabel: true
             },
             xAxis: {
                 type: 'category',
                 data: months,
                 axisLine: { show: false },
                 axisTick: { show: false },
                 axisLabel: { color: theme.text }
             },
             yAxis: {
                 type: 'value',
                 splitLine: { lineStyle: { color: theme.grid, type: 'dashed' } },
                 axisLabel: {
                     color: theme.text,
                     formatter: function(val) {
                         if (document.body.classList.contains('privacy-mode')) return '****';
                         return new Intl.NumberFormat('it-IT', { notation: "compact" }).format(val);
                     }
                 }
             },
             graphic: totalAvgValue ? {
                 elements: [
                     {
                         type: 'group',
                         right: 10,
                         top: 10,
                         children: [
                             {
                                 type: 'text',
                                 style: {
                                     text: document.body.classList.contains('privacy-mode') ? 'Ø Tot: ****' : `Ø Tot: € ${new Intl.NumberFormat('it-IT', {maximumFractionDigits: 0}).format(totalAvgValue)}`,
                                     fill: theme.text,
                                     font: '600 11px Inter, sans-serif'
                                 }
                             }
                         ]
                     }
                 ]
             } : null,
             series: series
         };
         
         instance.setOption(option);
         return instance;
     };
     
     const catAvgs = data.catAverages || { income: {}, expense: {} };
     expenseStackInstance = createChart('expenseStackChart', data.expense, expenseStackInstance, data.avgExpense, '#ff3b30', catAvgs.expense);
     incomeStackInstance = createChart('incomeStackChart', data.income, incomeStackInstance, data.avgIncome, '#28a745', catAvgs.income);
   }
   
   /**
    * Renders the Pension Growth Chart (Cumulative vs Annual).
    */
   function renderPensionChart(data) {
     const chartDom = document.getElementById('pensionChart');
     if (!chartDom) return;
     if (pensionChartInstance && typeof pensionChartInstance.dispose === 'function') pensionChartInstance.dispose();
     else if (pensionChartInstance && typeof pensionChartInstance.destroy === 'function') pensionChartInstance.destroy();
     
     const currentYear = new Date().getFullYear();
     const activeData = data.filter(d => { const y = parseInt(d.year); if (y <= currentYear) return true; return d.annual > 0; });
     const labels = activeData.map(d => d.year);
     const values = activeData.map(d => d.cumulative);
     const annuals = activeData.map(d => d.annual);
     
     // Pension Details Logic
     if (activeData.length > 0) {
         const currentYearStr = new Date().getFullYear().toString();
         let currentData = activeData.find(d => d.year === currentYearStr);
         if (!currentData) currentData = activeData[activeData.length - 1];
         
         const currentAnnual = currentData.annual || 0; 
         const currentCumul = currentData.cumulative || 0;
         
         document.getElementById('pension-total').innerText = "€ " + new Intl.NumberFormat('it-IT').format(currentCumul);
         document.getElementById('pension-year').innerText = "+ € " + new Intl.NumberFormat('it-IT').format(currentAnnual);
         
         // Tax Deduction Logic
         const TAX_LIMIT = 5164.57; 
         let taxPct = Math.min((currentAnnual / TAX_LIMIT) * 100, 100); 
         let taxRemaining = Math.max(TAX_LIMIT - currentAnnual, 0); 
         let estimatedTaxBack = currentAnnual * 0.35;
         
         const elBar = document.getElementById('tax-bar');
         if(elBar) { elBar.style.width = taxPct + "%"; elBar.style.background = taxPct >= 100 ? '#34c759' : '#ff9500'; }
         
         document.getElementById('tax-pct').innerText = taxPct.toFixed(1) + "%";
         document.getElementById('tax-gap-val').innerHTML = `Gap: <span style="font-weight:normal">€ ${new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 }).format(taxRemaining)}</span> <span style="color:#34c759; font-weight:bold;">(Return: +€ ${estimatedTaxBack.toFixed(0)})</span>`;
         
         let divisor = 12; 
         if (currentData.year === currentYearStr) { const now = new Date(); divisor = Math.max(now.getMonth() + 1, 1); }
         let monthlyAvg = currentAnnual / divisor; 
         document.getElementById('pension-avg').innerText = "€ " + monthlyAvg.toFixed(0);
         
         // Projection Logic
         const rate = 0.04; const years = 10; 
         let annualBase = currentAnnual; 
         if (annualBase === 0 && activeData.length > 1) annualBase = activeData[activeData.length - 2].annual;
         
         let futureExisting = currentCumul * Math.pow(1 + rate, years); 
         let futureContributions = annualBase * ((Math.pow(1 + rate, years) - 1) / rate); 
         let projection = futureExisting + futureContributions; 
         let monthlyPension = projection / (20 * 12);
         
         let projFormatted = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 }).format(projection); 
         let monthlyFormatted = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 }).format(monthlyPension);
         
         document.getElementById('pension-proj').innerHTML = `€ ${projFormatted}<div style="font-size:9px; color:gray; margin-top:2px;">~ € ${monthlyFormatted}/month</div>`;
     }
     
     pensionChartInstance = echarts.init(chartDom);
     const theme = getChartTheme();
     
     const option = {
         tooltip: {
             trigger: 'axis',
             axisPointer: { type: 'cross' },
             backgroundColor: theme.tooltipBg,
             textStyle: { color: theme.tooltipText },
             formatter: function (params) {
                 let res = params[0].name + '<br/>';
                 params.forEach(p => {
                     let val = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(p.value);
                     res += p.marker + ' ' + p.seriesName + ': <b>' + (document.body.classList.contains('privacy-mode') ? '****' : val) + '</b><br/>';
                 });
                 return res;
             }
         },
         grid: {
             top: 10,
             left: 0,
             right: 0,
             bottom: 20,
             containLabel: false
         },
         xAxis: {
             type: 'category',
             data: labels,
             axisLine: { show: false },
             axisTick: { show: false },
             axisLabel: { color: theme.text, fontSize: 10 }
         },
         yAxis: [
             { type: 'value', show: false },
             { type: 'value', show: false }
         ],
         series: [
             {
                 name: 'Total',
                 type: 'line',
                 yAxisIndex: 0,
                 data: values,
                 itemStyle: { color: '#4b4b4d' },
                 areaStyle: {
                     color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                         { offset: 0, color: 'rgba(75, 75, 77, 0.4)' },
                         { offset: 1, color: 'rgba(75, 75, 77, 0.05)' }
                     ])
                 },
                 lineStyle: { width: 2 },
                 symbol: 'none',
                 smooth: 0.4
             },
             {
                 name: 'Deposit',
                 type: 'bar',
                 yAxisIndex: 1,
                 data: annuals,
                 itemStyle: { color: '#34c759', borderRadius: [4, 4, 0, 0] },
                 barMaxWidth: 20
             }
         ]
     };
     
     pensionChartInstance.setOption(option);
   }
   
   /**
    * Renders the Sankey Diagram (Flow of Money) using ECharts.
    */
   function renderSankeyChart(data) {
     const chartDom = document.getElementById('sankeyChart');
     if (!chartDom) return;
     if (sankeyChartInstance && typeof sankeyChartInstance.dispose === 'function') {
         sankeyChartInstance.dispose();
     } else if (sankeyChartInstance && typeof sankeyChartInstance.destroy === 'function') {
         sankeyChartInstance.destroy();
     }
     
     const isDark = document.body.classList.contains('dark-mode'); 
     const txtColor = isDark ? '#fff' : '#333';
     const cIncome = '#34c759'; 
     const cExpense = '#ff3b30'; 
     const cSaving = '#007aff'; 
     const cPool = '#8e8e93'; 
     
     let nodesMap = new Map();
     let links = [];
     
     nodesMap.set('Wallet 💰', cPool);
     
     // Income Flows
     if (data.incCats) data.incCats.forEach(item => { 
         if (item.val > 0) {
             let catName = item.cat + '\u200B'; // Zero-width space to prevent cycles if income and exp have same name
             nodesMap.set(catName, cIncome);
             links.push({source: catName, target: 'Wallet 💰', value: item.val});
         }
     });
     
     // Expense Flows
     if (data.expCats) data.expCats.forEach(item => { 
         if (item.val > 0) {
             nodesMap.set(item.cat, cExpense);
             links.push({source: 'Wallet 💰', target: item.cat, value: item.val});
         }
     });
     
     // Saving Flows
     if (data.rawSaving > 0) {
         // Invisible spacer to detach savings from expenses
         nodesMap.set(' ', 'transparent');
         links.push({source: 'Wallet 💰', target: ' ', value: data.rawSaving * 0.15}); // 15% relative gap
         
         nodesMap.set('Risparmi 🏦', cSaving);
         links.push({source: 'Wallet 💰', target: 'Risparmi 🏦', value: data.rawSaving});
     }
     
     let nodes = Array.from(nodesMap.entries()).map(([name, color]) => ({
         name: name,
         itemStyle: { 
             color: color,
             borderWidth: name === ' ' ? 0 : undefined,
             borderColor: name === ' ' ? 'transparent' : undefined
         },
         depth: (name.includes('Risparmi') || name === ' ') ? 2 : undefined
     }));
     
     sankeyChartInstance = echarts.init(chartDom);
     
     let option = {
         tooltip: {
             trigger: 'item',
             triggerOn: 'mousemove',
             formatter: function (params) {
                 if (params.data.name === ' ' || params.data.target === ' ') return ''; // Hide spacer
                 if (document.body.classList.contains('privacy-mode')) return '****';
                 let val = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(params.data.value);
                 if (params.dataType === 'node') {
                     return `${params.data.name}: ${val}`;
                 } else {
                     return `${params.data.source} &rarr; ${params.data.target}: <br/><b>${val}</b>`;
                 }
             }
         },
         series: {
             type: 'sankey',
             layout: 'none',
             layoutIterations: 0,
             emphasis: {
                 focus: 'adjacency'
             },
             nodeAlign: 'justify',
             data: nodes,
             links: links,
             lineStyle: {
                 color: 'gradient',
                 curveness: 0.5,
                 opacity: 0.4
             },
             itemStyle: {
                 borderWidth: 0,
                 borderColor: '#aaa'
             },
             label: {
                 color: txtColor,
                 fontFamily: 'Inter, sans-serif',
                 fontSize: 11,
                 fontWeight: 'bold',
                 formatter: function (p) {
                     return p.name === ' ' ? '' : p.name;
                 }
             }
         }
     };
     
     sankeyChartInstance.setOption(option);
      
     // Interactive drill-down for categories
     sankeyChartInstance.on('click', function (params) {
         console.log("Sankey clicked!", params);
         
         let targetName = "";
         if (params.dataType === 'node') {
             targetName = params.data.name;
         } else if (params.dataType === 'edge') {
             // If they click the flow line, deduce the category
             if (params.data.target && params.data.target.includes('Wallet')) {
                 targetName = params.data.source;
             } else {
                 targetName = params.data.target;
             }
         }
         
         if (!targetName || targetName.includes('Wallet') || targetName.includes('Risparmi')) return;
         
         try {
             let categoryName = targetName.replace(/\u200B/g, '').trim();
                 
                 let yearBox = document.getElementById('trendYear');
                 let currentYear = new Date().getFullYear().toString();
                 let selectedYear = yearBox ? yearBox.value : currentYear;
                 
                 Swal.fire({
                     title: 'Caricamento...',
                     html: 'Recupero dati per <b>' + categoryName + '</b>',
                     allowOutsideClick: false,
                     didOpen: () => {
                         Swal.showLoading();
                     }
                 });
                 
                 google.script.run.withFailureHandler(function(err) {
                     console.error("Backend Error:", err);
                     Swal.fire('Errore', 'Impossibile recuperare i dati', 'error');
                 }).withSuccessHandler(function(monthlyData) {
                     console.log("Received monthly data:", monthlyData);
                     if (!monthlyData) {
                         Swal.fire('Errore', 'Nessun dato restituito', 'error');
                         return;
                     }
                     
                     let isIncome = !!monthlyData.income[categoryName];
                     let trendData = monthlyData.expense[categoryName] || monthlyData.income[categoryName] || new Array(12).fill(0);
                     
                     Swal.fire({
                         title: categoryName,
                         html: '<div id="catChart" style="width:100%;height:300px;"></div>',
                         width: 600,
                         showCloseButton: true,
                         showConfirmButton: false,
                         didOpen: () => {
                             const catChartDom = document.getElementById('catChart');
                             if (!catChartDom) return;
                             const catChart = echarts.init(catChartDom);
                             const isDark = document.body.classList.contains('dark-mode'); 
                             const txtColor = isDark ? '#b0b0b0' : '#666';
                             const barColor = isIncome ? '#34c759' : '#ff3b30';
                             
                             catChart.setOption({
                                 tooltip: {
                                     trigger: 'axis',
                                     formatter: function (p) {
                                         if (document.body.classList.contains('privacy-mode')) return p[0].name + '<br/><b>*** €</b>';
                                         let val = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(p[0].value);
                                         return p[0].name + '<br/><b>' + val + '</b>';
                                     }
                                 },
                                 grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                                 xAxis: {
                                     type: 'category',
                                     data: ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'],
                                     axisLabel: { color: txtColor }
                                 },
                                 yAxis: {
                                     type: 'value',
                                     axisLabel: { 
                                         color: txtColor, 
                                         formatter: function(val) {
                                             return document.body.classList.contains('privacy-mode') ? '***' : val + ' €';
                                         }
                                     }
                                 },
                                 series: [{
                                     data: trendData,
                                     type: 'bar',
                                     itemStyle: { color: barColor, borderRadius: [4, 4, 0, 0] }
                                 }]
                             });
                         }
                     });
                 }).getMonthlyCategoryBreakdown(selectedYear);
             } catch (e) {
                 console.error("Click handler error:", e);
             }
         });
   }
   
   /**
    * Utility to force update all charts (e.g., when toggling privacy mode).
    */
    function updateAllCharts() {
      const allCharts = [];
      if (typeof myChart !== 'undefined' && myChart) allCharts.push(myChart);
      if (typeof assetChart !== 'undefined' && assetChart) allCharts.push(assetChart);
      if (typeof analyticsChartInstance !== 'undefined' && analyticsChartInstance) allCharts.push(analyticsChartInstance);
      if (typeof expenseStackInstance !== 'undefined' && expenseStackInstance) allCharts.push(expenseStackInstance);
      if (typeof incomeStackInstance !== 'undefined' && incomeStackInstance) allCharts.push(incomeStackInstance);
      if (typeof pensionChartInstance !== 'undefined' && pensionChartInstance) allCharts.push(pensionChartInstance);
      if (typeof tripChartInstance !== 'undefined' && tripChartInstance) allCharts.push(tripChartInstance);
      if (typeof sankeyChartInstance !== 'undefined' && sankeyChartInstance) allCharts.push(sankeyChartInstance);
      if (typeof nwTrendChartInstance !== 'undefined' && nwTrendChartInstance) allCharts.push(nwTrendChartInstance);
      if (typeof evoChartInstance !== 'undefined' && evoChartInstance) allCharts.push(evoChartInstance);
      if (typeof cashflowChartInstance !== 'undefined' && cashflowChartInstance) allCharts.push(cashflowChartInstance);
      if (typeof cpScatterChartInstance !== 'undefined' && cpScatterChartInstance) allCharts.push(cpScatterChartInstance);

      allCharts.forEach(chart => { 
          if (chart) {
              if (typeof chart.update === 'function') chart.update(); // Chart.js
              if (typeof chart.resize === 'function') chart.resize(); // ECharts
          }
      });
    }
   function getChartTheme() {
       const isDark = document.body.classList.contains('dark-mode');
       return {
           text: isDark ? '#b0b0b0' : '#666666',
           grid: isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.05)',
           tooltipBg: isDark ? 'rgba(28, 28, 30, 0.95)' : 'rgba(255, 255, 255, 0.9)',
           tooltipText: isDark ? '#ffffff' : '#000000',
           borderColor: isDark ? '#333333' : '#e5e5ea'
       };
   }
   
   /**
    * Renders the Net Worth and Asset Class Historical Trend Chart.
    * Uses Chart.js with responsive datasets and privacy mode support (hides Y-axis and Tooltips).
    */
   function renderNetWorthTrendChart() {
     const chartDom = document.getElementById('nwTrendChart');
     if (!chartDom) return; 
     
     if (nwTrendChartInstance && typeof nwTrendChartInstance.dispose === 'function') nwTrendChartInstance.dispose();
     else if (nwTrendChartInstance && typeof nwTrendChartInstance.destroy === 'function') nwTrendChartInstance.destroy();
     
     google.script.run.withSuccessHandler(data => {
       const loader = document.getElementById('nw-loading-indicator');
       if (loader) loader.style.display = 'none';
       if (!data || data.error) {
           console.error("Error loading NW Trend data:", data?.error);
           return;
       }
       
       nwTrendChartInstance = echarts.init(chartDom);
       const theme = getChartTheme();
       const isPrivacy = document.body.classList.contains('privacy-mode');
       
       const option = {
         tooltip: {
           trigger: 'axis',
           backgroundColor: theme.tooltipBg,
           textStyle: { color: theme.tooltipText },
           formatter: function (params) {
             let res = params[0].name + '<br/>';
             params.forEach(p => {
                 let isUSD = p.seriesName.includes('USD');
                 if (isPrivacy) {
                     res += p.marker + ' ' + p.seriesName + ': <b>****</b><br/>';
                 } else {
                     let val = new Intl.NumberFormat(isUSD ? 'en-US' : 'it-IT', { style: 'currency', currency: isUSD ? 'USD' : 'EUR', maximumFractionDigits: 0 }).format(p.value);
                     res += p.marker + ' ' + p.seriesName + ': <b>' + val + '</b><br/>';
                 }
             });
             return res;
           }
         },
         legend: {
           bottom: 0,
           type: 'scroll',
           textStyle: { color: theme.text },
           icon: 'circle'
         },
         grid: {
             top: '10px',
             left: '2%',
             right: '2%',
             bottom: '15%',
             containLabel: true
         },
         xAxis: {
             type: 'category',
             data: data.labels,
             axisLine: { show: false },
             axisTick: { show: false },
             axisLabel: { color: theme.text }
         },
         yAxis: {
             type: 'value',
             splitLine: { lineStyle: { color: theme.grid, type: 'dashed' } },
             axisLabel: {
                 color: theme.text,
                 formatter: function(val) {
                     if (document.body.classList.contains('privacy-mode')) return '****';
                     return new Intl.NumberFormat('it-IT', { notation: "compact" }).format(val);
                 }
             }
         },
         series: [
           { name: 'Total Net Worth', type: 'line', data: data.totalNW, itemStyle: { color: '#007aff' }, areaStyle: { color: 'rgba(0, 122, 255, 0.1)' }, lineStyle: { width: 3 }, symbol: 'none', smooth: 0.4, z: 10 },
           { name: 'Liquid Net Worth', type: 'line', data: data.liquidNW, itemStyle: { color: '#34c759' }, lineStyle: { type: 'dashed', width: 2 }, symbol: 'none', smooth: 0.4, z: 9 },
           
           // USD Counterparts (Hidden by default)
           { name: 'Total Net Worth (USD)', type: 'line', data: data.totalNW_USD, itemStyle: { color: '#5ac8fa' }, lineStyle: { type: 'dashed', width: 2 }, symbol: 'none', smooth: 0.4 },
           { name: 'Liquid Net Worth (USD)', type: 'line', data: data.liquidNW_USD, itemStyle: { color: '#30b0c7' }, lineStyle: { type: 'dashed', width: 2 }, symbol: 'none', smooth: 0.4 },
           
           // Asset Classes
           { name: 'Cash', type: 'line', data: data.cash, itemStyle: { color: '#32ade6' }, lineStyle: { width: 2 }, symbol: 'none', smooth: 0.4 },
           { name: 'Cash Eq', type: 'line', data: data.cashEq, itemStyle: { color: '#00c7be' }, lineStyle: { width: 2 }, symbol: 'none', smooth: 0.4 },
           { name: 'Stocks', type: 'line', data: data.stocks, itemStyle: { color: '#5856d6' }, lineStyle: { width: 2 }, symbol: 'none', smooth: 0.4 },
           { name: 'ETFs', type: 'line', data: data.etfs, itemStyle: { color: '#8e8e93' }, lineStyle: { width: 2 }, symbol: 'none', smooth: 0.4 },
           { name: 'Crypto', type: 'line', data: data.crypto, itemStyle: { color: '#ffcc00' }, lineStyle: { width: 2 }, symbol: 'none', smooth: 0.4 },
           { name: 'Pension', type: 'line', data: data.pension, itemStyle: { color: '#fd7e14' }, lineStyle: { width: 2 }, symbol: 'none', smooth: 0.4 }
         ]
       };
       
       // Hide all except total and liquid by default
       option.legend.selected = {
           'Total Net Worth': true,
           'Liquid Net Worth': true,
           'Total Net Worth (USD)': false,
           'Liquid Net Worth (USD)': false,
           'Cash': false,
           'Cash Eq': false,
           'Stocks': false,
           'ETFs': false,
           'Crypto': false,
           'Pension': false
       };
       
       nwTrendChartInstance.setOption(option);
     }).getHistoricalNetWorthTrend();
   }
    
    // Add global resize listener to resize ECharts and Chart.js instances when window size changes
    window.addEventListener('resize', function() {
        if (typeof updateAllCharts === 'function') {
            updateAllCharts();
        }
    });
</script>
