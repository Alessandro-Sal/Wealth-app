<script>
// ==========================================
// TERMINAL DATA ENGINE (JAVASCRIPT)
// ==========================================

// Intercepts DOM changes to create the "Terminal Data Flash" effect 
// whenever a number updates.
const terminalObserver = new MutationObserver((mutations) => {
    if(!document.body.classList.contains('dark-mode')) return;

    mutations.forEach((mutation) => {
        // Look for text node changes
        if (mutation.type === 'characterData' || mutation.type === 'childList') {
            
            // Get the parent element of the modified text
            let target = mutation.target.nodeType === 3 ? mutation.target.parentElement : mutation.target;
            
            // Ensure target is valid and is a data display element
            if (target && target.classList) {
                const isDataField = 
                    target.classList.contains('widget-value') || 
                    target.classList.contains('sensitive') || 
                    target.classList.contains('total-amount') ||
                    target.tagName.toLowerCase() === 'td';

                if (isDataField) {
                    // Remove class, trigger reflow, add class to restart animation
                    target.classList.remove('terminal-flash-active');
                    void target.offsetWidth; 
                    target.classList.add('terminal-flash-active');
                }
            }
        }
    });
});

// Start observing the whole body for dynamic data injection
document.addEventListener("DOMContentLoaded", () => {
    terminalObserver.observe(document.body, { 
        childList: true, 
        subtree: true, 
        characterData: true 
    });
});
</script>
