<script>
   /**

   // --- Form Logic ---
   
 /**
 * Updates the Category dropdown based on the selected Type
 * and toggles sign buttons automatically for Expenses.
 */
function handleTypeChange() {
    const typeSelect = document.getElementById("tType");
    const catSelect = document.getElementById("tCat");
    
    if (!typeSelect || !catSelect) return;
    
    const selectedType = typeSelect.value;
    catSelect.innerHTML = ""; // Clear existing options
    
    // Add default empty option
    const defaultOption = document.createElement("option");
    defaultOption.value = "";
    defaultOption.text = "Select Category...";
    catSelect.appendChild(defaultOption);

    // Retrieve categories from the global configuration fetched from Sheets
    const dynCategories = GLOBAL_APP_CONFIG.categories[selectedType];

    if (dynCategories && dynCategories.length > 0) {
        dynCategories.forEach(cat => {
            const opt = document.createElement("option");
            opt.value = cat;
            opt.text = cat;
            catSelect.appendChild(opt);
        });
    } else {
        // Fallback or specific logic (e.g., Storno, Pension)
        if (selectedType === "Pension") {
            const opt = document.createElement("option");
            opt.value = "Pension Fund";
            opt.text = "Pension Fund";
            catSelect.appendChild(opt);
        }
    }
    
    // Manage specific UI displays (like the Pension inputs)
    const pensionInputs = document.getElementById("pension-inputs");
    const standardInputs = document.getElementById("standard-inputs");
    const debtInputs = document.getElementById("debt-inputs");

    if (selectedType === "Pension") {
        if(pensionInputs) pensionInputs.style.display = "block";
        if(standardInputs) standardInputs.style.display = "none";
        if(debtInputs) debtInputs.style.display = "none";
    } else if (selectedType === "Debt") {
        if(pensionInputs) pensionInputs.style.display = "none";
        if(standardInputs) standardInputs.style.display = "none";
        if(debtInputs) debtInputs.style.display = "block";
    } else {
        if(pensionInputs) pensionInputs.style.display = "none";
        if(standardInputs) standardInputs.style.display = "block";
        if(debtInputs) debtInputs.style.display = "none";
    }

    // Automatically set sign toggles based on selected type
    document.querySelectorAll('.sign-toggle').forEach(icon => {
        let input = icon.parentElement.querySelector('.bank-in');
        if (selectedType === 'Expense') {
            // Set to minus for Expense
            icon.classList.remove('sign-plus');
            icon.classList.add('sign-minus');
            icon.innerHTML = '&#8722;';
            if (input) input.style.color = 'var(--danger)';
        } else {
            // Revert to plus for Income, Transfer, Investment, etc.
            icon.classList.remove('sign-minus');
            icon.classList.add('sign-plus');
            icon.innerText = '+';
            if (input) input.style.color = 'var(--stocks-bg)';
        }
    });
}
   
   function loadCategories() {
     const type = document.getElementById('tType').value;
     const select = document.getElementById('tCat');
     
     select.innerHTML = '';
     let defaultOpt = document.createElement('option'); 
     defaultOpt.value = ""; 
     defaultOpt.text = "-- Select Category --"; 
     select.add(defaultOpt);
     
     // Usa le categorie dinamiche
     const dynamicCats = GLOBAL_APP_CONFIG.categories[type];
     if (dynamicCats) {
         dynamicCats.forEach(c => { 
             let o = document.createElement('option'); 
             o.value = o.text = c; 
             select.add(o); 
         });
     }
     updateNoteSuggestions();
   }
   
   function updateNoteSuggestions() {
     const cat = document.getElementById('tCat').value;
     const nList = document.getElementById('noteList');
     nList.innerHTML = '';
     
     if (notesData[cat]) { 
         notesData[cat].forEach(n => { 
             let opt = document.createElement('option'); 
             opt.value = n; 
             nList.appendChild(opt); 
         }); 
     }
   }
   
   function resetForm() {
     document.getElementById('addTxForm').reset();
     
     const catSelect = document.getElementById('tCat');
     if (catSelect) catSelect.innerHTML = '<option value="">Choose Type...</option>';
     
     document.getElementById('f-stat').innerText = '';
     
     document.querySelectorAll('.sign-toggle').forEach(icon => {
         icon.classList.remove('sign-minus');
         icon.classList.add('sign-plus');
         icon.innerText = '+';
         let input = icon.parentElement.querySelector('.bank-in');
         if (input) input.style.color = 'var(--stocks-bg)';
     });

     // --- NUOVO: Nasconde tutti i moduli speciali ---
     const pensionInputs = document.getElementById("pension-inputs");
     const standardInputs = document.getElementById("standard-inputs");
     const debtInputs = document.getElementById("debt-inputs");
     const reInputs = document.getElementById('realestate-inputs');
     const bondInputs = document.getElementById('bond-inputs');
     
     if(pensionInputs) pensionInputs.style.display = "none";
     if(debtInputs) debtInputs.style.display = "none";
     if(reInputs) reInputs.style.display = "none";
     if(bondInputs) bondInputs.style.display = "none";
     if(standardInputs) standardInputs.style.display = "block";

     const splitToggle = document.getElementById('splitToggle');
     if (splitToggle) {
         splitToggle.checked = false;
         if (typeof toggleSplitSection === 'function') toggleSplitSection();
     }
   }
   
   /**
    * Submits the transaction form.
    * Handles validation, UI feedback (haptic/loading), and server communication.
    */
function sendTransaction() {
     if (navigator.vibrate) navigator.vibrate(50);
     
     const type = document.getElementById('tType').value;
     const btn = document.querySelector('.btn-save:not(.btn-invest)'); 
     
    // --- NEW: DEBT LOGIC BRANCH ---
     if (type === 'Debt') {
         const dName = document.getElementById('debtName').value;
         const dAmt = parseFloat(document.getElementById('debtAmount').value);
         const dRate = parseFloat(document.getElementById('debtRate').value);
         const dYears = parseFloat(document.getElementById('debtYears').value);
         const dDate = document.getElementById('debtStartDate').value;
         const dBankCol = document.getElementById('debtBankCol').value; // <--- NUOVO

         if (!dName || isNaN(dAmt) || isNaN(dRate) || isNaN(dYears) || !dDate || !dBankCol) {
             Swal.fire({ icon: 'warning', title: 'Missing Data', text: 'Fill in all Debt fields, including the Bank Account.' });
             return;
         }

         const originalText = btn.innerText; 
         btn.innerText = "⏳ SAVING..."; 
         btn.classList.add('btn-loading');

         google.script.run.withSuccessHandler(res => {
             btn.innerText = originalText; 
             btn.classList.remove('btn-loading'); 
             Swal.fire({ icon: 'success', title: 'Done!', text: 'Debt added to DB!', showConfirmButton: false, timer: 1500 }); 
             setTimeout(resetForm, 500);
         }).withFailureHandler(err => {
             btn.innerText = originalText; 
             btn.classList.remove('btn-loading'); 
             Swal.fire({ icon: 'error', title: 'Error', text: err.message }); 
         }).addStandaloneDebt({ name: dName, amount: dAmt, rate: dRate, years: dYears, date: dDate, bankCol: dBankCol }); // <--- Passiamo bankCol
         return;
     }

     // Pension Logic Branch
     if (type === 'Pension') {
         const pYear = document.getElementById('penYear').value; 
         const pMonth = document.getElementById('penMonth').value; 
         const pAmt = parseFloat(document.getElementById('penAmount').value); 
         const btn = document.querySelector('.btn-save');
         
         if (isNaN(pAmt) || pAmt === 0) { 
             Swal.fire({ icon: 'warning', title: 'Amount?', text: 'Enter the accrued amount.' }); 
             return; 
         }
         const originalText = btn.innerText; 
         btn.innerText = "⏳ SAVING..."; 
         btn.classList.add('btn-loading');
         
         google.script.run.withSuccessHandler(res => { 
             btn.innerText = originalText; 
             btn.classList.remove('btn-loading'); 
             Swal.fire({ icon: 'success', title: 'Done!', text: res, showConfirmButton: false, timer: 1500 }); 
             fetchPensionData(); 
             // Call resetForm to clear everything
             setTimeout(resetForm, 500);
         }).withFailureHandler(err => { 
             btn.innerText = originalText; 
             btn.classList.remove('btn-loading'); 
             Swal.fire({ icon: 'error', title: 'Error', text: err.message }); 
         }).addPensionTransaction({ year: pYear, month: pMonth, amount: pAmt });
         return; 
     }
     
     // Standard Transaction Logic
     const category = document.getElementById('tCat').value;
     const details = document.getElementById('tDet').value;
     
     if (!type || type === "") { 
         Swal.fire({ icon: 'error', title: 'Oops...', text: 'Select a Type!', timer: 2000, showConfirmButton: false }); 
         return; 
     }
     if (!category || category === "") { 
         Swal.fire({ icon: 'warning', title: 'Missing Category', text: 'Please select a category.', timer: 2000, showConfirmButton: false }); 
         return; 
     }
     
     let amounts = {}; 
     let hasValue = false;
     
     document.querySelectorAll('.input-wrapper').forEach(wrapper => { 
         let i = wrapper.querySelector('.bank-in');
         if(i) {
             let v = parseFloat(i.value); 
             if (!isNaN(v) && v !== 0) { 
                 let isMinus = wrapper.querySelector('.sign-toggle').classList.contains('sign-minus');
                 let finalAmount = Math.abs(v);
                 if (isMinus) finalAmount = finalAmount * -1;
                 
                 amounts[i.getAttribute('data-col')] = finalAmount; 
                 hasValue = true; 
             }
         }
     });
     
     if (!hasValue) { 
         Swal.fire({ icon: 'info', title: 'Amount?', text: 'Enter at least one amount.', timer: 2000, showConfirmButton: false }); 
         return; 
     }
     
     // --- SPLIT LOGIC ---
     let isSplit = document.getElementById('splitToggle') ? document.getElementById('splitToggle').checked : false;
     let splitData = [];
     
     if (isSplit) {
         const friendRows = document.getElementById('split-friends-list').children;
         for(let i=0; i<friendRows.length; i++) {
             let name = friendRows[i].querySelector('.split-friend-name').value || "Friend";
             let amt = parseFloat(friendRows[i].querySelector('.split-friend-amount').value) || 0;
             if(amt > 0) {
                 splitData.push({ who: name, amount: amt });
             }
         }
     }

     const originalText = btn.innerText; 
     btn.innerText = "⏳ SAVING..."; 
     btn.classList.add('btn-loading');
     
     google.script.run.withSuccessHandler(m => { 
         btn.innerText = originalText; 
         btn.classList.remove('btn-loading'); 
         Swal.fire({ icon: 'success', title: 'Saved!', text: details || 'Transaction recorded', showConfirmButton: false, timer: 1500 }); 
         fetchHistory(); 
         fetchBalances(); 
         fetchBudgets();
         fetchSubsStatus();
         fetchActiveCredits();
         setTimeout(resetForm, 500); 
     }).withFailureHandler(err => { 
         btn.innerText = originalText; 
         btn.classList.remove('btn-loading'); 
         Swal.fire({ icon: 'error', title: 'Error', text: err.message }); 
     }).addTransaction({ type, category, details: details || "No Note", amounts, splitData });
   }
   
   function deleteTx(sheet, row) {
     if (navigator.vibrate) navigator.vibrate(50);
     const isDark = document.body.classList.contains('dark-mode');
     
     Swal.fire({ 
         title: 'Delete?', 
         text: "This action is irreversible.", 
         icon: 'warning', 
         showCancelButton: true, 
         confirmButtonColor: '#ff3b30', 
         cancelButtonColor: '#8e8e93', 
         confirmButtonText: 'Yes, delete', 
         cancelButtonText: 'Cancel', 
         background: isDark ? '#1c1c1e' : '#fff', color: isDark ? '#fff' : '#000', iconColor: '#ff3b30' 
     }).then((result) => {
         if (result.isConfirmed) {
             Swal.fire({ title: 'Deleting...', timerProgressBar: true, didOpen: () => { Swal.showLoading() }, background: isDark ? '#1c1c1e' : '#fff', color: isDark ? '#fff' : '#000' });
             google.script.run.withSuccessHandler(res => { 
                 Swal.fire({ icon: 'success', title: 'Deleted!', showConfirmButton: false, timer: 1000, background: isDark ? '#1c1c1e' : '#fff', color: isDark ? '#fff' : '#000' }); 
                 fetchHistory(); 
                 fetchInvestHistory(); 
                 fetchBalances(); 
             }).withFailureHandler(err => { 
                 Swal.fire({ icon: 'error', title: 'Error', text: err.message }); 
             }).deleteRow(sheet, row);
         }
     });
   }
   
function sendInvestment() {
     if (navigator.vibrate) navigator.vibrate(50);
     const btn = document.querySelector('.btn-invest');
     const action = document.getElementById('invAction').value; 
     const bankCol = document.getElementById('invBankCol').value; 
     const withdrawalNote = document.getElementById('invWithdrawalNote').value;
     const type = document.getElementById('invType').value;
     
     if (action === 'Withdrawal' && bankCol === "") { 
         Swal.fire({ icon: 'warning', title: 'Missing Bank', text: 'Select where to credit the withdrawal.' }); 
         return; 
     }
     
     // Initialize base data object
     let data = { 
         type: type, 
         date: document.getElementById('invDate').value, 
         action: action, 
         bankCol: bankCol, 
         note: withdrawalNote 
     };

     if (type === 'RealEstate') {
         data.name = document.getElementById('reName').value;
         data.marketVal = document.getElementById('reMarketVal').value;
         data.loanAmt = document.getElementById('reLoanAmt').value;
         data.rate = document.getElementById('reRate').value;
         data.years = document.getElementById('reYears').value;
         data.startDate = document.getElementById('reStartDate').value;
         data.bankCol = document.getElementById('reBankCol').value; // <--- NUOVO

         if (!data.startDate || !data.marketVal || !data.name) {
             Swal.fire({ icon: 'warning', title: 'Missing Data', text: 'Fill in Date, Name, and Market Value', timer: 2500 });
             return;
         }
         // Controlla che la banca sia selezionata se c'è un mutuo
         if (parseFloat(data.loanAmt) > 0 && !data.bankCol) {
             Swal.fire({ icon: 'warning', title: 'Missing Bank', text: 'Select a bank account for the mortgage payments.', timer: 2500 });
             return;
         }
     } else if (type === 'Bond') {
         data.name = document.getElementById('bondName').value;
         data.isin = document.getElementById('bondIsin').value;
         data.nominal = document.getElementById('bondNominal').value;
         data.price = document.getElementById('bondPrice').value;
         data.coupon = document.getElementById('bondCoupon').value;
         data.tax = document.getElementById('bondTax').value;

         if (!data.date || !data.nominal || !data.price || !data.isin || !data.name) {
             Swal.fire({ icon: 'warning', title: 'Missing Data', text: 'Fill in Date, Name, ISIN, Nominal Value, and Price', timer: 2500 });
             return;
         }
     } else {
         // Standard Assets (Stocks, ETFs, Crypto)
         data.ticker = document.getElementById('invTicker').value;
         data.qty = document.getElementById('invQty').value;
         data.costEur = document.getElementById('invCostEur').value;
         data.costUsd = document.getElementById('invCostUsd').value;

         if (!data.date || !data.ticker || !data.qty || !data.costEur) { 
             Swal.fire({ icon: 'warning', title: 'Missing Data', text: 'Fill in Date, Ticker, Qty, and Cost EUR', timer: 2500 }); 
             return; 
         }
     }
     
     const originalText = btn.innerText; 
     btn.innerText = "🚀 PROCESSING..."; 
     btn.classList.add('btn-loading');
     
     google.script.run.withSuccessHandler(m => { 
         btn.innerText = originalText; 
         btn.classList.remove('btn-loading'); 
         Swal.fire({ icon: 'success', title: 'Saved!', text: m, showConfirmButton: false, timer: 1500 }); 
         
         if(typeof fetchInvestHistory === 'function') fetchInvestHistory(); 
         if(action === 'Withdrawal' && typeof fetchBalances === 'function') fetchBalances(); 
         
         setTimeout(() => { 
             document.getElementById('invForm').reset(); 
             document.getElementById('bank-select-container').style.display = 'none'; 
             document.getElementById('invBankCol').value = ""; 
             document.getElementById('invWithdrawalNote').value = ""; 
             
             // Reset dynamic inputs UI back to default
             if(typeof toggleInvestAssets === 'function') toggleInvestAssets();
             
             if(typeof setTodayDate === 'function') setTodayDate(); 
         }, 1000); 
     }).withFailureHandler(err => { 
         btn.innerText = originalText; 
         btn.classList.remove('btn-loading'); 
         Swal.fire({ icon: 'error', title: 'Server Error', text: err.message }); 
     }).addInvestTransaction(data);
   }
   
   // Add Listener for Investment Action Change

   function openSearch() {
     const sheet = document.getElementById('search-sheet'); 
     const backdrop = document.getElementById('common-backdrop');
     document.getElementById('searchQuery').value = ''; 
     document.getElementById('searchType').value = ''; 
     updateSearchCats();
     document.getElementById('searchResults').innerHTML = '<div style="text-align:center; color:var(--gray); margin-top:20px;">Enter text to search</div>';
     
     closeAllSheets(); 
     sheet.classList.add('active'); 
     backdrop.classList.add('active');
     
     // Lazy load years if needed
     const yearSelect = document.getElementById('searchYear');
     if (yearSelect.options.length <= 1) { 
         google.script.run.withSuccessHandler(years => { 
             yearSelect.innerHTML = '<option value="">All Years</option>'; 
             years.forEach(y => { 
                 let opt = document.createElement('option'); 
                 opt.value = y; 
                 opt.text = y; 
                 yearSelect.add(opt); 
             }); 
         }).getExpenseSheetYears(); 
     }
   }
   
   function updateSearchCats() {
     const type = document.getElementById('searchType').value; 
     const catSelect = document.getElementById('searchCat'); 
     catSelect.innerHTML = '<option value="">All Categories</option>';
     
     const addOpts = (list) => list.forEach(c => { 
         let opt = document.createElement('option'); 
         opt.value = c; 
         opt.text = c; 
         catSelect.add(opt); 
     });
     
     // Usa le categorie dinamiche caricate dal database
     const dynamicCats = GLOBAL_APP_CONFIG.categories;
     
     if (type && dynamicCats[type]) { 
         addOpts(dynamicCats[type]); 
     } else if (!type) { 
         for (const t in dynamicCats) { 
             if (dynamicCats[t]) addOpts(dynamicCats[t]); 
         } 
     }
   }
   
   function performSearch() {
     const query = document.getElementById('searchQuery').value; 
     const type = document.getElementById('searchType').value; 
     const cat = document.getElementById('searchCat').value; 
     const month = document.getElementById('searchMonth').value; 
     const year = document.getElementById('searchYear').value;
     
     const resCont = document.getElementById('searchResults'); 
     resCont.innerHTML = '<div style="text-align:center; color:var(--gray); margin-top:20px;">Loading...</div>';
     
     google.script.run.withSuccessHandler(results => {
         if (results.length === 0) { 
             resCont.innerHTML = '<div style="text-align:center; color:var(--gray); margin-top:20px;">No results found</div>'; 
             return; 
         }
         
         let html = '';
         results.forEach(r => {
             let colorStyle = 'var(--text-main)'; 
             if (r.type === 'Expense') colorStyle = 'var(--danger)'; 
             else if (r.type === 'Income') colorStyle = 'var(--stocks-bg)'; 
             else if (r.type === 'Investment') colorStyle = 'var(--invest-bg)'; 
             else if (r.type === 'Transfer') colorStyle = 'var(--primary)';
             
             html += `<div class="search-res-item"><div class="sr-left"><span class="sr-cat">${r.category} <span style="font-weight:normal; font-size:11px;">(${r.type})</span></span><span class="sr-note">${r.details}</span><span class="sr-date">${r.date}</span></div><div class="sr-amt sensitive" style="color:${colorStyle}">${parseFloat(r.amount).toFixed(2)} €</div></div>`;
         });
         resCont.innerHTML = html;
     }).searchTransactions(query, type, cat, month, year);
   }
   
   // --- Subscriptions ---
   
   /**
 * Opens the Subscriptions/Fixed Expenses sheet and populates the dropdown
 */
function openSubs() {
    closeAllSheets();
    const subsSheet = document.getElementById('subs-sheet');
    const backdrop = document.getElementById('common-backdrop');
    
    if (subsSheet && backdrop) {
        subsSheet.classList.add('active');
        backdrop.classList.add('active');
        
        const subsDropdown = document.getElementById("subsDropdown");
        subsDropdown.innerHTML = '<option value="">Select an expense...</option>';
        
        // Loop through the globally fetched fixed expenses
        GLOBAL_APP_CONFIG.fixedExpenses.forEach(sub => {
            const opt = document.createElement("option");
            opt.value = sub.id;
            
            // Nuova formattazione: mostra sempre l'importo, e aggiunge l'etichetta SPLIT se necessario
            let amtDisplay = `€${sub.amt.toFixed(2)}`;
            if (sub.isSplit) {
                amtDisplay += " - SPLIT 🔁"; 
            }
            
            opt.text = `${sub.note} (${amtDisplay})`;
            
            subsDropdown.appendChild(opt);
        });
    }
}
   
   function renderSubsList(data) {
     const select = document.getElementById('subsDropdown'); 
     select.innerHTML = '<option value="">-- Select Subscription --</option>';
     
     if (!data || data.length === 0) { 
         let opt = document.createElement('option'); 
         opt.text = "No subscriptions configured"; 
         select.add(opt); 
         return; 
     }
     
     data.forEach(sub => { 
         let opt = document.createElement('option'); 
         opt.value = sub.id; 
         let displayAmount = (sub.isSplit && sub.splits) ? sub.splits.reduce((sum, item) => sum + item.amt, 0) : sub.amt; 
         opt.text = `${sub.note} - € ${displayAmount.toFixed(2)}`; 
         select.add(opt); 
     });
   }
   
   function sendSingleSub() {
     const select = document.getElementById('subsDropdown'); 
     const selectedId = select.value;
     
     if (!selectedId || selectedId === "") { 
         Swal.fire({ icon: 'info', text: 'Select a subscription from the list.', confirmButtonColor: '#007aff' }); 
         return; 
     }
     
     const text = select.options[select.selectedIndex].text; 
     const isDark = document.body.classList.contains('dark-mode');
     closeAllSheets(); 
     
     Swal.fire({ 
         title: 'Add Expense?', 
         text: text, 
         icon: 'question', 
         showCancelButton: true, 
         confirmButtonColor: '#007aff', 
         cancelButtonColor: '#8e8e93', 
         confirmButtonText: 'Confirm', 
         cancelButtonText: 'Cancel', 
         background: isDark ? '#1c1c1e' : '#fff', color: isDark ? '#fff' : '#000' 
     }).then((result) => {
         if (result.isConfirmed) {
             const status = document.getElementById('f-stat'); 
             status.innerText = "⏳ Adding Subscription...";
             
             google.script.run.withSuccessHandler(m => { 
                 status.innerText = ""; 
                 Swal.fire({ icon: 'success', title: 'Done!', text: 'Subscription added.', showConfirmButton: false, timer: 1500 }); 
                 fetchHistory(); 
                 fetchBalances(); 
                 fetchBudgets();
                 fetchSubsStatus(); 
             }).withFailureHandler(e => { 
                 Swal.fire({ icon: 'error', title: 'Error', text: e.message }); 
                 status.innerText = ""; 
             }).addSelectedSubs([parseInt(selectedId, 10)]);
         }
     });
   }
   
   // --- Calculators (Tab Calc) ---
   
   let calcExpr = "";
   function toggleCalc() { 
     const sheet = document.getElementById('calc-sheet'); 
     const backdrop = document.getElementById('common-backdrop'); 
     document.getElementById('search-sheet').classList.remove('active'); 
     document.getElementById('invest-search-sheet').classList.remove('active'); 
     document.getElementById('subs-sheet').classList.remove('active'); 
     sheet.classList.toggle('active'); 
     backdrop.classList.toggle('active', sheet.classList.contains('active')); 
   }
   
   function cNum(n) { calcExpr += n; updateCDisp(); }
   function cOp(op) { calcExpr += op; updateCDisp(); }
   function cClear() { calcExpr = ""; updateCDisp(); }
   function cBack() { calcExpr = calcExpr.slice(0, -1); updateCDisp(); }
   function cCalc() { try { calcExpr = eval(calcExpr).toString(); } catch (e) { calcExpr = "Error"; } updateCDisp(); }
   function updateCDisp() { document.getElementById('cDisp').innerText = calcExpr || "0"; }
   
   function switchCalcTab(mode) {
     ['view-calc', 'view-fx', 'view-roi', 'view-loan', 'view-tax', 'view-inf', 'view-fire'].forEach(id => { 
         const el = document.getElementById(id); 
         if (el) el.style.display = 'none'; 
     });
     
     ['tab-btn-c', 'tab-btn-f', 'tab-btn-r', 'tab-btn-l', 'tab-btn-t', 'tab-btn-i', 'tab-btn-fire'].forEach(id => { 
         const btn = document.getElementById(id); 
         if (btn) { btn.style.background = 'transparent'; btn.style.color = '#8e8e93'; } 
     });
     
     let suffix = 'c'; 
     if (mode === 'fx') suffix = 'f'; 
     else if (mode === 'roi') suffix = 'r'; 
     else if (mode === 'loan') suffix = 'l'; 
     else if (mode === 'tax') suffix = 't'; 
     else if (mode === 'inf') suffix = 'i';

   function calcLoan() {
     let P = parseFloat(document.getElementById('loanAmount').value) || 0; 
     let r = (parseFloat(document.getElementById('loanRate').value) || 0) / 100 / 12; 
     let n = (parseFloat(document.getElementById('loanYears').value) || 0) * 12;
     
     if (P === 0 || n === 0) return;
     
     let monthlyPayment = (r === 0) ? P / n : P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1); 
     let totalPaid = monthlyPayment * n; 
     let totalInterest = totalPaid - P;
     
     const fmt = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 }).format(num);
     
     document.getElementById('loanMonthly').innerText = fmt(monthlyPayment); 
     document.getElementById('loanInterest').innerText = fmt(totalInterest); 
     document.getElementById('loanResult').style.display = 'block';
   }
   
   function calcCompound() {
     let P = parseFloat(document.getElementById('roiInit').value) || 0; 
     let PMT = parseFloat(document.getElementById('roiMonth').value) || 0; 
     let r = (parseFloat(document.getElementById('roiRate').value) || 0) / 100; 
     let t = parseFloat(document.getElementById('roiYears').value) || 0; 
     let n = 12;
     
     let total = P * Math.pow(1 + r / n, n * t) + (PMT * (Math.pow(1 + r / n, n * t) - 1)) / (r / n); 
     let totalInvested = P + (PMT * 12 * t); 
     let interest = total - totalInvested;
     
     const fmt = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(num);
     
     document.getElementById('roiTotal').innerText = fmt(total); 
     document.getElementById('roiInterest').innerText = "+ " + fmt(interest); 
     document.getElementById('roiResult').style.display = 'block';
   }
   
   function calcTax() {
     let gross = parseFloat(document.getElementById('taxGross').value) || 0; 
     let rate = parseFloat(document.getElementById('taxRate').value) || 0;
     let tax = gross * (rate / 100); 
     let net = gross - tax;
     
     document.getElementById('taxNet').innerText = "€ " + net.toFixed(2); 
     document.getElementById('taxPaid').innerText = "- € " + tax.toFixed(2); 
     document.getElementById('taxResult').style.display = 'block';
   }
   
   function calcDCA() {
     let oQ = parseFloat(document.getElementById('dcaCurQty').value) || 0; 
     let oP = parseFloat(document.getElementById('dcaCurAvg').value) || 0; 
     let nQ = parseFloat(document.getElementById('dcaNewQty').value) || 0; 
     let nP = parseFloat(document.getElementById('dcaNewPrice').value) || 0;
     
     if ((oQ + nQ) === 0) return;
     
     let totalSpent = (oQ * oP) + (nQ * nP); 
     let totalQty = oQ + nQ; 
     let newAvg = totalSpent / totalQty;
     
     document.getElementById('dcaResult').innerText = "New Avg Price: " + newAvg.toFixed(2); 
     document.getElementById('dcaResult').style.color = (newAvg < oP) ? 'var(--success)' : 'var(--warning)';
   }
   
   function calcBreakEven() {
     let buy = parseFloat(document.getElementById('beBuyPrice').value) || 0; 
     let cur = parseFloat(document.getElementById('beCurPrice').value) || 0;
     
     if (buy === 0 || cur === 0) return;
     
     let lossPct = ((cur - buy) / buy) * 100; 
     let requiredGain = ((buy - cur) / cur) * 100; 
     let resDiv = document.getElementById('beResult');
     
     if (cur >= buy) { 
         resDiv.innerHTML = `<span style="color:var(--stocks-bg)">You are up +${lossPct.toFixed(2)}%!</span>`; 
     } else { 
         resDiv.innerHTML = `Loss: <span style="font-weight:bold">${lossPct.toFixed(2)}%</span> <br> Needs <span style="font-weight:bold; font-size:16px;">+${requiredGain.toFixed(2)}%</span> to recover.`; 
     }
   }
   
   function calcInflation() {
     let amt = parseFloat(document.getElementById('infAmount').value) || 0; 
     let rate = parseFloat(document.getElementById('infRate').value) || 0; 
     let years = parseFloat(document.getElementById('infYears').value) || 0;
     
     let futureVal = amt / Math.pow(1 + (rate / 100), years); 
     let loss = amt - futureVal;
     
     const fmt = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(num);
     
     document.getElementById('infVal').innerText = fmt(futureVal); 
     document.getElementById('infLoss').innerText = "- " + fmt(loss); 
     document.getElementById('infResult').style.display = 'block';
   }
   
   function calcStrategy() {
     let entry = parseFloat(document.getElementById('stratEntry').value) || 0; 
     let tpPct = parseFloat(document.getElementById('stratTp').value) || 0; 
     let slPct = parseFloat(document.getElementById('stratSl').value) || 0;
     
     if (entry === 0) return;
     
     let tpPrice = entry * (1 + (tpPct / 100)); 
     let slPrice = entry * (1 - (slPct / 100));
     
     document.getElementById('resTp').innerText = tpPrice.toFixed(2); 
     document.getElementById('resSl').innerText = slPrice.toFixed(2); 
     document.getElementById('stratResult').style.display = 'block';
   }
   
   function calcFire() {
     let monthly = parseFloat(document.getElementById('fireSpend').value) || 0; 
     let rate = parseFloat(document.getElementById('fireRate').value) || 4;
     
     if (monthly === 0 || rate === 0) return;
     
     let yearly = monthly * 12; 
     let fireNumber = yearly / (rate / 100);
     
     const fmt = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(num);
     
     document.getElementById('fireVal').innerText = fmt(fireNumber); 
     document.getElementById('fireResult').style.display = 'block';
   }

   function toggleSplitLock(btn) {

       if (input.dataset.locked === 'true') {

       } else {
           input.dataset.locked = 'true';
           btn.innerText = '🔒';
           btn.style.opacity = '1';
       }
       updateSplitMath(null);
   }

   function updateSplitMath(changedInput) {
       let totalPaid = getSplitTotalPaid();
       document.getElementById('split-total-paid').innerText = "€ " + totalPaid.toFixed(2);
       
       let myShareInput = document.getElementById('splitMyShare');
       let friendInputs = Array.from(document.querySelectorAll('.split-friend-amount'));
       let allInputs = [myShareInput, ...friendInputs].filter(el => el != null);
       
       if (changedInput && parseFloat(changedInput.value) < 0) changedInput.value = 0;

       // 1. AUTO-LOCK: Lock the input user is actively typing in
       if (changedInput && changedInput.dataset.locked !== 'true') {
           changedInput.dataset.locked = 'true';
           let btn = changedInput.nextElementSibling;
           if (btn && btn.classList.contains('split-lock-btn')) {
               btn.innerText = '🔒';
               btn.style.opacity = '1';
           }
       }

       // 2. Sum locked values
       let lockedSum = 0;
       let unlockedInputs = [];
       
       allInputs.forEach(input => {
           if (input.dataset.locked === 'true' || input === changedInput) {
               lockedSum += (parseFloat(input.value) || 0);
           } else {
               unlockedInputs.push(input);
           }
       });

       // 3. Failsafe: if locked values exceed total paid
       if (lockedSum > totalPaid) {
           if (changedInput) {
               let otherLockedSum = lockedSum - (parseFloat(changedInput.value) || 0);
               let maxAllowed = totalPaid - otherLockedSum;
               if (maxAllowed < 0) maxAllowed = 0;
               changedInput.value = maxAllowed.toFixed(2);
               lockedSum = otherLockedSum + maxAllowed;
           } else {
               // If bank amount was decreased below locked threshold, full reset is safest
               splitEqually();
               return;
           }
       }

       // 4. Distribute remainder ONLY to unlocked inputs
       let remainder = totalPaid - lockedSum;
       if (remainder < 0.01) remainder = 0; // Float precision safeguard

       if (unlockedInputs.length > 0) {
           // Assign perfect float numbers, giving any extra cent to the first unlocked person
           let splitPerOther = Math.floor((remainder / unlockedInputs.length) * 100) / 100;
           let centDiff = remainder - (splitPerOther * unlockedInputs.length);
           
           unlockedInputs.forEach((input, index) => {
               let finalVal = splitPerOther;
               if (index === 0) finalVal += centDiff; // Absorb float remainder
               input.value = finalVal.toFixed(2);
           });
           
       } else if (remainder > 0.01) {
           // 5. If everyone is locked but there is remainder (e.g. removed a friend or bank amount increased):
           // Force unlock 'My Share' to absorb it.
           if (changedInput !== myShareInput && myShareInput) {
               myShareInput.dataset.locked = 'false';
               let btn = myShareInput.nextElementSibling;
               if (btn) { btn.innerText = '🔓'; btn.style.opacity = '0.5'; }
               myShareInput.value = (parseFloat(myShareInput.value) + remainder).toFixed(2);
           } else if (friendInputs.length > 0) {
               // If 'My Share' was the one decreased, pass remainder to first friend
               let firstFriend = friendInputs[0];
               firstFriend.dataset.locked = 'false';
               let btn = firstFriend.nextElementSibling;
               if (btn) { btn.innerText = '🔓'; btn.style.opacity = '0.5'; }
               firstFriend.value = (parseFloat(firstFriend.value) + remainder).toFixed(2);
           }
       }
       
       let toCollect = 0;
       friendInputs.forEach(i => toCollect += (parseFloat(i.value) || 0));
       document.getElementById('splitToCollect').innerText = "€ " + toCollect.toFixed(2);
   }
   
   function splitEqually() {
       let totalPaid = getSplitTotalPaid();
       let friendInputs = document.querySelectorAll('.split-friend-amount');
       let allInputs = [document.getElementById('splitMyShare'), ...Array.from(friendInputs)];
       
       // Force unlock all for equal distribution
       allInputs.forEach(input => {
           if(input) {
               input.dataset.locked = 'false';
               let btn = input.nextElementSibling;
               if(btn && btn.classList.contains('split-lock-btn')) {
                   btn.innerText = '🔓';
                   btn.style.opacity = '0.5';
               }
           }
       });

       let peopleCount = friendInputs.length + 1; 
       
       if (peopleCount > 0 && totalPaid >= 0) {
           // Cent-precision split
           let baseSplit = Math.floor((totalPaid / peopleCount) * 100) / 100;
           let diff = totalPaid - (baseSplit * peopleCount);

           allInputs.forEach((input, index) => { 
               if(input) {
                   let val = baseSplit;
                   if(index === 0) val += diff; // My Share absorbs odd cents
                   input.value = val.toFixed(2); 
               }
           });
           
           document.getElementById('split-total-paid').innerText = "€ " + totalPaid.toFixed(2);
           let toCollect = totalPaid - parseFloat(allInputs[0].value || 0);
           document.getElementById('splitToCollect').innerText = "€ " + toCollect.toFixed(2);
       }
   }
